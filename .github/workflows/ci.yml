name: CI

# Runs on the same push to main that Forge quick-deploys, in parallel with the
# deploy: a red run here reports a problem, it does not stop a release. The
# gate is the pre-push hook (.githooks/pre-push).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (PHP)
    runs-on: ubuntu-latest
    env:
      # Nova is installed from the private nova.laravel.com Composer repo.
      # Add a repository secret named COMPOSER_AUTH containing, e.g.:
      # {"http-basic":{"nova.laravel.com":{"username":"you@example.com","password":"YOUR_NOVA_LICENSE_KEY"}}}
      COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # A known advisory against composer.lock fails this job. CI runs alongside
      # the Forge deploy that the same push to main triggers and does not gate
      # it; the pre-push hook (.githooks/pre-push) runs the same audits, Pint,
      # ESLint and the build before a push to main leaves the machine.
      - name: Audit Composer dependencies
        run: composer audit --locked

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      # Non-blocking until the pre-existing PHPStan level-5 findings are cleared,
      # then remove continue-on-error to make it a required gate.
      - name: Static analysis (PHPStan)
        run: composer phpstan
        continue-on-error: true

  frontend:
    name: Frontend (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Production dependencies only: what ships in the browser bundle. Every
      # package imported by resources/js belongs in "dependencies" so this sees
      # it; build tooling (vite, plugins, eslint, tailwind) stays in devDependencies.
      # laravel-vite-plugin is the one dev package with a bundled import (the
      # dependency-free inertia-helpers resolvePageComponent).
      - name: Audit npm dependencies
        run: npm audit --omit=dev

      - name: Build assets
        run: npm run build

      # Passes with zero errors; remaining findings are warnings only.
      - name: Lint (ESLint)
        run: npm run lint

  journeys:
    name: User journeys
    runs-on: ubuntu-latest
    env:
      COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # impact analysis needs the merge base

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      # Schema, references, generated INDEX.md, coverage baseline, unmapped
      # routes (strict), and static route extraction vs `route:list`.
      - name: Validate journey catalog
        run: php bin/journeys validate --strict --with-app

      - name: Analyzer tests
        run: php artisan test tests/Unit/Journeys
        env:
          JOURNEYS_REQUIRE_NODE: '1'

      - name: Impact analysis
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then BASE="HEAD~1"; fi
          php bin/journeys impacted --base "$BASE"
          php bin/journeys impacted --base "$BASE" --json > journeys-impact.json
          php bin/journeys coverage --json > journeys-coverage.json
          php bin/journeys graph --json > journeys-graph.json
          # Mandatory: new routes need a journey; recorded coverage must not drop.
          php -r '$r = json_decode(file_get_contents("journeys-impact.json"), true);
            foreach ($r["new_unmapped_routes"] as $x) echo "::error::new route without a journey: $x\n";
            foreach ($r["coverage_regressions"] as $x) echo "::error::$x\n";
            exit($r["new_unmapped_routes"] || $r["coverage_regressions"] ? 1 : 0);'

      - name: Upload journey reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-reports
          path: journeys-*.json
          if-no-files-found: ignore
