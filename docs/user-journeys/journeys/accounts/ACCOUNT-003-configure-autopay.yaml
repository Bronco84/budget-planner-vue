schema: 1
id: ACCOUNT-003
name: Owner configures credit-card autopay from a checking or savings account
domain: accounts
status: implemented
priority: medium
summary: >
  For a Plaid credit card with liability (statement) data, the owner enables or
  disables autopay in the credit-card details panel, choosing a checking or savings
  source account in the same budget and an optional fixed amount override. The
  dashboard projections then deduct the statement payment from the source account.
actors:
  - budget owner
preconditions:
  - the account is a Plaid credit card with liability data
  - a Plaid depository checking/savings account exists in the same budget
routes:
  - accounts.updateAutopay
depends_on:
  - path: resources/js/Components/AutopayConfiguration.vue
    reason: form posting to the autopay endpoint
  - path: resources/js/Components/CreditCardDetails.vue
    reason: hosts the autopay configuration on the dashboard
  - path: app/Models/Account.php
    reason: isAutopayEligible / canBeAutopaySource rules
integrations:
  - Plaid liabilities data (eligibility)
steps:
  - action: toggle autopay and choose a source account (POST /budgets/{budget}/accounts/{account}/autopay)
    expected: autopay fields saved; back with success message naming the source account
  - action: disable autopay
    expected: autopay_enabled false and source cleared
postconditions:
  - account autopay_enabled / autopay_source_account_id / autopay_amount_override_cents updated
business_rules:
  - only credit cards with statement data are eligible
  - source account is required when enabling, must be in the same budget, must be Plaid depository checking/savings, and cannot be the card itself
  - amount override is a non-negative integer of cents
  - source account and amount override are optional keys; omitted means null
  - the account must pass AccountPolicy::update (budget owner), like the other account mutators
scenarios:
  - id: enable_autopay
    kind: happy_path
    description: Enabling autopay with a valid source account saves the configuration.
    coverage: covered
    tests:
      - tests/Feature/Accounts/AutopayValidationTest.php::enabling autopay with a checking source saves the configuration
  - id: disable_autopay
    kind: alternate
    description: Disabling autopay clears the source account, even when the optional fields are omitted from the request.
    coverage: covered
    tests:
      - tests/Feature/Accounts/AutopayValidationTest.php::disabling autopay without sending the optional fields clears the configuration
  - id: ineligible_account_rejected
    kind: validation
    description: Non-credit-card or no-statement accounts get an error flash and no change.
    coverage: covered
    tests:
      - tests/Feature/Accounts/AutopayValidationTest.php::autopay is rejected for accounts that are not credit cards with statement data
  - id: invalid_source_rejected
    kind: validation
    description: Missing source, a non-depository source, or the card itself is rejected with an error flash.
    coverage: covered
    tests:
      - tests/Feature/Accounts/AutopayValidationTest.php::autopay is rejected for a missing, non-depository or self source account
  - id: source_from_other_budget_rejected
    kind: authorization
    description: A source account id from another budget is rejected ("must be in the same budget").
    coverage: uncovered
  - id: other_users_account_forbidden
    kind: authorization
    description: Posting autopay for another user's budget returns 403 (can:view,budget); cross-budget account returns 404.
    coverage: partial
    tests:
      - tests/Feature/Accounts/AutopayValidationTest.php::autopay cannot be configured on another users account
    note: the 403 for another user's budget is covered; the cross-budget 404 is not asserted.
known_issues: []
confidence: medium
evidence:
  - app/Http/Controllers/AccountController.php updateAutopay
  - resources/js/Components/AutopayConfiguration.vue
last_verified: null
