schema: 1
id: ADMIN-001
name: Administrator manages application data in the Nova panel
domain: admin
status: implemented
priority: medium
summary: >
  An administrator opens /nova to browse and edit application records (users, budgets,
  accounts, transactions, Plaid connections/accounts/transactions/holdings, payoff plans,
  recurring templates, chat conversations and messages, files, preferences) through
  Laravel Nova resources and the Main dashboard. Access is controlled by the viewNova
  gate (is_admin only). Nova has no login or password reset of its own: it shares the
  app's web session, so an admin signs in with a passkey or magic link and guests are
  redirected to the app's /login. Nova registers its own routes, so none appear in the
  route files.
actors:
  - administrator
preconditions:
  - user has is_admin true
  - user is signed in to the app (passkey or magic link)
routes: []
depends_on:
  - path: app/Nova/**
    reason: Nova resources and the Main dashboard
  - path: app/Providers/NovaServiceProvider.php
    reason: viewNova gate (is_admin only), Nova routes without auth/password-reset routes (login redirects to the app's /login), no Fortify password features
  - path: config/nova.php
    reason: path (/nova), guard and middleware stack
  - path: database/migrations/2026_10_31_250000_grant_admin_to_owner_account.php
    reason: grants is_admin to the previously allowlisted owner email so the gate change cannot lock the owner out
  - path: app/Services/BudgetDeletionService.php
    reason: the Budget resource's beforeDelete deletes through it (attachments, unused S3 objects, activity, Plaid items)
  - path: app/Services/FileService.php
    reason: the FileAttachment resource's beforeDelete detaches through it (unused file and S3 object removed)
  - path: app/Services/PlaidService.php
    reason: the Account resource's beforeDelete calls deleteConnectionIfEmpty (empty connection and its Plaid item removed)
  - path: app/Models/Account.php
    reason: deletionBlockedReason() is the delete guard shared with AccountController::destroy (ACCOUNT-002)
  - path: app/Nova/Actions/LiftChatBan.php
    reason: User resource action to lift a chat ban (see ADMIN-002)
integrations:
  - Laravel Nova
steps:
  - action: sign in to the app (passkey or magic link), then visit /nova as an admin
    expected: Nova dashboard loads using the app session
  - action: open a resource (e.g. Users, Plaid Connections) and view or edit a record
    expected: resource index/detail/edit pages work
postconditions:
  - edits are persisted via Nova
business_rules:
  - viewNova passes only when is_admin === true (no email allowlist)
  - Nova has no password login, password reset or password update; /nova/login redirects to the app's /login and Nova logout uses the app's logout route
  - the Nova User resource has no Password field (accounts are passwordless)
  - a one-off data migration set is_admin for the previously allowlisted owner email; its down() is a no-op so a rollback cannot lock the owner out
  - is_admin is not mass-assignable
  - deleting a budget from Nova runs BudgetDeletionService, the same cleanup as deleting it in the app (BUDGET-005); BudgetPolicy still limits it to the budget's owner
  - deleting an account from Nova applies the app's guards (refused with a validation error while it has transfers or transactions) and removes its Plaid connection and the Item at Plaid when it was the connection's last account (ACCOUNT-002)
  - deleting a file attachment from Nova detaches it through FileService, removing a file and S3 object nothing else uses
  - files cannot be deleted from Nova (single, bulk or force delete); a bare row delete would leave the S3 object and activity rows, so an admin deletes the file's attachments instead
  - Plaid connections cannot be deleted from Nova (single, bulk or force delete); a bare delete would leave the Item live at Plaid, so owners unlink connections in the app
  - users cannot be deleted from Nova (single, bulk or force delete); a bare row delete would skip AccountDeletionService, so users delete their own accounts from Profile (PROFILE-002)
scenarios:
  - id: admin_gate_allows
    kind: happy_path
    description: A user with is_admin true passes the viewNova gate.
    coverage: covered
    tests:
      - tests/Feature/SecurityNovaAccessTest.php::admin users can access nova
  - id: admin_loads_dashboard
    kind: happy_path
    description: An admin can load /nova over HTTP.
    coverage: covered
    tests:
      - tests/Feature/Admin/NovaHttpAccessTest.php::an admin can load the nova dashboard over http
  - id: is_admin_must_be_true
    kind: edge
    description: Revoking is_admin removes access.
    coverage: covered
    tests:
      - tests/Feature/SecurityNovaAccessTest.php::is_admin must be explicitly true to access nova
      - tests/Feature/SecurityNovaAccessTest.php::users without is_admin flag cannot access nova
  - id: is_admin_not_mass_assignable
    kind: validation
    description: is_admin cannot be set via fill().
    coverage: covered
    tests:
      - tests/Feature/SecurityNovaAccessTest.php::is_admin cannot be mass-assigned via fill
  - id: non_admin_denied
    kind: authorization
    description: A non-admin user fails the viewNova gate.
    coverage: covered
    tests:
      - tests/Feature/SecurityNovaAccessTest.php::non-admin users cannot access nova
  - id: non_admin_http_denied
    kind: authorization
    description: A non-admin requesting /nova over HTTP receives 403.
    coverage: covered
    tests:
      - tests/Feature/Admin/NovaHttpAccessTest.php::a non-admin requesting nova over http receives 403
  - id: guest_redirected
    kind: authentication
    description: A guest requesting /nova is redirected to the app's /login (passkey / magic link).
    coverage: covered
    tests:
      - tests/Feature/Admin/NovaHttpAccessTest.php::a guest requesting nova is redirected to the app login page
  - id: admin_uses_app_session
    kind: happy_path
    description: An admin signed in through the app's web session reaches Nova without a separate Nova login.
    coverage: covered
    tests:
      - tests/Feature/Admin/NovaHttpAccessTest.php::an admin signed in through the app session reaches nova
  - id: no_password_login
    kind: authentication
    description: Nova's login only redirects to the app login (posting a password does not sign in), and the password reset and password update routes do not exist.
    coverage: covered
    tests:
      - tests/Feature/Admin/NovaHttpAccessTest.php::nova has no password login or password reset routes
  - id: email_allowlist_removed
    kind: authorization
    description: The previously allowlisted email without is_admin is denied.
    coverage: covered
    tests:
      - tests/Feature/SecurityNovaAccessTest.php::nova access depends on is_admin only, not on an email allowlist
  - id: owner_keeps_access_after_deploy
    kind: recovery
    description: The data migration grants is_admin to the previously allowlisted owner (case-insensitive), touches no one else, is a no-op when the owner does not exist, and its down() does not revoke it.
    coverage: covered
    tests:
      - tests/Feature/SecurityNovaAccessTest.php::the owner admin migration grants is_admin to the previously allowlisted email
      - tests/Feature/SecurityNovaAccessTest.php::the owner admin migration is a no-op when the owner account does not exist
  - id: nova_user_delete_denied
    kind: authorization
    description: An admin's single, bulk ("all") and force delete of a user through Nova's API deletes nothing, and the user resource reports it cannot be deleted.
    coverage: covered
    tests:
      - tests/Feature/Admin/NovaDeletionTest.php::an admin cannot delete a user through nova
      - tests/Feature/Admin/NovaDeletionTest.php::nova does not offer deleting a user
  - id: nova_budget_delete_cleans_up
    kind: happy_path
    description: Deleting a budget through Nova's API removes its budget and transaction attachments, unused files and S3 objects, its activity history and its Plaid items at Plaid, and keeps a file another budget still uses.
    coverage: covered
    tests:
      - tests/Feature/Admin/NovaDeletionTest.php::deleting a budget from nova cleans up like deleting it in the app
  - id: nova_file_attachment_delete_cleans_up
    kind: happy_path
    description: Deleting file attachments through Nova's API removes a file nothing else uses from S3 and keeps one still attached elsewhere.
    coverage: covered
    tests:
      - tests/Feature/Admin/NovaDeletionTest.php::deleting a file attachment from nova removes a file nothing else uses from S3
  - id: nova_account_delete_cleans_up_plaid
    kind: happy_path
    description: Deleting a connection's last account through Nova's API removes the connection and its Item at Plaid; deleting one of several keeps them.
    coverage: covered
    tests:
      - tests/Feature/Admin/NovaDeletionTest.php::deleting the last account of a plaid connection from nova removes the connection and its plaid item
      - tests/Feature/Admin/NovaDeletionTest.php::deleting one of several accounts on a plaid connection from nova keeps the connection
  - id: nova_account_delete_guarded
    kind: validation
    description: Nova refuses (422) to delete an account that has transactions or transfers, and the account stays.
    coverage: covered
    tests:
      - tests/Feature/Admin/NovaDeletionTest.php::nova refuses to delete an account with transactions
      - tests/Feature/Admin/NovaDeletionTest.php::nova refuses to delete an account with transfers
  - id: nova_file_delete_denied
    kind: authorization
    description: An admin's single and bulk ("all") delete of a file through Nova's API deletes nothing (row, attachments and S3 object stay), and the File resource reports it cannot be deleted or force deleted.
    coverage: covered
    tests:
      - tests/Feature/Admin/NovaDeletionTest.php::an admin cannot delete a file through nova
  - id: nova_plaid_connection_delete_denied
    kind: authorization
    description: An admin's single, bulk ("all") and force delete of a Plaid connection through Nova's API deletes nothing and calls Plaid for nothing, and the resource reports it cannot be deleted or force deleted.
    coverage: covered
    tests:
      - tests/Feature/Admin/NovaDeletionTest.php::an admin cannot delete a plaid connection through nova
known_issues:
  - The Nova File resource's Uploaded By field names an `uploader` relation, but App\Models\File defines `uploadedBy`, so a File detail request returns 500
confidence: medium
evidence:
  - app/Providers/NovaServiceProvider.php gate(), routes()
  - app/Nova/User.php
  - tests/Feature/SecurityNovaAccessTest.php
last_verified: null
