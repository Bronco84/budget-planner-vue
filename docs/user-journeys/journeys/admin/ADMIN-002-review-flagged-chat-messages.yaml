schema: 1
id: ADMIN-002
name: Administrator reviews flagged chat messages in Nova
domain: admin
status: implemented
priority: low
summary: >
  Messages flagged by chat moderation (CHAT-002) are stored as FlaggedChatMessage rows
  with flag type, content excerpt, action taken and request metadata. An administrator
  reviews them in the Nova FlaggedChatMessage resource and can mark them reviewed. The
  Lift Chat Ban action (on Flagged Chat Messages and Users) lifts a user's chat ban.
actors:
  - administrator
preconditions:
  - user passes the viewNova gate
  - moderation has flagged at least one message
routes: []
depends_on:
  - path: app/Nova/FlaggedChatMessage.php
    reason: Nova resource listing flagged messages with Reviewed toggle
  - path: app/Models/FlaggedChatMessage.php
    reason: flagged message model
  - path: app/Services/ChatService.php
    reason: flagMessage() creates the rows
  - path: app/Nova/Actions/LiftChatBan.php
    reason: Nova action that lifts the chat ban of selected users / flag authors
  - path: app/Services/ContentModerationService.php
    reason: liftBan() clears the ban and offense cache entries
integrations:
  - Laravel Nova
steps:
  - action: open Flagged Chat Messages in Nova
    expected: list of flags with user, conversation and flag type
  - action: open a record and set Reviewed
    expected: record saved as reviewed
  - action: run Lift Chat Ban on a flagged message (or on a user)
    expected: the author's chat ban and offense history are cleared; they can chat again
postconditions:
  - reviewed flags are distinguishable from unreviewed ones
business_rules:
  - stored content is truncated to 1000 characters; metadata includes IP and user agent
  - lifting a ban clears both the ban and the offense history (otherwise the next offense would re-ban immediately); the hourly message limit is not reset
  - the Message relation is optional in Nova; ChatService::flagMessage() never sets message_id (blocked messages are not stored), so a required field would make every flag unsavable
scenarios:
  - id: review_flag
    kind: happy_path
    description: An admin can list flagged messages and mark one reviewed.
    coverage: covered
    tests:
      - tests/Feature/Admin/NovaHttpAccessTest.php::an admin can list flagged chat messages and mark one reviewed
  - id: no_flags
    kind: empty_state
    description: With no flags the resource index is empty.
    coverage: covered
    tests:
      - tests/Feature/Admin/NovaHttpAccessTest.php::the flagged chat message index is empty when nothing is flagged
  - id: non_admin_denied
    kind: authorization
    description: Non-admins cannot reach the resource (viewNova gate).
    coverage: covered
    tests:
      - tests/Feature/SecurityNovaAccessTest.php::non-admin users cannot access nova
      - tests/Feature/Admin/NovaHttpAccessTest.php::a non-admin cannot list or update flagged chat messages over http
  - id: lift_chat_ban
    kind: recovery
    description: An admin lifts a chat ban from a user or a flagged message; only the selected users' ban and offense history are cleared.
    coverage: covered
    tests:
      - tests/Feature/Admin/LiftChatBanTest.php::liftBan clears the users chat ban and offense history only
      - tests/Feature/Admin/LiftChatBanTest.php::the lift chat ban action lifts the ban for selected users
      - tests/Feature/Admin/LiftChatBanTest.php::the lift chat ban action lifts the ban for the author of a flagged message
      - tests/Feature/Admin/LiftChatBanTest.php::the lift chat ban action is offered on the user and flagged message resources
known_issues:
  - there is no manual ban action; bans are automatic and cache-only, so they are lost if the cache is cleared.
confidence: medium
evidence:
  - app/Nova/FlaggedChatMessage.php
  - app/Services/ChatService.php flagMessage()
last_verified: null
