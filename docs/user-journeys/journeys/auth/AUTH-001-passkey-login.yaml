schema: 1
id: AUTH-001
name: Guest signs in with a passkey
domain: auth
status: implemented
priority: critical
summary: >
  A guest opens the login page, requests a WebAuthn assertion challenge, completes
  the passkey ceremony in the browser and is signed in. A trusted-device cookie is
  issued so later visits can auto-login. Passwords are not supported.
actors:
  - guest
preconditions:
  - user account exists with at least one registered passkey
routes:
  - login
  - GET /
  - webauthn.login.options
  - webauthn.login
depends_on:
  - path: resources/js/vendor/webauthn/**
    reason: browser-side WebAuthn helper loaded by the login page
integrations:
  - WebAuthn (laragear/webauthn), browser credential API
steps:
  - action: visit / or /login
    expected: PasskeyLogin page rendered (/ redirects to login)
  - action: request assertion options (POST webauthn/login/options)
    expected: JSON challenge returned, credentials with empty ids filtered out
  - action: submit signed assertion (POST webauthn/login)
    expected: 204, session authenticated, trusted-device cookie queued
postconditions:
  - user is authenticated
  - a TrustedDevice record exists for this browser
business_rules:
  - login options are rate limited to 10/min and are not guest-only, so an auto-logged-in request still receives JSON
  - a failed assertion returns 422 without creating a session
  - challenges are single use (pulled from the session on the first attempt)
  - an assertion whose signature counter does not advance past the stored one is treated as a cloned authenticator and the credential is disabled; authenticators that always report 0 (synced passkeys) are allowed
scenarios:
  - id: login_page_renders
    kind: happy_path
    description: Guest can load the login page.
    coverage: covered
    tests:
      - tests/Feature/Auth/AuthenticationTest.php::test_login_screen_can_be_rendered
  - id: options_return_challenge
    kind: happy_path
    description: Guest receives a JSON assertion challenge.
    coverage: covered
    tests:
      - tests/Feature/WebAuthnLoginOptionsTest.php::guest can fetch webauthn login options as json
  - id: authenticated_options_stay_json
    kind: edge
    description: An already-authenticated (trusted device) request still gets JSON, not an HTML redirect.
    coverage: covered
    tests:
      - tests/Feature/WebAuthnLoginOptionsTest.php::an authenticated request to login options returns json, not an html redirect
  - id: successful_assertion_signs_in
    kind: happy_path
    description: A valid assertion authenticates the user and issues a trusted-device cookie.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyLoginCeremonyTest.php::a valid passkey assertion signs the user in and issues a trusted device cookie'
  - id: invalid_assertion_rejected
    kind: validation
    description: An invalid or unknown assertion returns 422 and no session is created.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyLoginEndpointTest.php::an invalid passkey assertion is rejected with 422 and no session or device is created'
      - 'tests/Feature/Auth/PasskeyLoginEndpointTest.php::a malformed passkey assertion payload is rejected with 422'
      - 'tests/Feature/Auth/PasskeyLoginCeremonyTest.php::a tampered or mismatched passkey assertion is rejected with 422 and no session'
      - 'tests/Feature/Auth/PasskeyLoginCeremonyTest.php::an assertion without a prior challenge is rejected'
      - 'tests/Feature/Auth/PasskeyLoginCeremonyTest.php::a replayed assertion is rejected because the challenge is single use'
  - id: cloned_authenticator_disabled
    kind: edge
    description: An assertion whose signature counter does not advance (cloned authenticator) is rejected with 422 and the credential is disabled so it can no longer sign in.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyLoginCeremonyTest.php::a cloned authenticator whose counter does not advance is rejected and the credential disabled'
  - id: counterless_authenticator_signs_in
    kind: alternate
    description: An authenticator that always reports a zero signature counter (e.g. synced passkeys) can sign in repeatedly.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyLoginCeremonyTest.php::authenticators that do not implement a signature counter can sign in repeatedly'
  - id: options_rate_limited
    kind: edge
    description: Login option requests beyond 10 per minute are throttled.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyLoginEndpointTest.php::passkey login option requests beyond ten per minute are throttled'
      - 'tests/Feature/Auth/PasskeyLoginEndpointTest.php::passkey login options are available again after the throttle window'
  - id: authorization
    kind: authorization
    description: Endpoints are intentionally public; there is no resource ownership to enforce.
    coverage: not_applicable
    note: guest-facing entry point; abuse is limited by throttling instead.
confidence: high
evidence:
  - routes/web.php webauthn group and routes/auth.php guest group
  - app/Http/Controllers/WebAuthn/WebAuthnLoginController.php
last_verified: null
