schema: 1
id: AUTH-001
name: Guest signs in with a passkey
domain: auth
status: implemented
priority: critical
summary: >
  A guest opens the login page, requests a WebAuthn assertion challenge, completes
  the passkey ceremony in the browser and is signed in. A trusted-device cookie is
  issued so later visits can auto-login. Passwords are not supported.
actors:
  - guest
preconditions:
  - user account exists with at least one registered passkey
routes:
  - login
  - GET /
  - webauthn.login.options
  - webauthn.login
depends_on:
  - path: config/passkeys.php
    reason: relying party ID and allowed origins the assertion is verified against (WEBAUTHN_ID / WEBAUTHN_ORIGINS)
  - path: database/migrations/2026_11_04_000049_move_webauthn_credentials_to_passkeys.php
    reason: copies passkeys registered under laragear/webauthn into the passkeys table so they keep signing in
integrations:
  - WebAuthn (laravel/passkeys on web-auth/webauthn-lib), browser credential API
steps:
  - action: visit / or /login
    expected: PasskeyLogin page rendered (/ redirects to login)
  - action: request assertion options (POST webauthn/login/options)
    expected: JSON challenge returned with no allowCredentials (usernameless); the authenticator offers its discoverable passkeys
  - action: submit signed assertion (POST webauthn/login)
    expected: 204, session authenticated, trusted-device cookie queued
postconditions:
  - user is authenticated
  - a TrustedDevice record exists for this browser
business_rules:
  - login is usernameless (discoverable passkeys only); the login page has no email field and the options endpoint ignores any email, so it cannot reveal whether an address has an account
  - login options are rate limited to 10/min and are not guest-only, so an auto-logged-in request still receives JSON
  - a failed assertion returns 422 without creating a session
  - challenges are single use (pulled from the session on the first attempt)
  - the trusted device is recognised by the device_token cookie the browser already holds, not by fingerprint (browser family + OS is shared by other machines); a browser without a cookie gets a new device row and a NewDeviceLogin email
  - an assertion whose signature counter does not advance past the stored one is treated as a cloned authenticator and rejected (the passkey itself stays usable by the genuine authenticator, whose counter advances; laravel/passkeys has no disabled state); authenticators that always report 0 (synced passkeys) are allowed
  - user verification is "preferred", not required, as it was under laragear/webauthn
  - passkeys registered under laragear/webauthn were copied into passkeys by migration 2026_11_04_000049 (public key PEM re-encoded as COSE, same credential id, user handle, counter and name), so they sign in unchanged; the old webauthn_credentials table is kept only so that migration can roll back, and is pruned when a passkey or account is deleted
  - the first sign-in from a new device emails a NewDeviceLogin alert, sent during the request unless auth.magic_link_queue is on (the same switch as magic links, off until production runs a queue worker); a mail failure is reported and never fails the sign-in
scenarios:
  - id: login_page_renders
    kind: happy_path
    description: Guest can load the login page.
    coverage: covered
    tests:
      - tests/Feature/Auth/AuthenticationTest.php::test_login_screen_can_be_rendered
  - id: options_return_challenge
    kind: happy_path
    description: Guest receives a JSON assertion challenge.
    coverage: covered
    tests:
      - tests/Feature/WebAuthnLoginOptionsTest.php::guest can fetch webauthn login options as json
  - id: options_do_not_reveal_accounts
    kind: authorization
    description: Login options are the same for a registered email and an unknown one (no allowCredentials), so they cannot be used to enumerate accounts.
    coverage: covered
    tests:
      - tests/Feature/WebAuthnLoginOptionsTest.php::login options are the same for a registered email and an unknown one
  - id: authenticated_options_stay_json
    kind: edge
    description: An already-authenticated (trusted device) request still gets JSON, not an HTML redirect.
    coverage: covered
    tests:
      - tests/Feature/WebAuthnLoginOptionsTest.php::an authenticated request to login options returns json, not an html redirect
  - id: successful_assertion_signs_in
    kind: happy_path
    description: A valid assertion authenticates the user and issues a trusted-device cookie.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyLoginCeremonyTest.php::a valid passkey assertion signs the user in and issues a trusted device cookie'
      - 'tests/playwright/passkeys.spec.js::a user signs out and signs back in with their passkey'
  - id: invalid_assertion_rejected
    kind: validation
    description: An invalid or unknown assertion returns 422 and no session is created.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyLoginEndpointTest.php::an invalid passkey assertion is rejected with 422 and no session or device is created'
      - 'tests/Feature/Auth/PasskeyLoginEndpointTest.php::a malformed passkey assertion payload is rejected with 422'
      - 'tests/Feature/Auth/PasskeyLoginCeremonyTest.php::a tampered or mismatched passkey assertion is rejected with 422 and no session'
      - 'tests/Feature/Auth/PasskeyLoginCeremonyTest.php::an assertion without a prior challenge is rejected'
      - 'tests/Feature/Auth/PasskeyLoginCeremonyTest.php::a replayed assertion is rejected because the challenge is single use'
  - id: cloned_authenticator_rejected
    kind: edge
    description: An assertion whose signature counter does not advance (cloned authenticator) is rejected with 422 and leaves the stored counter alone; the genuine authenticator still signs in.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyLoginCeremonyTest.php::a cloned authenticator whose counter does not advance is rejected'
  - id: cloned_authenticator_disabled
    kind: edge
    description: Under laragear/webauthn a cloned authenticator's passkey was marked disabled.
    coverage: not_applicable
    note: laravel/passkeys has no disabled state; a cloned authenticator is rejected instead (see cloned_authenticator_rejected). Kept so the id is not reused.
  - id: counterless_authenticator_signs_in
    kind: alternate
    description: An authenticator that always reports a zero signature counter (e.g. synced passkeys) can sign in repeatedly.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyLoginCeremonyTest.php::authenticators that do not implement a signature counter can sign in repeatedly'
  - id: new_device_alert_sent
    kind: alternate
    description: A sign-in that trusts a new device sends the new-device alert synchronously by default, and queues it only when the queue switch is on.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyLoginCeremonyTest.php::signing in on a new device sends the alert immediately unless the queue switch is on'
  - id: new_device_alert_failure_does_not_fail_login
    kind: recovery
    description: When the new-device alert cannot be sent, the error is reported and the sign-in still returns 204 with the trusted-device cookie.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyLoginCeremonyTest.php::a new device alert that fails to send does not fail the passkey sign-in'
  - id: relogin_reuses_device_by_cookie
    kind: edge
    description: Signing in again from a browser that holds a device cookie refreshes that device (moving a legacy fingerprint to the current format) and sends no new-device email, even if the browser has updated since.
    coverage: covered
    tests:
      - tests/Feature/Auth/TrustedDeviceFingerprintTest.php::signing in again from a legacy device whose browser has since updated reuses it without a new device email
  - id: same_browser_other_machine_is_new_device
    kind: authentication
    description: Another machine with the same browser and OS but no device cookie gets its own device and a new-device alert.
    coverage: covered
    tests:
      - tests/Feature/Auth/TrustedDeviceFingerprintTest.php::a second machine with the same browser and os is a new device and sends an alert
  - id: legacy_laragear_passkey_signs_in
    kind: edge
    description: A passkey stored by laragear/webauthn (encrypted PEM, UUID user handle) is copied by the migration and completes a real usernameless assertion afterwards; a different key, a lower counter, and disabled, orphaned or undecryptable rows are not carried over or rejected; rollback drops passkeys and leaves the old rows.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyLegacyMigrationTest.php::a passkey stored by laragear still signs the user in after the migration'
      - 'tests/Feature/Auth/PasskeyLegacyMigrationTest.php::a migrated passkey still rejects a signature from a different key'
      - 'tests/Feature/Auth/PasskeyLegacyMigrationTest.php::the migration carries the sign counter so a replayed lower counter is still refused'
      - 'tests/Feature/Auth/PasskeyLegacyMigrationTest.php::disabled, orphaned and unreadable laragear rows are skipped and the rest are copied'
      - 'tests/Feature/Auth/PasskeyLegacyMigrationTest.php::rolling the migration back drops passkeys and leaves the laragear rows intact'
      - 'tests/Feature/Auth/PasskeyLegacyMigrationTest.php::rsa and ed25519 public keys convert to equivalent cose keys'
  - id: options_rate_limited
    kind: edge
    description: Login option requests beyond 10 per minute are throttled.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyLoginEndpointTest.php::passkey login option requests beyond ten per minute are throttled'
      - 'tests/Feature/Auth/PasskeyLoginEndpointTest.php::passkey login options are available again after the throttle window'
  - id: authorization
    kind: authorization
    description: Endpoints are intentionally public; there is no resource ownership to enforce.
    coverage: not_applicable
    note: guest-facing entry point; abuse is limited by throttling instead.
confidence: high
evidence:
  - routes/web.php webauthn group and routes/auth.php guest group
  - app/Http/Controllers/WebAuthn/WebAuthnLoginController.php
  - database/migrations/2026_11_04_000049_move_webauthn_credentials_to_passkeys.php
last_verified: null
