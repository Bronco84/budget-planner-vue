schema: 1
id: AUTH-002
name: Guest registers an account and enrols a first passkey
domain: auth
status: implemented
priority: critical
summary: >
  A guest fills in name and email on the registration form. Open registration is
  closed: an account is created (without a password) only for an email on the
  configured allowlist, or through a valid budget invitation link for the invited
  email, in which case the new user also joins that budget with the invited role.
  The user is logged in and sent to the passkey registration page, where a WebAuthn
  attestation ceremony stores the first passkey and issues a trusted-device cookie
  before redirecting to /budgets.
actors:
  - guest
preconditions:
  - no account exists for the email
  - browser supports WebAuthn
routes:
  - register
  - POST /register
  - passkey.register
  - webauthn.register.options
  - webauthn.register
depends_on:
  - path: app/Services/BudgetSharingService.php
    reason: accepts the invitation when registering through an invitation link
  - path: config/auth.php
    reason: registration_allowlist
  - path: app/Services/DeviceTokenService.php
    reason: creates the TrustedDevice and cookie after a passkey is saved
  - path: app/Services/DeviceFingerprintService.php
    reason: fingerprints the browser for the trusted device
integrations:
  - WebAuthn (laravel/passkeys on web-auth/webauthn-lib), browser credential API
  - Mail (NewDeviceLogin notification on first trust of a device; sent synchronously unless auth.magic_link_queue is on, and a send failure is reported without failing the registration)
steps:
  - action: visit /register
    expected: Auth/Register page rendered with name + email fields
  - action: submit name and email (POST /register)
    expected: user created with null password, logged in, redirect to /passkey/register?new_user=1
  - action: request attestation options (POST webauthn/register/options)
    expected: JSON creation challenge for the authenticated user
  - action: submit attestation (POST webauthn/register)
    expected: 204, credential saved, trusted-device cookie queued; page navigates to /budgets
postconditions:
  - user exists and has one passkey
  - a TrustedDevice record exists for this browser (auth_method passkey)
business_rules:
  - "GET /register?invitation=<token> pre-fills (read-only) the invited email and shows the budget; an invalid token shows invitationError"
  - registration needs a valid invitation token for the same email (single use, 7-day expiry, see SHARE-001) or an email in config('auth.registration_allowlist') (REGISTRATION_ALLOWLIST, default the owner address, case-insensitive); anything else gets an "is currently restricted" error
  - registering through an invitation marks the email verified and joins the budget with the invited role
  - name required max 255; email required, valid, unique (uniqueness is checked after the invitation/allowlist, so a guest without either gets the same "is currently restricted" answer for a registered email as for an unknown one)
  - passkeys are registered as discoverable credentials (residentKey required) because login is usernameless (AUTH-001)
  - POST /register is throttled to 6 requests per minute
  - webauthn register routes require auth and are excluded from HandleInertiaRequests so they return JSON
  - PasskeyRegister renders in GuestLayout when isNewUser, otherwise AuthenticatedLayout
scenarios:
  - id: registration_form_renders
    kind: happy_path
    description: Guest can load the registration form.
    coverage: covered
    tests:
      - tests/Feature/Auth/RegistrationTest.php::test_registration_screen_can_be_rendered
  - id: allowlisted_email_creates_account
    kind: happy_path
    description: Submitting the allowlisted email creates a passwordless user, logs them in and redirects to passkey.register with new_user=1.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/RegistrationFlowTest.php::registering the allowlisted email creates a passwordless user and sends them to passkey registration'
  - id: passkey_attestation_saved
    kind: happy_path
    description: A valid attestation stores the credential, creates a trusted device, queues the cookie and returns 204.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyRegistrationCeremonyTest.php::a new account enrols its first passkey through a real attestation ceremony'
  - id: non_allowlisted_email_rejected
    kind: validation
    description: Any email other than the allowlisted one is rejected with an email error and no user is created.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/RegistrationFlowTest.php::registering any other email is rejected and no user is created'
  - id: invalid_or_duplicate_email_rejected
    kind: validation
    description: Missing name, malformed email or an already-registered email fails validation.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/RegistrationFlowTest.php::registration requires a name and a valid unused email'
  - id: registration_does_not_reveal_accounts
    kind: authorization
    description: Without an invitation or allowlist entry, a registered email gets the same restricted error as an unknown one, not "already taken".
    coverage: covered
    tests:
      - tests/Feature/Auth/RegistrationFlowTest.php::registering an existing account email without an invitation gets the same answer as an unknown email
  - id: passkeys_registered_discoverable
    kind: integration
    description: Registration options require a resident (discoverable) key so the passkey works with usernameless login.
    coverage: covered
    tests:
      - tests/Feature/WebAuthnLoginOptionsTest.php::passkey registration asks for a discoverable credential
  - id: registration_throttled
    kind: edge
    description: More than 6 registration submissions per minute are throttled (429).
    coverage: covered
    tests:
      - 'tests/Feature/Auth/RegistrationFlowTest.php::registration submissions beyond six per minute are throttled'
  - id: attestation_failure_surfaces_error
    kind: edge
    description: A failed attestation returns an error response and no credential or trusted device is stored.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/RegistrationFlowTest.php::a failed passkey attestation returns an error and stores no credential or trusted device'
      - 'tests/Feature/Auth/PasskeyRegistrationCeremonyTest.php::an attestation for a different origin or challenge is rejected and stores nothing'
  - id: registration_failure_message_is_generic
    kind: recovery
    description: An exception while saving the passkey returns JSON 500 "Failed to register passkey. Please try again."; the raw exception is only logged.
    coverage: covered
    tests:
      - tests/Feature/Auth/PasskeyRegistrationErrorTest.php::a passkey registration failure returns a generic error without the raw exception
  - id: register_options_require_auth
    kind: authentication
    description: A guest calling webauthn/register/options or webauthn/register is rejected (401 JSON) rather than registering a passkey.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/RegistrationFlowTest.php::a guest cannot request passkey registration options or register a passkey'
  - id: authenticated_user_redirected_from_register
    kind: authorization
    description: An authenticated user visiting /register is redirected away by the guest middleware.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/RegistrationFlowTest.php::an authenticated user visiting the registration form is redirected away'
  - id: account_created_status_shown
    kind: happy_path
    description: After account creation, PasskeyRegister receives flash.status "Account created! Now register your passkey." and shows it in its success banner.
    coverage: covered
    tests:
      - tests/Feature/Auth/PasskeyEnforcementTest.php::the passkey registration page receives the account created status so it can be shown
    note: asserts the Inertia prop; the Vue rendering itself is not unit tested.
  - id: invitation_registration
    kind: alternate
    description: An invited unknown email registers through the invitation and joins the budget with the invited role.
    coverage: covered
    tests:
      - tests/Feature/Auth/InvitationRegistrationTest.php::an invited unknown email registers through the invitation and joins the budget with the invited role
  - id: invalid_invitation_rejected
    kind: validation
    description: Expired, used, tampered or different-email invitations cannot register an account.
    coverage: covered
    tests:
      - tests/Feature/Auth/InvitationRegistrationTest.php::expired, used and tampered invitation tokens cannot be used to register
      - tests/Feature/Auth/InvitationRegistrationTest.php::registering with an invitation for a different email is rejected
  - id: configured_allowlist
    kind: alternate
    description: An email on config('auth.registration_allowlist') registers without an invitation; the default keeps the owner email.
    coverage: covered
    tests:
      - tests/Feature/Auth/InvitationRegistrationTest.php::an email on the configured registration allowlist registers without an invitation
      - tests/Feature/Auth/InvitationRegistrationTest.php::the registration allowlist defaults to the owner email
known_issues: []
confidence: high
evidence:
  - routes/auth.php guest group (register) and auth group (passkey.register)
  - routes/web.php webauthn register group
  - app/Http/Controllers/PasskeyAuthController.php
  - app/Http/Controllers/WebAuthn/WebAuthnRegisterController.php
  - resources/js/Pages/Auth/Register.vue, resources/js/Pages/Auth/PasskeyRegister.vue
last_verified: null
