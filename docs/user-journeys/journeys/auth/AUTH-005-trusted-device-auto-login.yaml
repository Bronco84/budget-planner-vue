schema: 1
id: AUTH-005
name: Returning user is signed in automatically on a trusted device
domain: auth
status: implemented
priority: critical
summary: >
  After a passkey login or registration the browser holds an httpOnly
  device_token cookie (90 days). On a later request from a guest session the
  RememberDevice middleware matches the cookie against a valid TrustedDevice
  whose fingerprint equals the request's, logs the user in and refreshes
  last_used_at. Guest-only pages such as /login then redirect to the dashboard,
  which forwards to the budgets index.
actors:
  - returning user
preconditions:
  - browser holds a device_token cookie issued by AUTH-001 or AUTH-002
  - the TrustedDevice has not expired or been revoked
routes:
  - login
  - dashboard
  - webauthn.login.options
depends_on:
  - path: app/Http/Middleware/RememberDevice.php
    reason: performs the cookie lookup and Auth::loginUsingId on every web request
  - path: app/Services/DeviceTokenService.php
    reason: decrypts stored tokens and matches the cookie value
  - path: app/Services/DeviceFingerprintService.php
    reason: fingerprint (user agent + Accept-Language + Accept-Encoding + Accept) must match
  - path: app/Models/TrustedDevice.php
    reason: valid() scope and markAsUsed()
steps:
  - action: return to the site with a device_token cookie and no session
    expected: RememberDevice finds the matching valid device and logs the user in
  - action: land on /login
    expected: guest middleware redirects to /dashboard, which redirects to budgets.index
postconditions:
  - user is authenticated
  - TrustedDevice.last_used_at updated
business_rules:
  - auto-login is skipped when already authenticated and on the logout route
  - auto-login regenerates the session id (Laravel's SessionGuard::login)
  - expired devices (expires_at in the past) are ignored
  - the cookie is secure, httpOnly, SameSite=Lax, lifetime auth.device_remember_days (default 90)
  - "/dashboard is auth-only and simply redirects to budgets.index"
scenarios:
  - id: valid_cookie_auto_logs_in
    kind: happy_path
    description: A request carrying a valid device cookie with a matching fingerprint is authenticated as the device owner.
    coverage: covered
    tests:
      - tests/Feature/Auth/TrustedDeviceAutoLoginTest.php::a trusted device auto login regenerates the session id
  - id: auto_login_regenerates_session
    kind: authentication
    description: Auto-login issues a new session id (no session fixation); a guest request without a device cookie keeps its id.
    coverage: covered
    tests:
      - tests/Feature/Auth/TrustedDeviceAutoLoginTest.php::a trusted device auto login regenerates the session id
      - tests/Feature/Auth/TrustedDeviceAutoLoginTest.php::a guest request without a device cookie keeps its session id
    note: regeneration comes from SessionGuard::login (used by loginUsingId), which calls session()->regenerate(true).
  - id: auto_logged_in_user_skips_login_page
    kind: happy_path
    description: An auto-logged-in visit to /login redirects through /dashboard to budgets.index.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/TrustedDeviceLifecycleTest.php::an auto logged in visit to the login page goes through the dashboard to the budgets index'
  - id: expired_device_ignored
    kind: edge
    description: A cookie whose device is past expires_at leaves the request as a guest.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/TrustedDeviceLifecycleTest.php::an expired trusted device leaves the request as a guest'
  - id: fingerprint_mismatch_ignored
    kind: edge
    description: A valid token presented with different browser headers is not accepted.
    coverage: covered
    tests:
      - tests/Feature/Auth/TrustedDeviceFingerprintTest.php::a device token presented from a different browser does not auto log in
  - id: json_login_device_matches_page_loads
    kind: integration
    description: A device trusted during the JSON passkey-login request auto-logs in on a later HTML page load from the same browser (the fingerprint ignores the Accept header).
    coverage: covered
    tests:
      - tests/Feature/Auth/TrustedDeviceFingerprintTest.php::a device trusted during a json passkey login auto logs in on a later html page load
  - id: auto_login_records_authentication_time
    kind: integration
    description: Auto-login stamps auth.authenticated_at in the session (used by account deletion, PROFILE-002).
    coverage: covered
    tests:
      - tests/Feature/DeleteAccountTest.php::a trusted device auto login records the authentication time
  - id: unknown_or_tampered_cookie_ignored
    kind: authentication
    description: A device_token value that matches no stored device does not authenticate anyone.
    coverage: covered
    tests:
      - tests/Feature/Auth/TrustedDeviceTokenLookupTest.php::a wrong device token does not verify against hashed or legacy devices
      - tests/Feature/Auth/TrustedDeviceTokenLookupTest.php::an unknown device cookie does not auto log in
  - id: device_found_by_indexed_token_hash
    kind: edge
    description: The cookie's device is found by an indexed sha256 token_hash lookup (one query, no decrypting other users' devices); the encrypted token is still compared in constant time.
    coverage: covered
    tests:
      - tests/Feature/Auth/TrustedDeviceTokenLookupTest.php::a newly trusted device stores a token hash and verifies via an indexed lookup without scanning other devices
  - id: legacy_device_without_hash_still_verifies
    kind: recovery
    description: A device stored before token_hash existed (or whose token could not be backfilled by the migration) is found by the legacy decrypt scan, which then fills its hash.
    coverage: covered
    tests:
      - tests/Feature/Auth/TrustedDeviceTokenLookupTest.php::a legacy device without a token hash still verifies and gets its hash filled
  - id: revoked_device_no_longer_logs_in
    kind: authorization
    description: After the device is revoked (AUTH-012) or the user logs out (AUTH-006) the cookie no longer signs the user in.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/TrustedDeviceLifecycleTest.php::a revoked trusted device no longer signs the user in'
      - 'tests/Feature/Auth/TrustedDeviceLifecycleTest.php::after signing out the device cookie no longer signs the user in'
  - id: login_options_stay_json_when_auto_logged_in
    kind: integration
    description: The login-options endpoint still returns JSON when the request is authenticated (guards the auto-login regression).
    coverage: covered
    tests:
      - tests/Feature/WebAuthnLoginOptionsTest.php::an authenticated request to login options returns json, not an html redirect
known_issues: []
confidence: medium
evidence:
  - bootstrap/app.php web middleware stack (RememberDevice before EnsureUserHasPasskey)
  - app/Http/Middleware/RememberDevice.php
  - app/Services/DeviceTokenService.php, app/Services/DeviceFingerprintService.php
  - routes/web.php dashboard route
last_verified: null
