schema: 1
id: AUTH-007
name: Signed-in user without a passkey is forced to enrol one
domain: auth
status: implemented
priority: critical
summary: >
  Every web request from an authenticated user who has no WebAuthn credential is
  redirected to /passkey/register (flash error "You must register a passkey to
  continue."), except the registration page itself, webauthn/*, logout and the
  email verification routes. JSON requests (expectsJson) get a 409 JSON response
  {message, redirect} instead of the redirect. This
  catches users who signed in by magic link or registered but abandoned the
  passkey ceremony, and users who somehow lost all credentials.
actors:
  - authenticated user without a passkey
preconditions:
  - user is authenticated (magic link, fresh registration or trusted device)
  - user has zero WebAuthn credentials
routes:
  - passkey.register
  - webauthn.register.options
  - webauthn.register
  - dashboard
depends_on:
  - path: app/Http/Middleware/EnsureUserHasPasskey.php
    reason: global web middleware performing the redirect
steps:
  - action: request any page (e.g. /dashboard)
    expected: 302 to /passkey/register with flash error
  - action: complete passkey registration (see AUTH-002 / AUTH-011)
    expected: subsequent requests pass through normally
postconditions:
  - user cannot reach the app until a passkey exists
business_rules:
  - allowed without a passkey - passkey/register, webauthn/*, logout, verify-email, verify-email/*, email/verification-notification
  - requests that expect JSON receive 409 {message, redirect} pointing at passkey.register; Inertia/HTML requests are redirected
  - the user model is refreshed from the database on every authenticated web request before checking credentials
  - guests are unaffected
  - tests disable this middleware globally in tests/TestCase.php; enforcement tests must opt back in
scenarios:
  - id: passkeyless_user_redirected
    kind: happy_path
    description: An authenticated user with no passkey requesting an app page is redirected to passkey.register.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyEnforcementTest.php::a signed-in user without a passkey is redirected to passkey registration'
      - 'tests/playwright/passkeys.spec.js::a new account must enrol a passkey and then continues to its budgets'
    note: tests/TestCase.php disables EnsureUserHasPasskey by default, so no existing test exercises it.
  - id: registration_routes_allowed
    kind: edge
    description: passkey/register, webauthn/* and logout are reachable without a passkey (no redirect loop).
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyEnforcementTest.php::the passkey registration page stays reachable without a passkey'
      - 'tests/Feature/Auth/PasskeyEnforcementTest.php::passkey registration options stay reachable without a passkey'
      - 'tests/Feature/Auth/PasskeyEnforcementTest.php::a user without a passkey can still sign out'
  - id: user_with_passkey_passes
    kind: edge
    description: A user with at least one credential is not redirected.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyEnforcementTest.php::a user with a passkey is not redirected'
  - id: json_endpoints_get_409
    kind: edge
    description: Requests that expect JSON (e.g. /api/preferences/*) get a 409 JSON response with the message and the passkey.register URL; Inertia visits are still redirected.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyEnforcementTest.php::a json request from a user without a passkey gets a 409 with the registration url'
      - 'tests/Feature/Auth/PasskeyEnforcementTest.php::an inertia request from a user without a passkey is still redirected'
  - id: verify_email_routes_allowed
    kind: edge
    description: A passkeyless user can still open the verify-email notice and request a new verification email.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyEnforcementTest.php::a user without a passkey can still reach the email verification routes'
  - id: guest_not_affected
    kind: authentication
    description: Guests pass through the middleware untouched and are handled by auth/guest guards instead.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyEnforcementGuestTest.php::guests are not redirected to passkey registration by the enforcement middleware'
  - id: enforcement_error_shown
    kind: recovery
    description: After the redirect, PasskeyRegister receives flash.error "You must register a passkey to continue." and shows it in its error banner.
    coverage: covered
    tests:
      - tests/Feature/Auth/PasskeyEnforcementTest.php::the passkey registration page receives the enforcement error so it can be shown
    note: asserts the Inertia prop; the Vue rendering itself is not unit tested.
known_issues: []
confidence: high
evidence:
  - bootstrap/app.php web middleware append list
  - app/Http/Middleware/EnsureUserHasPasskey.php
  - tests/TestCase.php
last_verified: null
