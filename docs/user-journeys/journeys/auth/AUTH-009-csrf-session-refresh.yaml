schema: 1
id: AUTH-009
name: Stale CSRF token is re-synced so writes keep working
domain: auth
status: implemented
priority: high
summary: >
  Laravel rotates the session CSRF token on login, magic-link login and logout,
  but the <meta name="csrf-token"> tag is only rendered on a full page load. The
  client keeps itself in sync - every Inertia response shares the live token
  which app.js writes into the meta tag and axios defaults; an axios request that
  still 419s fetches GET /csrf-token once (single shared in-flight refresh) and
  replays; an Inertia visit that 419s triggers a full reload.
actors:
  - authenticated user
  - guest
preconditions:
  - the session token has rotated or expired under an open page
routes:
  - GET /csrf-token
  - login
depends_on:
  - path: resources/js/bootstrap.js
    reason: setCsrfToken, axios 419 interceptor and shared /csrf-token refresh (fetchFreshCsrfToken)
  - path: resources/js/utils/http.js
    reason: apiFetch() - CSRF-aware fetch wrapper with a single 419 refresh-and-retry for raw fetch() writes
  - path: resources/js/app.js
    reason: router success listener syncs the shared token; invalid listener reloads on 419
  - path: app/Http/Middleware/HandleInertiaRequests.php
    reason: shares csrf_token on every Inertia response
steps:
  - action: perform a client-side navigation after the token rotated
    expected: page props carry the new csrf_token; meta tag and axios header updated
  - action: an axios POST is sent with a stale token
    expected: 419, client fetches /csrf-token, retries once with the new token
  - action: an Inertia visit returns 419
    expected: window.location.reload() pulls a fresh page and token
postconditions:
  - subsequent write requests succeed without the user refreshing manually
business_rules:
  - "/csrf-token is a public GET in the web group returning {csrf_token}"
  - each axios request is retried at most once (_retry flag)
  - fetch() write requests (POST/PUT/PATCH/DELETE) go through apiFetch() in resources/js/utils/http.js, which sends X-CSRF-TOKEN from the meta tag and Accept application/json and, on 419, refreshes the token via GET /csrf-token (the same shared in-flight refresh as axios) and retries once; callers are ChatPanel stream-complete, FileUpload, FileAttachmentList delete, PasskeyRegister options/register and Budgets/Show account-type-order. Plain GET fetches are not wrapped
  - CSRF is enforced by the framework's ValidateCsrfToken with no app-level exceptions; webauthn/* requests send X-CSRF-TOKEN from the meta tag
scenarios:
  - id: inertia_shares_live_token
    kind: happy_path
    description: Inertia page props include the current session CSRF token.
    coverage: covered
    tests:
      - tests/Feature/CsrfTokenSyncTest.php::inertia responses share the live csrf token
  - id: shared_token_follows_rotation
    kind: recovery
    description: After the session token rotates (logout) the next Inertia response shares the rotated token.
    coverage: covered
    tests:
      - tests/Feature/CsrfTokenSyncTest.php::the shared token follows a session token rotation
  - id: partial_reload_keeps_live_token
    kind: alternate
    description: A partial reload (router.reload({ only })) still returns the live csrf_token (shared with Inertia::always), so the router 'success' re-sync never restores a stale token over one the 419 retry just refreshed.
    coverage: covered
    tests:
      - tests/Feature/CsrfTokenSyncTest.php::a partial reload still shares the live csrf token
      - 'tests/playwright/csrf.spec.js::a partial reload keeps the refreshed CSRF token instead of restoring the stale one'
  - id: refresh_endpoint_returns_token
    kind: happy_path
    description: GET /csrf-token returns the session token as JSON.
    coverage: covered
    tests:
      - tests/Feature/CsrfTokenSyncTest.php::the csrf token endpoint returns the session token
  - id: axios_419_retry
    kind: recovery
    description: A 419 axios response triggers one /csrf-token fetch shared by concurrent requests and a single replay.
    coverage: covered
    tests:
      - 'tests/playwright/csrf.spec.js::a fetch write with a rotated CSRF token is replayed once with a fresh token'
      - 'tests/playwright/csrf.spec.js::concurrent axios writes that hit a 419 share one token refresh and each replay once'
      - 'tests/playwright/csrf.spec.js::an Inertia form submitted with a rotated CSRF token still succeeds'
    note: Local-only E2E with a real stale token (the session is signed out and back in behind the open page). Inertia shares the axios instance, so its writes are retried by the same interceptor.
  - id: inertia_419_reload
    kind: recovery
    description: An Inertia visit that returns 419 reloads the page instead of leaving the user stuck.
    coverage: covered
    tests:
      - 'tests/playwright/csrf.spec.js::an Inertia visit answered with 419 reloads the page instead of leaving it stuck'
    note: Local-only E2E; the visit's 419 is answered in the browser, since a real stale token is retried by the axios interceptor before Inertia sees it.
  - id: stale_token_rejected
    kind: validation
    description: A POST with a stale CSRF token is rejected with 419.
    coverage: covered
    tests:
      - tests/Feature/Auth/CsrfVerificationTest.php::a write with a stale csrf token is rejected with 419
      - tests/Feature/Auth/CsrfVerificationTest.php::a write with the live csrf token passes verification
  - id: token_endpoint_public
    kind: authorization
    description: The token endpoint is intentionally public; it only reveals the caller's own session token.
    coverage: not_applicable
    note: no resource ownership; same-origin policy prevents other sites reading the response.
known_issues: []
confidence: medium
evidence:
  - routes/web.php /csrf-token closure
  - uncommitted changes in resources/js/bootstrap.js, resources/js/app.js and app/Http/Middleware/HandleInertiaRequests.php
  - tests/Feature/CsrfTokenSyncTest.php (passing, uncommitted)
last_verified: null
