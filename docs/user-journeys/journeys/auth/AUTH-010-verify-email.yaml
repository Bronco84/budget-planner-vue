schema: 1
id: AUTH-010
name: User verifies their email address
domain: auth
status: implemented
priority: low
summary: >
  User implements MustVerifyEmail. An unverified user can open the verify-email
  prompt, request a new verification link, and follow the signed link to mark the
  address verified, after which they are sent to the dashboard with ?verified=1.
  Profile shows a resend link when the email is unverified.
actors:
  - authenticated user
preconditions:
  - user is authenticated and email_verified_at is null
routes:
  - verification.notice
  - verification.send
  - verification.verify
  - profile.update
integrations:
  - Mail (framework VerifyEmail notification)
steps:
  - action: open /verify-email
    expected: Auth/VerifyEmail rendered (already-verified users are redirected to dashboard)
  - action: request a link (POST /email/verification-notification)
    expected: notification sent, back with status verification-link-sent
  - action: open the signed link (GET /verify-email/{id}/{hash})
    expected: email_verified_at set, Verified event fired, redirect to /dashboard?verified=1
postconditions:
  - email_verified_at is set
business_rules:
  - verify link requires a valid signature and the sha1 hash of the user's email; throttled 6/min
  - resend is throttled 6/min and is a no-op redirect for verified users
  - no route uses the verified middleware, so verification does not gate any feature
  - changing the email on the profile clears email_verified_at and sends a new verification email
  - passkey enforcement (AUTH-007) lets passkeyless users reach verify-email* and email/verification-notification
scenarios:
  - id: prompt_renders
    kind: happy_path
    description: An unverified user can load the verification prompt.
    coverage: covered
    tests:
      - tests/Feature/Auth/EmailVerificationTest.php::test_email_verification_screen_can_be_rendered
  - id: signed_link_verifies
    kind: happy_path
    description: A valid signed link verifies the email, dispatches Verified and redirects to dashboard?verified=1.
    coverage: covered
    tests:
      - tests/Feature/Auth/EmailVerificationTest.php::test_email_can_be_verified
  - id: invalid_hash_rejected
    kind: validation
    description: A link whose hash does not match the user's email does not verify it.
    coverage: covered
    tests:
      - tests/Feature/Auth/EmailVerificationTest.php::test_email_is_not_verified_with_invalid_hash
  - id: resend_notification
    kind: alternate
    description: Requesting a new link sends the notification and flashes verification-link-sent.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyEnforcementTest.php::a user without a passkey can still reach the email verification routes'
  - id: email_change_sends_verification
    kind: alternate
    description: Changing the email on the profile sends a new verification email; saving without an email change sends none.
    coverage: covered
    tests:
      - 'tests/Feature/Profile/ProfileValidationTest.php::changing the email sends a new verification email'
      - 'tests/Feature/Profile/ProfileValidationTest.php::saving the profile without changing the email sends no verification email'
  - id: passkeyless_user_can_verify
    kind: edge
    description: With passkey enforcement on, a user without a passkey can still open the prompt and request a link.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyEnforcementTest.php::a user without a passkey can still reach the email verification routes'
  - id: already_verified_redirected
    kind: edge
    description: A verified user hitting the prompt or resend is redirected to the dashboard.
    coverage: covered
    tests:
      - tests/Feature/Auth/EmailVerificationAccessTest.php::a verified user opening the prompt or requesting a link is redirected to the dashboard
  - id: link_requires_auth_and_signature
    kind: authentication
    description: Unsigned/expired links or guests cannot verify an address.
    coverage: covered
    tests:
      - tests/Feature/Auth/EmailVerificationAccessTest.php::a guest cannot verify an address with a valid signed link
      - tests/Feature/Auth/EmailVerificationAccessTest.php::an unsigned or expired verification link is rejected
      - tests/Feature/Auth/EmailVerificationAccessTest.php::a signed link for another user does not verify either account
known_issues: []
confidence: high
evidence:
  - routes/auth.php auth group
  - app/Http/Controllers/Auth/EmailVerificationPromptController.php, VerifyEmailController.php, EmailVerificationNotificationController.php
last_verified: null
