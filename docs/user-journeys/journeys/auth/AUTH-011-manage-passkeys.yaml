schema: 1
id: AUTH-011
name: User adds, renames and removes passkeys
domain: auth
status: implemented
priority: high
summary: >
  From the Passkeys section of the profile page a user can add another passkey
  (PasskeyRegister in AuthenticatedLayout plus the WebAuthn attestation
  ceremony), rename a passkey, or delete one. Deleting the last remaining
  passkey is refused so the account cannot be locked out.
actors:
  - authenticated user
preconditions:
  - user is authenticated and has at least one passkey
routes:
  - profile.edit
  - passkey.register
  - webauthn.register.options
  - webauthn.register
  - passkeys.update
  - passkeys.destroy
depends_on:
  - path: resources/js/Pages/Profile/Partials/ManagePasskeysForm.vue
    reason: list, rename and delete UI
integrations:
  - WebAuthn (laravel/passkeys on web-auth/webauthn-lib), browser credential API
steps:
  - action: open /profile
    expected: passkeys listed (name or "Passkey", created_at, last_used = last_used_at, else updated_at for passkeys moved from laragear and not used since)
  - action: add a passkey (link to /passkey/register, then webauthn/register/options + webauthn/register)
    expected: new credential saved, trusted device refreshed, redirect to /budgets
  - action: rename (PATCH /settings/passkeys/{credential} with name)
    expected: name updated, back with status
  - action: delete (DELETE /settings/passkeys/{credential})
    expected: passkey removed (and its legacy laragear copy, if any), back with status reminding to remove it from the device
postconditions:
  - the user's credential set reflects the change and at least one passkey remains
business_rules:
  - name required, string, max 255; stored on passkeys.name
  - a user may not delete their last passkey (errors.passkey)
  - both mutations abort 403 when the passkey's user_id is not the current user
  - deleting a passkey also deletes its row in the legacy webauthn_credentials table (PasskeyObserver), so rolling back migration 2026_11_04_000049 cannot bring it back
  - deleting a passkey does not revoke trusted devices
  - additional passkeys reuse the user's WebAuthn user handle (an HMAC of the user id; passkeys moved from laragear keep the handle they were registered with) and the register options list existing credentials in excludeCredentials; a credential id that already exists is rejected
  - the profile's "Add New Passkey" links pass return=profile; PasskeyRegister then returns to profile.edit (only when the user already has a passkey), otherwise to budgets.index
scenarios:
  - id: profile_lists_passkeys
    kind: happy_path
    description: The profile page includes the user's passkeys.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/ProfilePasskeyListTest.php::the profile page lists the users passkeys and not other users passkeys'
  - id: add_additional_passkey
    kind: happy_path
    description: An existing user completes a second attestation and now has two credentials.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyRegistrationCeremonyTest.php::a user who already has a passkey can add a second one'
  - id: duplicate_credential_rejected
    kind: validation
    description: Re-registering a credential id that is already stored is rejected with 422 (attestation error) and no second row is created; the options also list existing credentials in excludeCredentials.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyRegistrationCeremonyTest.php::replaying an attestation for an already registered credential is rejected'
      - 'tests/Feature/Auth/PasskeyRegistrationCeremonyTest.php::a user who already has a passkey can add a second one'
  - id: add_passkey_returns_to_profile
    kind: alternate
    description: Registration started from the profile (return=profile) sends the user back to the profile; first-passkey enrolment and unknown return values go to /budgets.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyEnforcementTest.php::adding a passkey from the profile returns to the profile afterwards'
      - 'tests/Feature/Auth/PasskeyEnforcementTest.php::first passkey enrolment and unknown return values go to the budgets page afterwards'
      - 'tests/playwright/passkeys.spec.js::a passkey added from the profile returns to the profile'
      - 'tests/playwright/passkeys.spec.js::a new account must enrol a passkey and then continues to its budgets'
    note: The browser specs run real ceremonies against Chrome's virtual WebAuthn authenticator (local-only E2E).
  - id: registration_name_saved
    kind: happy_path
    description: The optional name typed on the registration page is sent with the attestation and saved as the passkey's name (nullable string, max 255); blank falls back to the device-derived name from PasskeyObserver.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyRegistrationCeremonyTest.php::the passkey name typed at registration is saved as its name'
      - 'tests/Feature/Auth/PasskeyRegistrationCeremonyTest.php::a blank passkey name falls back to the device name'
      - 'tests/playwright/passkeys.spec.js::a passkey added from the profile returns to the profile'
      - 'tests/playwright/passkeys.spec.js::a new account must enrol a passkey and then continues to its budgets'
  - id: registration_name_too_long
    kind: validation
    description: A passkey name over 255 characters is rejected with 422 and no credential is saved.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyRegistrationCeremonyTest.php::an over-long passkey name is rejected and nothing is saved'
  - id: rename_passkey
    kind: happy_path
    description: Renaming updates the name and flashes a status.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyAndDeviceManagementTest.php::a user can rename their passkey'
  - id: delete_passkey
    kind: happy_path
    description: Deleting one of several passkeys removes it.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyAndDeviceManagementTest.php::a user can delete a passkey when another remains'
      - 'tests/Feature/Auth/PasskeyAndDeviceManagementTest.php::deleting a passkey also removes its legacy laragear copy so a rollback cannot restore it'
  - id: rename_requires_name
    kind: validation
    description: An empty or over-long name is rejected.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyAndDeviceManagementTest.php::renaming a passkey requires a name'
  - id: last_passkey_protected
    kind: edge
    description: Deleting the only passkey is refused with errors.passkey and the credential is kept.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyAndDeviceManagementTest.php::a user cannot delete their last passkey'
  - id: cannot_modify_other_users_passkey
    kind: authorization
    description: Renaming or deleting another user's credential returns 403.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyAndDeviceManagementTest.php::a user cannot rename another users passkey'
      - 'tests/Feature/Auth/PasskeyAndDeviceManagementTest.php::a user cannot delete another users passkey'
known_issues: []
confidence: high
evidence:
  - routes/auth.php auth group
  - app/Http/Controllers/PasskeyManagementController.php
  - app/Http/Controllers/ProfileController.php edit()
last_verified: null
