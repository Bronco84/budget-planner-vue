schema: 1
id: AUTH-012
name: User reviews and revokes trusted devices
domain: auth
status: implemented
priority: high
summary: >
  The profile page lists the user's trusted devices (name, browser, platform,
  IP, auth method, last used). The user can revoke a single device or revoke all
  devices other than the current browser, which stops those browsers being
  auto-signed-in (AUTH-005) and signs out their live sessions.
actors:
  - authenticated user
preconditions:
  - user is authenticated and has trusted devices
routes:
  - profile.edit
  - trusted-devices.revoke
  - trusted-devices.revoke-all
depends_on:
  - path: resources/js/Pages/Profile/Partials/ManageTrustedDevicesForm.vue
    reason: list and revoke UI
  - path: app/Services/DeviceFingerprintService.php
    reason: identifies the current device for revoke-all
steps:
  - action: open /profile
    expected: trusted devices listed newest-used first
  - action: revoke one (DELETE /settings/trusted-devices/{device})
    expected: device deleted and the session it last signed in with ended, back with status "Device revoked successfully."
  - action: revoke all others (POST /settings/trusted-devices/revoke-all)
    expected: every device except the one this browser's device cookie belongs to deleted, and every other session of the user ended
postconditions:
  - revoked devices can no longer auto-login
  - revoked devices' live sessions are signed out
business_rules:
  - revoking a device owned by another user aborts 403
  - revoke-all keeps only the device this browser's device_token cookie belongs to (fingerprints are browser family + OS, which other machines share); without a cookie it revokes all
  - each sign-in (passkey login/registration, device auto-login) records the regenerated session id on the trusted device; revoking the device deletes that sessions row (database session driver), unless it is the requesting session
  - revoke-all deletes every sessions row of the user except the requesting session, including magic-link sessions that have no trusted device
  - devices created before session ids were recorded have none until their next sign-in, so revoking one of them only ends its session via revoke-all
  - the profile lists only unexpired devices (TrustedDevice::valid()) and flags the one this browser's device_token cookie belongs to with is_current, shown as a "This device" badge
scenarios:
  - id: profile_lists_devices
    kind: happy_path
    description: The profile page includes the user's unexpired trusted devices, with is_current set on the device for this browser.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyAndDeviceManagementTest.php::the profile lists only unexpired trusted devices and flags the current one'
    note: the "This device" badge rendering in ManageTrustedDevicesForm.vue is not browser tested.
  - id: revoke_single_device
    kind: happy_path
    description: Revoking a device deletes it.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyAndDeviceManagementTest.php::a user can revoke one of their trusted devices'
  - id: revoke_all_other_devices
    kind: happy_path
    description: Revoke-all deletes every device except the current browser's, including another machine with the same browser and OS.
    coverage: covered
    tests:
      - tests/Feature/Auth/TrustedDeviceFingerprintTest.php::revoking all other devices keeps the device for the current browser
      - tests/Feature/Auth/TrustedDeviceFingerprintTest.php::revoking all other devices revokes another machine with the same browser and os
  - id: no_devices_empty_state
    kind: empty_state
    description: A user with no trusted devices sees an empty list.
    coverage: covered
    tests:
      - tests/Feature/Auth/TrustedDeviceRevocationTest.php::a user with no trusted devices sees an empty device list
  - id: cannot_revoke_other_users_device
    kind: authorization
    description: Revoking another user's device returns 403 and leaves it intact.
    coverage: covered
    tests:
      - 'tests/Feature/Auth/PasskeyAndDeviceManagementTest.php::a user cannot revoke another users trusted device'
  - id: revoked_device_stops_auto_login
    kind: integration
    description: After revocation the old device cookie no longer authenticates.
    coverage: covered
    tests:
      - tests/Feature/Auth/TrustedDeviceRevocationTest.php::a revoked device cookie no longer signs the browser in
  - id: revoke_ends_device_session
    kind: happy_path
    description: Revoking a device deletes the stored session it last signed in with, leaving the user's other sessions and other users' sessions alone.
    coverage: covered
    tests:
      - tests/Feature/Auth/TrustedDeviceRevocationTest.php::revoking a device ends the live session it signed in with
      - tests/Feature/Auth/TrustedDeviceRevocationTest.php::a device auto sign-in records the session it signed in with
      - 'tests/Feature/Auth/PasskeyLoginCeremonyTest.php::a valid passkey assertion signs the user in and issues a trusted device cookie'
  - id: revoke_current_device_keeps_session
    kind: edge
    description: Revoking the device the request itself comes from deletes the device but keeps the current session signed in.
    coverage: covered
    tests:
      - tests/Feature/Auth/TrustedDeviceRevocationTest.php::revoking the device the request comes from keeps the current session
  - id: revoke_all_ends_other_sessions
    kind: happy_path
    description: Revoke-all deletes every other stored session of the user (including magic-link sessions) and keeps the current one.
    coverage: covered
    tests:
      - tests/Feature/Auth/TrustedDeviceRevocationTest.php::revoking all other devices signs out every other session of the user
  - id: new_device_email_links_to_profile
    kind: integration
    description: The new-device login email's Manage Devices button links to the profile page (profile.edit), where devices are managed.
    coverage: covered
    tests:
      - tests/Feature/Auth/PasskeyAndDeviceManagementTest.php::the new device login email links to the profile page to manage devices
known_issues: []
confidence: medium
evidence:
  - routes/auth.php auth group
  - app/Http/Controllers/TrustedDeviceController.php
  - app/Services/DeviceTokenService.php endDeviceSession() / endOtherSessions()
  - app/Http/Controllers/ProfileController.php edit()
last_verified: null
