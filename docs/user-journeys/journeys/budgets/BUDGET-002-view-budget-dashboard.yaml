schema: 1
id: BUDGET-002
name: Owner views the budget dashboard and account ledger
domain: budgets
status: implemented
priority: critical
summary: >
  The owner opens a budget and sees the total balance across accounts, the
  accounts grouped by type, properties, and a paginated ledger for the selected
  account combining actual, pending and projected transactions with running
  balances. Query parameters select the account, date range, projection horizon
  (persisted as a per-budget preference) and page size.
actors:
  - budget owner
  - budget editor
  - budget viewer
preconditions:
  - user is authenticated and a member (owner, editor or viewer) of the budget
routes:
  - budgets.show
depends_on:
  - path: app/Services/BudgetService.php
    reason: selected account, date range parsing, ledger assembly, running balances, totals
  - path: app/Console/Commands/PruneExpiredCacheEntries.php
    reason: scheduled daily in routes/console.php; deletes expired database cache rows, including orphaned projection versions
  - path: resources/js/Pages/Budgets/Show.vue
    reason: dashboard page
integrations: []
steps:
  - action: visit /budgets/{budget}
    expected: Budgets/Show rendered with budget, totalBalance, accounts, properties, transactions and projection params
  - action: pick another account or change projection_months / date_range / per_page
    expected: ledger reloads for that account; projection_months is saved as a user preference for this budget
postconditions:
  - preference budget_{id}_projection_months updated when a new value is requested
business_rules:
  - "any member can view the dashboard; budgetAccess (role, can.edit/manage/manage_connections) hides edit, sync, add, connect and settings controls from viewers, and owner controls from editors (server policies still enforce)"
  - per_page is clamped to 10..200 (default 100)
  - a pending Plaid transaction marked removed by the bank (PLAID-003) is still listed in the ledger, with a "Removed by bank" badge, a struck-through amount and no running balance, and does not move the running balance of any other row
  - default date range is 90 days; default projection horizon is the saved preference or 1 month
  - projection_months must be an integer 0..12 (the range BudgetProjectionModal offers); invalid values are ignored and never saved, and a saved preference is clamped to 0..12 when read
  - date_range must be one of 7, 30, 90 or custom and start_date a Y-m-d date; invalid values fall back to the defaults instead of erroring
  - accounts excluded from total balance are ignored by the total; liabilities are subtracted
  - with no accounts the page renders an empty "No Accounts Yet" state and no ledger
  - projected transactions are cached per account and date range for an hour under a per-account version; any change to the account, its templates, transactions, transfers or autopay replaces the version, invalidating every cached range on any cache store; on the database store the orphaned rows of replaced versions are removed by the daily cache:prune-expired command
scenarios:
  - id: projection_cache_invalidated
    kind: edge
    description: A cached projection (any horizon, including 0 months and beyond 12) reflects a template change or a new transfer on the next load, on the database cache store, without dropping other accounts' cached projections.
    coverage: covered
    tests:
      - tests/Feature/Projections/ProjectionCacheInvalidationTest.php::a cached projection is invalidated when a template changes, for every projection window
      - tests/Feature/Projections/ProjectionCacheInvalidationTest.php::a cached projection is invalidated when a transfer is added
      - tests/Feature/Projections/ProjectionCacheInvalidationTest.php::invalidating one account leaves another account cached projections in place
  - id: orphaned_projection_cache_pruned
    kind: integration
    description: Expired cache rows, such as projections stored under a replaced version that are never read again, are deleted daily from the database cache table while live rows stay.
    coverage: covered
    tests:
      - tests/Feature/Console/PruneExpiredCacheEntriesTest.php::cache:prune-expired removes expired rows from the database cache and keeps live ones
      - tests/Feature/Console/PruneExpiredCacheEntriesTest.php::cache:prune-expired removes more expired rows than one batch
      - tests/Feature/Console/PruneExpiredCacheEntriesTest.php::cache:prune-expired is scheduled daily
  - id: owner_views_dashboard
    kind: happy_path
    description: Owner with an account gets a 200 dashboard.
    coverage: covered
    tests:
      - tests/Feature/SecurityAuthorizationTest.php::user can access their own budget
      - tests/Feature/Budgets/BudgetDashboardTest.php::owner sees the dashboard with accounts, total balance and the selected account ledger
      - tests/Feature/Budgets/BudgetDashboardTest.php::dashboard ledger follows the requested account
      - tests/playwright/smoke.spec.js::budgets index redirects to the active budget dashboard
  - id: total_balance_calculation
    kind: happy_path
    description: Total balance adds assets, subtracts liabilities and ignores excluded accounts.
    coverage: covered
    tests:
      - tests/Feature/Services/BudgetServiceTest.php::calculateTotalBalance adds assets, subtracts liabilities, ignores excluded accounts
      - tests/Feature/Services/BudgetServiceTest.php::calculateTotalBalance subtracts liabilities stored as negative balances
  - id: date_range_parsing
    kind: alternate
    description: Relative date_range values map to the expected ledger start dates.
    coverage: covered
    tests:
      - tests/Feature/Services/BudgetServiceTest.php::parseDateRange returns the expected relative start dates
  - id: projection_months_persisted
    kind: alternate
    description: Passing projection_months saves it as the per-budget preference and it is reused on the next visit.
    coverage: covered
    tests:
      - tests/Feature/Budgets/BudgetDashboardTest.php::requested projection months are saved and reused on the next visit
      - tests/Feature/Budgets/BudgetDashboardTest.php::zero projection months is accepted and saved
  - id: invalid_projection_months_ignored
    kind: validation
    description: Out-of-range, non-integer or array projection_months is ignored (the saved preference is used and not overwritten), and an out-of-range saved preference is clamped to 12.
    coverage: covered
    tests:
      - tests/Feature/Budgets/BudgetDashboardTest.php::invalid projection months are ignored and never saved as the preference
      - tests/Feature/Budgets/BudgetDashboardTest.php::an out-of-range saved projection preference is clamped when read
  - id: malformed_date_range_falls_back
    kind: validation
    description: An unknown or array date_range, or an unparsable start_date, falls back to the default range and renders 200.
    coverage: covered
    tests:
      - tests/Feature/Budgets/BudgetDashboardTest.php::malformed date range and start date fall back instead of erroring
  - id: foreign_account_id_falls_back
    kind: edge
    description: An account_id belonging to another budget, or that does not exist, falls back to the budget's default account instead of erroring.
    coverage: covered
    tests:
      - tests/Feature/Budgets/BudgetDashboardTest.php::an account id that is not in the budget falls back to the default account
  - id: no_accounts_empty_state
    kind: empty_state
    description: A budget with no accounts renders with null selectedAccountId and no transactions.
    coverage: covered
    tests:
      - tests/Feature/Budgets/BudgetDashboardTest.php::budget without accounts renders the empty state
  - id: per_page_clamped
    kind: edge
    description: Out-of-range per_page values are clamped to 10..200.
    coverage: covered
    tests:
      - tests/Feature/Budgets/BudgetDashboardTest.php::per page is clamped to the allowed range
  - id: other_users_budget_forbidden
    kind: authorization
    description: Viewing another user's budget returns 403.
    coverage: covered
    tests:
      - tests/Feature/SecurityAuthorizationTest.php::user cannot access another users budget
  - id: guest_redirected_to_login
    kind: authentication
    description: Guests are redirected to login.
    coverage: covered
    tests:
      - tests/Feature/SecurityAuthorizationTest.php::unauthenticated user cannot access budgets
  - id: shared_member_views_dashboard
    kind: alternate
    description: A viewer of a shared budget opens the dashboard (200) with budgetAccess marking it read-only; an editor gets edit but not owner controls.
    coverage: covered
    tests:
      - tests/Feature/Sharing/BudgetMemberManagementTest.php::shared budgets appear in the switcher with the member role and become the active budget
      - tests/Feature/Sharing/BudgetMemberManagementTest.php::editors see edit controls but not owner controls
known_issues:
  - "BudgetService::getAccountTransactions only returns past-dated rows that have a plaid_transaction_id (Plaid is treated as source of truth), so manual transactions dated today or earlier never appear in the dashboard ledger, even for manual-only accounts. Ledger tests therefore use future-dated manual transactions."
confidence: high
evidence:
  - app/Http/Controllers/BudgetController.php show
  - app/Services/BudgetService.php
  - resources/js/Pages/Budgets/Show.vue
last_verified: null
