schema: 1
id: BUDGET-005
name: Owner deletes a budget
domain: budgets
status: implemented
priority: high
summary: >
  From the edit page the owner deletes the budget. If it was the active budget the
  preference is cleared; the user is redirected to /budgets, which forwards to the
  next accessible budget or to the create form when none remain. Child rows
  (accounts, transactions, categories, transfers, properties, Plaid connections)
  are removed by database cascades. Polymorphic file attachments are deleted
  explicitly (S3 objects only when no longer used) and each Plaid item is removed
  at Plaid.
actors:
  - budget owner
preconditions:
  - user owns the budget
routes:
  - budgets.destroy
  - budgets.index
integrations:
  - Plaid API (/item/remove)
  - AWS S3 (file storage)
steps:
  - action: confirm delete on Budgets/Edit (DELETE /budgets/{budget})
    expected: budget deleted, active preference cleared if it pointed at it, redirect to budgets.index
  - action: follow redirect
    expected: next accessible budget's dashboard, or budgets.create when none remain
postconditions:
  - the budget and its cascaded children no longer exist
business_rules:
  - deletion is a hard delete (no SoftDeletes on Budget)
  - FileAttachment rows on the budget and its transactions are deleted; each file is removed (row and S3 object) only when nothing else uses it (File::deleteFromS3IfUnused)
  - each of the budget's PlaidConnections has its item removed at Plaid (/item/remove) after the local delete; a Plaid failure is logged and never blocks the delete
scenarios:
  - id: owner_deletes_budget
    kind: happy_path
    description: Owner deletes a budget and is redirected to budgets.index.
    coverage: partial
    tests:
      - tests/Feature/Budgets/BudgetDeletionTest.php::deleting a budget removes its budget and transaction attachments and their unused S3 objects
    note: the redirect and removal are asserted as part of the attachment cleanup test; the follow-up page is not.
  - id: attachments_cleaned_up
    kind: alternate
    description: Budget- and transaction-level attachments are deleted with the budget; unused S3 objects are removed and objects still used elsewhere are kept.
    coverage: covered
    tests:
      - tests/Feature/Budgets/BudgetDeletionTest.php::deleting a budget removes its budget and transaction attachments and their unused S3 objects
  - id: plaid_items_removed
    kind: integration
    description: Each of the budget's Plaid items is removed at Plaid so its access token is revoked.
    coverage: covered
    tests:
      - tests/Feature/Budgets/BudgetDeletionTest.php::deleting a budget removes each of its Plaid items at Plaid
  - id: plaid_removal_failure_still_deletes
    kind: recovery
    description: A Plaid failure removing an item is logged and the budget is still deleted locally.
    coverage: covered
    tests:
      - tests/Feature/Budgets/BudgetDeletionTest.php::a Plaid failure removing an item still deletes the budget locally
  - id: deleting_last_budget_leads_to_create
    kind: empty_state
    description: Deleting the only budget ends on the create-budget form.
    coverage: uncovered
  - id: deleting_active_budget_clears_preference
    kind: edge
    description: Deleting the active budget clears active_budget_id so another budget becomes active.
    coverage: uncovered
  - id: other_users_budget_delete_forbidden
    kind: authorization
    description: Deleting another user's budget returns 403 and the budget remains.
    coverage: uncovered
known_issues: []
confidence: medium
evidence:
  - app/Http/Controllers/BudgetController.php destroy
  - database/migrations/* (budget_id foreign keys onDelete cascade)
last_verified: null
