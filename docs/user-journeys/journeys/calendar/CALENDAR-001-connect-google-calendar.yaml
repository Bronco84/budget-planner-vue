schema: 1
id: CALENDAR-001
name: User connects a Google Calendar via OAuth
domain: calendar
status: implemented
priority: high
summary: >
  On the calendar connections settings page the user clicks "Connect Google Calendar"
  and is redirected to Google's consent screen (read-only calendar scope, offline
  access). Google redirects back to the callback, which exchanges the code for tokens,
  stores or updates a CalendarConnection for the user's primary calendar, runs an
  initial event sync (1 month back to 6 months ahead) and returns to the connections page.
actors:
  - authenticated user
preconditions:
  - Google OAuth client id/secret/redirect URI are configured
routes:
  - calendar.connections.index
  - calendar.connect.google
  - calendar.google.callback
depends_on:
  - path: app/Services/GoogleCalendarService.php
    reason: authorization URL, code exchange, calendar lookup, initial syncEvents
  - path: database/migrations/2026_11_04_000060_encrypt_calendar_connection_tokens.php
    reason: encrypts Google tokens stored before the encrypted casts
integrations:
  - Google OAuth 2.0
  - Google Calendar API (calendars.get, events.list)
steps:
  - action: open /calendar/connections
    expected: Calendar/Connections rendered with the user's connections and event counts
  - action: click Connect Google Calendar (GET /calendar/connect/google)
    expected: a random state nonce is stored in the session and the user is 302'd to Google with it as state
  - action: approve consent; Google calls /calendar/google/callback?code=...
    expected: state checked against the session nonce (hash_equals, single use); connection created/updated for calendar 'primary', events synced, redirect to connections index with a 'message' flash
postconditions:
  - an active CalendarConnection with access and refresh tokens exists for the user
  - CalendarEvents for the sync window are stored
business_rules:
  - one connection per (user, calendar_id); reconnecting updates tokens in place
  - the callback is behind auth, so the user must still be logged in when Google redirects back
  - the callback is rejected without a token exchange unless its state matches the nonce stored at connect; the nonce is cleared after any callback
  - Google client errors are logged; the user only sees a generic failure message
  - access and refresh tokens are encrypted at rest (encrypted casts) and hidden from serialization
scenarios:
  - id: connections_page_renders
    kind: happy_path
    description: The connections page lists the user's connections.
    coverage: covered
    tests:
      - 'tests/Feature/Calendar/GoogleCalendarConnectFlowTest.php::the connections page lists only the users calendar connections'
      - 'tests/Feature/Calendar/GoogleCalendarConnectFlowTest.php::the connections page renders an empty list when nothing is connected'
  - id: redirect_to_google
    kind: happy_path
    description: Connect redirects away to Google's authorization URL.
    coverage: covered
    tests:
      - tests/Feature/Calendar/CalendarConnectionTest.php::connecting stores a random oauth state in the session and sends it to google
  - id: callback_creates_connection
    kind: happy_path
    description: A successful callback stores the connection and performs the initial sync.
    coverage: covered
    tests:
      - 'tests/Feature/Calendar/CalendarConnectionTest.php::a google callback with a matching state stores the connection and flashes a visible message'
      - 'tests/Feature/Calendar/GoogleCalendarConnectFlowTest.php::a google callback exchanges the code, stores the connection and runs the initial sync'
    note: 'the real GoogleCalendarService runs against an in-memory Google client (token exchange, calendar lookup and initial sync); no HTTP to Google.'
  - id: reconnect_updates_existing
    kind: alternate
    description: Reconnecting the same calendar updates tokens on the existing connection instead of duplicating it.
    coverage: covered
    tests:
      - 'tests/Feature/Calendar/GoogleCalendarConnectFlowTest.php::reconnecting the same calendar updates the existing connection instead of duplicating it'
  - id: consent_denied
    kind: edge
    description: When Google returns ?error=access_denied the user is sent back to connections with an error flash.
    coverage: covered
    tests:
      - 'tests/Feature/Calendar/GoogleCalendarConnectFlowTest.php::a denied google consent returns to connections with an error and no token exchange'
  - id: callback_without_code
    kind: validation
    description: A callback with neither code nor error redirects to connections with an error flash without calling Google.
    coverage: covered
    tests:
      - tests/Feature/Calendar/CalendarConnectionTest.php::a google callback without a code or error redirects to connections with an error
  - id: token_exchange_failure
    kind: integration
    description: An invalid/expired code or Google API failure redirects to connections with a generic "Failed to connect calendar" error (no raw exception text) and logs the cause.
    coverage: covered
    tests:
      - tests/Feature/Calendar/CalendarConnectionTest.php::a failed token exchange shows a generic error and logs the real cause
  - id: state_not_verified
    kind: authorization
    description: A callback whose state is missing or does not match the session nonce is rejected with an error flash and no token exchange.
    coverage: covered
    tests:
      - tests/Feature/Calendar/CalendarConnectionTest.php::a google callback with a mismatched state is rejected without a token exchange
      - tests/Feature/Calendar/CalendarConnectionTest.php::a google callback without a stored or returned state is rejected without a token exchange
  - id: reconnect_keeps_refresh_token
    kind: edge
    description: A reconnect where Google omits the refresh token keeps the stored one instead of failing.
    coverage: covered
    tests:
      - 'tests/Feature/Calendar/GoogleCalendarConnectFlowTest.php::reconnecting when google omits the refresh token keeps the stored one'
  - id: tokens_encrypted_at_rest
    kind: edge
    description: Stored access and refresh tokens are ciphertext in the database and plaintext through the model; the data migration encrypts older plaintext rows and its rollback restores them.
    coverage: covered
    tests:
      - tests/Feature/Calendar/CalendarTokenEncryptionTest.php::google calendar tokens are encrypted at rest and read back as plaintext
      - tests/Feature/Calendar/CalendarTokenEncryptionTest.php::the token encryption migration encrypts existing plaintext rows and its rollback restores them
known_issues: []
confidence: high
evidence:
  - app/Http/Controllers/CalendarConnectionController.php index(), connect(), callback()
  - app/Services/GoogleCalendarService.php
  - app/Http/Middleware/HandleInertiaRequests.php flash keys
last_verified: null
