schema: 1
id: CALENDAR-002
name: User syncs, enables/disables or removes a calendar connection
domain: calendar
status: implemented
priority: medium
summary: >
  From the calendar connections page the user can re-sync events from Google
  (refreshing the access token if expired), toggle whether a connection's events show
  on the financial calendar, or remove the connection. Each action is authorised by
  CalendarConnectionPolicy (owner only) and redirects back.
actors:
  - authenticated user
preconditions:
  - the user has at least one CalendarConnection
routes:
  - calendar.connections.sync
  - calendar.connections.toggle
  - calendar.connections.destroy
depends_on:
  - path: app/Policies/CalendarConnectionPolicy.php
    reason: update/delete abilities require connection.user_id to match
  - path: app/Services/GoogleCalendarService.php
    reason: refreshTokenIfNeeded, syncEvents and revokeAccess
integrations:
  - Google Calendar API (events.list), Google OAuth token refresh and revocation
steps:
  - action: click Sync (POST /calendar/connections/{calendarConnection}/sync)
    expected: events re-synced; redirect back with "Synced N events from <calendar>"
  - action: click toggle (POST .../toggle)
    expected: is_active flipped; redirect back
  - action: confirm remove (DELETE /calendar/connections/{calendarConnection})
    expected: connection deleted, its Google grant revoked; redirect back
postconditions:
  - inactive connections' events are excluded from the calendar month view (CALENDAR-003)
business_rules:
  - only the owning user may sync, toggle or delete a connection
  - sync failures flash a generic "Sync failed. Please try again."; the exception is only logged, as an argument-free trace (ExceptionContext::withoutArguments) so token arguments never reach the log
  - an expired token without a refresh token fails with "No refresh token available"
  - sync reads every events.list page; only after the whole window is listed are the connection's stored events in that window that Google no longer returned (deleted, cancelled or moved out) removed
  - a sync that fails part-way removes nothing
  - removing a connection revokes its Google grant (refresh token, else access token) after the row is deleted; a refused or failed revocation is logged without the token and never blocks the removal; a grant another of the user's connections still uses is not revoked
  - events are keyed per connection (calendar_connection_id, google_event_id), so an event shared by several app users is stored once for each of their connections
scenarios:
  - id: sync_connection
    kind: happy_path
    description: The owner re-syncs a connection and sees the synced count.
    coverage: covered
    tests:
      - tests/Feature/Calendar/CalendarConnectionTest.php::the owner can sync a calendar connection
  - id: sync_removes_deleted_events
    kind: happy_path
    description: Events deleted or cancelled in Google disappear locally on the next sync; all pages are read first, and other connections' events are untouched.
    coverage: covered
    tests:
      - tests/Feature/Calendar/GoogleCalendarSyncTest.php::sync walks every page and removes window events that google no longer returns
      - tests/Feature/Calendar/GoogleCalendarSyncTest.php::pruning only touches the syncing connection
  - id: shared_event_per_user
    kind: edge
    description: Two users invited to the same Google event each keep their own copy; one user's sync does not take it from the other.
    coverage: covered
    tests:
      - tests/Feature/Calendar/GoogleCalendarSyncTest.php::an event shared by two users is stored once for each of their connections
  - id: partial_listing_keeps_events
    kind: recovery
    description: A Google failure on a later page fails the sync without deleting any stored event.
    coverage: covered
    tests:
      - tests/Feature/Calendar/GoogleCalendarSyncTest.php::a failed page leaves stored events untouched
  - id: toggle_connection
    kind: happy_path
    description: The owner toggles a connection active/inactive.
    coverage: covered
    tests:
      - tests/Feature/Calendar/CalendarConnectionTest.php::the owner can toggle a calendar connection
  - id: remove_connection
    kind: happy_path
    description: The owner removes a connection.
    coverage: covered
    tests:
      - tests/Feature/Calendar/CalendarConnectionTest.php::the owner can remove a calendar connection
  - id: remove_revokes_google_grant
    kind: integration
    description: Removing a connection revokes its Google grant; a refused or unreachable revocation still removes the connection and is logged; a grant shared with another connection is left in place.
    coverage: covered
    tests:
      - tests/Feature/Calendar/CalendarGrantRevocationTest.php::removing a calendar connection revokes its google grant
      - tests/Feature/Calendar/CalendarGrantRevocationTest.php::a failed google revocation still removes the calendar connection and is logged
      - tests/Feature/Calendar/CalendarGrantRevocationTest.php::removing one of two connections that share a google grant leaves the grant in place
  - id: unknown_connection
    kind: edge
    description: A non-existent connection id returns 404.
    coverage: covered
    tests:
      - tests/Feature/Calendar/CalendarConnectionTest.php::an unknown calendar connection returns 404
  - id: token_refresh_failure
    kind: recovery
    description: An expired token that cannot be refreshed (revoked access, no refresh token) redirects back with "Sync failed".
    coverage: covered
    tests:
      - tests/Feature/Calendar/CalendarSyncTokenRefreshTest.php::syncing an expired connection whose refresh fails redirects back with a generic sync error
  - id: google_api_failure
    kind: integration
    description: A Google API error during events.list is reported as a generic "Sync failed" flash (no raw exception text) without 500, and the real cause is logged.
    coverage: covered
    tests:
      - tests/Feature/Calendar/CalendarConnectionTest.php::a google api failure during sync shows a generic error without the raw exception
  - id: cross_user_denied
    kind: authorization
    description: Another user's connection cannot be synced, toggled or deleted (403).
    coverage: covered
    tests:
      - tests/Feature/Calendar/CalendarConnectionTest.php::another user cannot sync toggle or remove a calendar connection
  - id: flash_message_shown
    kind: happy_path
    description: After an action, the connections page receives flash.message (and flash.error on failure) and Connections.vue shows it in a banner.
    coverage: covered
    tests:
      - tests/Feature/Calendar/CalendarConnectionTest.php::the connections page receives the flashed message so it can be shown
    note: asserts the Inertia prop; the Vue rendering itself is not unit tested.
known_issues: []
confidence: medium
evidence:
  - routes/web.php calendar.connections.* parameter names
  - app/Http/Controllers/CalendarConnectionController.php sync(), toggle(), destroy()
  - resources/js/Pages/Calendar/Connections.vue
last_verified: null
