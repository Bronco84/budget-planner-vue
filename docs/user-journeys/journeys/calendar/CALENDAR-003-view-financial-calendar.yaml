schema: 1
id: CALENDAR-003
name: User views the financial calendar for a month
domain: calendar
status: implemented
priority: medium
summary: >
  The Calendar page shows a month grid for the user's active budget (or a budget chosen
  via budget_id) combining posted transactions, projected occurrences of active
  recurring templates and events from active Google Calendar connections. The user
  navigates months via year/month query parameters.
actors:
  - authenticated user
preconditions:
  - the user has at least one budget
routes:
  - calendar.index
depends_on:
  - path: app/Models/RecurringTransactionTemplate.php
    reason: projected recurring occurrences per frequency
integrations: []
steps:
  - action: open /calendar (optionally ?year=&month=&budget_id=)
    expected: Calendar/Index rendered with calendarData, calendarEvents, the user's budgets and currentMonth
postconditions:
  - none (read-only)
business_rules:
  - users without a budget are redirected to budgets.create with a message
  - budget_id must pass BudgetPolicy view (owner only)
  - only events from active calendar connections are shown
  - year (integer 1900-2100) and month (integer 1-12) are optional and validated; invalid values fail with 422 / validation redirect
scenarios:
  - id: month_renders
    kind: happy_path
    description: The current month renders transactions, projected recurring items and calendar events.
    coverage: covered
    tests:
      - tests/Feature/Calendar/CalendarMonthValidationTest.php::the calendar renders the requested month
      - tests/Feature/Calendar/CalendarMonthContentsTest.php::the calendar month shows posted transactions, projected recurring items and active calendar events
  - id: no_budget_redirect
    kind: empty_state
    description: A user with no budgets is redirected to budget creation.
    coverage: covered
    tests:
      - tests/Feature/Calendar/CalendarMonthContentsTest.php::a user without a budget is sent to budget creation from the calendar
  - id: invalid_month_params
    kind: validation
    description: Non-numeric or out-of-range year/month parameters are rejected by validation instead of rolling over or raising a 500.
    coverage: covered
    tests:
      - tests/Feature/Calendar/CalendarMonthValidationTest.php::the calendar rejects an out of range or non-numeric year or month
  - id: inactive_connection_events_hidden
    kind: edge
    description: Events from a disabled connection are not shown.
    coverage: covered
    tests:
      - tests/Feature/Calendar/CalendarMonthContentsTest.php::events from a disabled calendar connection are not shown
  - id: other_users_budget_denied
    kind: authorization
    description: Passing another user's budget_id returns 403.
    coverage: covered
    tests:
      - tests/Feature/NestedRouteAuthorizationTest.php::user cannot view another users budget via calendar budget_id param
  - id: recurring_schedule_matches_projections
    kind: edge
    description: Recurring items use the same schedule rules as projections (bimonthly means twice a month on two days).
    coverage: covered
    tests:
      - 'tests/Feature/Calendar/CalendarRecurrenceTest.php::a bimonthly recurring item appears twice in the month on its two days'
  - id: first_of_month_included
    kind: edge
    description: A transaction dated the 1st of the month appears on day one.
    coverage: covered
    tests:
      - 'tests/Feature/Calendar/CalendarRecurrenceTest.php::a transaction dated the first of the month is shown on day one'
known_issues: []
confidence: medium
evidence:
  - app/Http/Controllers/CalendarController.php index(), generateCalendarData(), projectRecurringTransactions()
  - resources/js/Pages/Calendar/Index.vue
last_verified: null
