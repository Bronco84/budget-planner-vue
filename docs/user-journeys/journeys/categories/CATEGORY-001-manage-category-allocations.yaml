schema: 1
id: CATEGORY-001
name: Owner reviews spending by category and creates or edits categories
domain: categories
status: implemented
priority: high
summary: >
  The owner opens the categories page to see each category's allocated amount,
  spent, remaining and percent used, plus budget-wide totals. New categories are
  added and existing ones edited through modals on the same page; spending is
  matched to transactions by category id (transactions.category_id), with the
  legacy category string as a fallback for unlinked rows.
actors:
  - budget owner
preconditions:
  - user owns the budget
routes:
  - budgets.categories.index
  - budgets.categories.store
  - budgets.categories.update
depends_on:
  - path: resources/js/Pages/Categories/Partials/CreateCategoryModal.vue
    reason: create modal posting to budgets.categories.store
  - path: resources/js/Pages/Categories/Partials/EditCategoryModal.vue
    reason: edit modal patching budgets.categories.update
integrations: []
steps:
  - action: visit /budgets/{budget}/categories
    expected: Categories/Index rendered with categories (spent_cents, remaining_cents, percent_used) and a summary
  - action: create a category in the modal (POST /budgets/{budget}/categories)
    expected: category stored with order = max(order)+1; back with flash message
  - action: edit a category in the modal (PATCH /budgets/{budget}/categories/{category})
    expected: category updated; back with flash message
postconditions:
  - category list reflects the change
business_rules:
  - name required (max 255), amount required numeric >= 0 (stored in dollars), colour max 7 chars, description max 1000 (stored in a TEXT column so strict MySQL accepts the full length)
  - spent = sum of |amount_in_cents| of the budget's negative transactions (all time, no date bound) linked to the category by category_id, plus unlinked (category_id null) legacy rows whose category string matches the category name trimmed of spaces and case-insensitively; pending rows the bank dropped (removed_by_bank_at) are excluded, as in every other total; summed in SQL grouped by category_id / legacy name key, so legacy rows differing only in case or spaces merge into one total
  - legacy name matching is one rule everywhere (Category::nameKey in PHP, LOWER(TRIM(category)) in SQL, compared as bytes on MySQL so the column collation cannot widen it), the same rule SyncsCategoryAssignment links new writes by (Category::findForBudgetByName, so a string links to a category exactly when it would count toward it unlinked); Transaction::isInCategory, Transaction::scopeInCategory (delete blocking, budget/category accessors), the categories page and the budget performance report agree on SQLite and MySQL
  - when several categories share a name key, only the lowest-id one (the one findForBudgetByName links new writes to) claims the matching legacy rows, so none is counted twice
  - renaming a category keeps its transactions and recurring templates (they reference the id); the denormalized `category` string on them is updated to the new name, and unlinked rows matching the old name (trimmed, case-insensitive) are adopted unless a lower-id category shares that name
  - category_id was backfilled by migration from the category string (trimmed, case-insensitive, same budget); unmatched rows keep category_id null and their string
  - percent_used is 0 when the allocation is 0
scenarios:
  - id: index_shows_spending
    kind: happy_path
    description: Index renders categories with spent/remaining computed from matching expense transactions.
    coverage: covered
    tests:
      - tests/Feature/Categories/CategoryManagementTest.php::index renders categories with spent and remaining computed from matching expenses
  - id: create_category
    kind: happy_path
    description: Valid create stores the category at the end of the order.
    coverage: covered
    tests:
      - tests/Feature/Categories/CategoryManagementTest.php::a valid category is stored at the end of the order
  - id: edit_category
    kind: happy_path
    description: Valid update changes the category.
    coverage: covered
    tests:
      - tests/Feature/Categories/CategoryManagementTest.php::a valid update changes the category
  - id: spent_all_time_excludes_bank_removed
    kind: edge
    description: Spent covers expenses from any date, linked by id or legacy name, excludes pending rows the bank dropped and never counts another budget's transactions.
    coverage: covered
    tests:
      - tests/Feature/Categories/CategoryManagementTest.php::spent counts all time expenses by category id and legacy name but not bank removed rows or other budgets
  - id: no_categories_empty_state
    kind: empty_state
    description: A budget with no categories renders zero totals.
    coverage: covered
    tests:
      - tests/Feature/Categories/CategoryManagementTest.php::a budget with no categories renders zero totals
  - id: invalid_category_rejected
    kind: validation
    description: Missing name or negative amount returns validation errors.
    coverage: covered
    tests:
      - tests/Feature/Categories/CategoryManagementTest.php::a category without a name or with a negative amount is rejected and nothing is saved
  - id: long_description_stored
    kind: validation
    description: A description up to 1000 characters is stored in full on create and update (TEXT column); 1001 characters is rejected.
    coverage: covered
    tests:
      - tests/Feature/Categories/CategoryManagementTest.php::a description up to the validated 1000 characters is stored in full on create and update
  - id: other_users_categories_forbidden
    kind: authorization
    description: Index/store/update on another user's budget return 403; a category from another budget returns 404 via scopeBindings.
    coverage: covered
    tests:
      - tests/Feature/Categories/CategoryManagementTest.php::category routes on another users budget are forbidden and a cross budget category is not found
  - id: rename_carries_transactions
    kind: alternate
    description: Renaming a category keeps its linked transactions and templates (their copied name is updated) and their spend still counts.
    coverage: covered
    tests:
      - tests/Feature/Categories/CategoryLinkingTest.php::renaming a category carries its transactions and templates
  - id: spending_grouped_by_id
    kind: edge
    description: Spending counts transactions linked by id even when their copied name is stale, plus unlinked legacy rows with the same name; unmatched legacy strings are grouped separately in monthly statistics.
    coverage: covered
    tests:
      - tests/Feature/Categories/CategoryLinkingTest.php::spending is grouped by category id with the legacy string as fallback
  - id: legacy_name_matching_normalised
    kind: edge
    description: An unlinked legacy row whose category differs only in case or surrounding spaces (e.g. 'groceries ') counts toward the category in isInCategory, scopeInCategory, the categories page and the report; such rows merge into one total, near-miss names do not count, a name shared by two categories counts once toward the lowest id, and a rename adopts case-variant legacy rows only when the category claimed them.
    coverage: covered
    tests:
      - tests/Feature/Categories/LegacyCategoryMatchingTest.php::a legacy row differing only in case or surrounding spaces counts toward the category everywhere
      - tests/Feature/Categories/LegacyCategoryMatchingTest.php::legacy rows that differ only in case or spaces merge into one category total
      - tests/Feature/Categories/LegacyCategoryMatchingTest.php::a legacy name shared by two categories counts once, toward the one new writes link to
      - tests/Feature/Categories/LegacyCategoryMatchingTest.php::renaming a category adopts legacy rows matching its old name in any case
      - tests/Feature/Categories/LegacyCategoryMatchingTest.php::renaming a category does not take legacy rows claimed by an earlier category of the same name
  - id: backfill_links_existing_rows
    kind: integration
    description: The category_id migration links existing transactions and templates by trimmed, case-insensitive name within the same budget and leaves unmatched rows (and the string) untouched; down() drops the column.
    coverage: covered
    tests:
      - tests/Feature/Categories/CategoryLinkingTest.php::the category id migration backfills rows by trimmed case insensitive name within the same budget
known_issues: []
confidence: high
evidence:
  - app/Http/Controllers/CategoryController.php index/store/update
  - resources/js/Pages/Categories/Index.vue
last_verified: null
