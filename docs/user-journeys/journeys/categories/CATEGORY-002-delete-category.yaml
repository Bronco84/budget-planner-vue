schema: 1
id: CATEGORY-002
name: Owner deletes an unused category
domain: categories
status: implemented
priority: medium
summary: >
  From the categories page the owner confirms deletion of a category. The delete
  is refused with an error flash when any of the budget's transactions are linked
  to the category (by category_id, or unlinked legacy rows carrying its name).
actors:
  - budget owner
preconditions:
  - user owns the budget
routes:
  - budgets.categories.destroy
depends_on:
  - path: resources/js/Pages/Categories/Partials/DeleteConfirmationModal.vue
    reason: confirmation modal issuing the delete
  - path: app/Models/Category.php
    reason: deletionBlockedReason() is the delete guard shared with the Nova Category resource (ADMIN-001)
integrations: []
steps:
  - action: confirm delete (DELETE /budgets/{budget}/categories/{category})
    expected: category removed and back with success flash, or back with an error naming the transaction count; the delete modal toasts either flash
postconditions:
  - category deleted only when no transaction references it
business_rules:
  - categories in use by transactions (linked by category_id, or unlinked legacy rows matching the name) cannot be deleted; the same Category::deletionBlockedReason guard refuses the delete from Nova
  - recurring templates linked to a deleted category have category_id nulled by the foreign key (their name string is kept)
scenarios:
  - id: delete_unused_category
    kind: happy_path
    description: A category with no transactions is deleted.
    coverage: covered
    tests:
      - tests/Feature/Categories/CategoryDeleteAndReorderTest.php::deleting a category no transaction uses removes it with a success flash
  - id: delete_blocked_when_in_use
    kind: edge
    description: A category used by transactions is not deleted and an error flash is returned.
    coverage: covered
    tests:
      - tests/Feature/Categories/CategoryValidationTest.php::deleting a category that transactions use is blocked with an error flash
  - id: delete_blocked_by_id
    kind: edge
    description: A transaction linked by category_id blocks the delete even when its copied category name differs.
    coverage: covered
    tests:
      - tests/Feature/Categories/CategoryLinkingTest.php::deleting a category is blocked by transactions linked by id even when their name differs
  - id: other_users_category_forbidden
    kind: authorization
    description: Deleting under another user's budget returns 403; a cross-budget category returns 404.
    coverage: covered
    tests:
      - tests/Feature/Categories/CategoryDeleteAndReorderTest.php::another users category cannot be deleted and a cross budget category is not found
confidence: high
evidence:
  - app/Http/Controllers/CategoryController.php destroy
last_verified: null
