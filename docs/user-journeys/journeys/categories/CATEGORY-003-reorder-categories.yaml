schema: 1
id: CATEGORY-003
name: Owner reorders categories
domain: categories
status: deprecated
priority: low
summary: >
  Deprecated: the category reorder endpoint (POST /budgets/{budget}/categories/reorder,
  budgets.categories.reorder) had no frontend caller and was removed together with
  CategoryController@reorder. New categories are still appended at the end of the
  order (CATEGORY-001) and lists keep ordering by the `order` column.
actors:
  - budget owner
preconditions:
  - user owns the budget
routes: []
integrations: []
steps: []
postconditions: []
business_rules:
  - Category has a global scope ordering by order, so lists reflect the stored order
scenarios:
  - id: reorder_own_categories
    kind: happy_path
    description: Posting new orders for the budget's categories persists them.
    coverage: not_applicable
    note: the reorder endpoint was removed (no frontend caller); there is no way to reorder categories.
  - id: invalid_payload_rejected
    kind: validation
    description: Missing categories array or a negative order returns validation errors.
    coverage: not_applicable
    note: the reorder endpoint was removed.
  - id: foreign_category_ids_ignored
    kind: edge
    description: A category id from another budget in the payload is left unchanged.
    coverage: not_applicable
    note: the reorder endpoint was removed.
  - id: other_users_budget_forbidden
    kind: authorization
    description: Reordering another user's categories returns 403.
    coverage: not_applicable
    note: the reorder endpoint was removed.
known_issues: []
confidence: high
evidence:
  - routes/web.php (no budgets.categories.reorder route)
last_verified: null
