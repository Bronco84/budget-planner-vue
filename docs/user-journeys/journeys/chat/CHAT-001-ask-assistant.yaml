schema: 1
id: CHAT-001
name: User asks the AI assistant a question about their finances
domain: chat
status: implemented
priority: high
summary: >
  From the chat panel in the authenticated layout the user types a question. The panel
  opens an EventSource to GET /chat/stream; the server moderates and stores the user
  message, builds budget-scoped data tools (accounts, transactions, categories,
  projections, ...), runs a Prism tool loop (openai gpt-4o-mini) and streams the final
  text word-by-word as SSE (conversation_id, text_delta, stream_end). Before streaming,
  the server validates the generated text and stores it as the assistant message
  (titling new conversations). On stream_end the panel posts to /chat/stream/complete,
  which only acknowledges (it ignores any client-supplied text). A non-streaming POST
  /chat/message returns the reply as JSON.
actors:
  - authenticated user
preconditions:
  - an AI provider key is configured for Prism
routes:
  - chat.stream
  - chat.stream.complete
  - chat.send
depends_on:
  - path: app/Services/ChatService.php
    reason: processMessageStream (validates and persists the streamed reply), processMessage, provider error translation
  - path: app/Services/Chat/**
    reason: AssistantToolFactory and context builders that back the model's tools
  - path: app/Services/ContentModerationService.php
    reason: sanitise input, safe system prompt, response validation
  - path: resources/js/Components/ChatPanel.vue
    reason: chat UI (EventSource streaming, save on stream_end)
  - path: resources/js/Layouts/AuthenticatedLayout.vue
    reason: mounts the chat panel
integrations:
  - Prism (prism-php) with OpenAI gpt-4o-mini
steps:
  - action: type a question in the chat panel
    expected: GET /chat/stream?message=...&conversation_id=... opens an SSE stream
  - action: receive events
    expected: conversation_id event; the reply is validated and stored server-side (conversation titled), then text_delta events, then stream_end
  - action: panel posts to /chat/stream/complete
    expected: JSON {success true, conversation_id}; nothing is stored (posted message text is ignored)
postconditions:
  - the conversation contains the user message and the assistant reply
business_rules:
  - message is required, max 2000 chars; conversation_id and budget_id must exist
  - a conversation_id that belongs to another user returns 404 on send, stream and stream/complete, before moderation or any write
  - the assistant turn is always the server-generated text; a reply failing validateResponse is neither sent nor stored (in-band SSE error instead)
  - tools are scoped to the requested budget only if the user owns it, else to the user's active budget; with no budget no tools are offered
  - transaction queries are clamped to the last 12 months and the result count is capped
  - provider rate-limit/overload/too-large errors map to specific safe messages; anything else to a generic message; raw provider text is never returned
  - when the provider fails or the reply fails validation, the persisted user message is deleted (and a conversation created by that request, if nothing else references it), matching the panel, which drops the turn
  - ChatPanel shows the in-band SSE error message (event.data) when present, otherwise a generic connection error, and falls back to the conversation id it started from
scenarios:
  - id: send_returns_reply
    kind: happy_path
    description: POST /chat/message returns success with the model reply and persists user and assistant messages.
    coverage: covered
    tests:
      - tests/Feature/ChatAssistantTest.php::chat assistant returns and persists a reply via the tool-loop flow
  - id: stream_returns_events
    kind: happy_path
    description: GET /chat/stream emits conversation_id, text_delta and stream_end events.
    coverage: covered
    tests:
      - 'tests/Feature/ChatAssistantTest.php::the stream persists the assistant reply the server generated'
      - 'tests/Feature/Chat/ChatAssistantRequestTest.php::the stream emits the conversation id, a text delta per word and a stream end event'
  - id: stream_complete_saves_reply
    kind: happy_path
    description: The stream stores the server-generated reply as the assistant message and titles a new conversation.
    coverage: covered
    tests:
      - tests/Feature/ChatAssistantTest.php::the stream persists the assistant reply the server generated
  - id: stream_complete_ignores_client_text
    kind: authorization
    description: Posting text to /chat/stream/complete does not create an assistant message (no forged assistant turns).
    coverage: covered
    tests:
      - tests/Feature/ChatAssistantTest.php::stream complete does not store client supplied assistant content
  - id: stream_reply_validated
    kind: validation
    description: A generated reply that fails validateResponse is not streamed or stored; an SSE error event is sent instead.
    coverage: covered
    tests:
      - tests/Feature/ChatAssistantTest.php::the stream does not persist or send a reply that fails response validation
  - id: tools_built_for_budget
    kind: alternate
    description: A budget-owning user gets the full tool set (13 tools including get_accounts, query_transactions).
    coverage: covered
    tests:
      - tests/Feature/AssistantToolFactoryTest.php::factory builds the full tool set for a budget-owning user
  - id: no_budget_no_tools
    kind: empty_state
    description: A user without a budget gets no tools and a prompt explaining how to get started.
    coverage: covered
    tests:
      - 'tests/Feature/AssistantToolFactoryTest.php::factory returns no tools when there is no budget'
      - 'tests/Feature/Chat/ChatAssistantRequestTest.php::a user without a budget gets no tools and a getting started prompt'
  - id: transaction_window_clamped
    kind: edge
    description: The transaction query tool clamps start dates to the last 12 months.
    coverage: covered
    tests:
      - tests/Feature/AssistantToolFactoryTest.php::transaction query clamps the start date to the last 12 months
  - id: transaction_limit_capped
    kind: edge
    description: The transaction query tool caps the requested limit.
    coverage: covered
    tests:
      - 'tests/Feature/AssistantToolFactoryTest.php::transaction query caps the requested limit'
  - id: message_validation
    kind: validation
    description: Empty, over-2000-char messages or unknown conversation/budget ids fail validation (422).
    coverage: covered
    tests:
      - 'tests/Feature/Chat/ChatAssistantRequestTest.php::chat messages are validated before anything is stored or sent to the provider'
  - id: provider_error_safe_message
    kind: integration
    description: Provider rate limit, overload or request-too-large failures return the specific safe message (JSON 500 on send, in-band SSE error event on stream) and log the real cause.
    coverage: covered
    tests:
      - 'tests/Feature/ChatAssistantTest.php::a provider failure on send returns the safe message and leaves no orphan user message'
      - 'tests/Feature/ChatAssistantTest.php::a provider failure while streaming sends the safe message in-band and leaves no orphan user message'
      - 'tests/Feature/Chat/ChatAssistantRequestTest.php::provider failures on send return the specific safe message and log the real cause'
      - 'tests/Feature/Chat/ChatAssistantRequestTest.php::provider failures while streaming send the specific safe message in band and log the real cause'
  - id: failed_turn_not_persisted
    kind: recovery
    description: A provider failure leaves no orphan user message, and no empty conversation when the conversation was new.
    coverage: covered
    tests:
      - tests/Feature/ChatAssistantTest.php::a provider failure on send returns the safe message and leaves no orphan user message
      - tests/Feature/ChatAssistantTest.php::a provider failure while streaming sends the safe message in-band and leaves no orphan user message
      - tests/Feature/ChatAssistantTest.php::a provider failure while streaming a new conversation leaves no empty conversation behind
  - id: stream_error_ui_recovery
    kind: recovery
    description: On a stream error the panel shows the server's safe message (or a generic connection error), removes the pending messages and restores the input text.
    coverage: uncovered
    note: client-side behaviour (ChatPanel.vue); needs a browser test.
  - id: other_users_conversation
    kind: authorization
    description: Sending, streaming or completing into another user's conversation_id returns 404 and does not append to it.
    coverage: covered
    tests:
      - tests/Feature/ChatAssistantTest.php::sending into another users conversation returns 404 and does not append to it
      - tests/Feature/ChatAssistantTest.php::streaming into another users conversation returns 404 and does not append to it
      - tests/Feature/ChatAssistantTest.php::stream complete for another users conversation returns 404
  - id: other_users_budget_tools
    kind: authorization
    description: Passing another user's budget_id does not expose that budget's data to the tools.
    coverage: covered
    tests:
      - 'tests/Feature/Chat/ChatAssistantRequestTest.php::passing another users budget id does not expose that budget to the assistant'
known_issues:
  - ChatPanel does not send budget_id, so tools always use the active budget; the question text travels in the GET query string (logged by web servers).
confidence: high
evidence:
  - app/Http/Controllers/ChatController.php
  - app/Services/ChatService.php processMessageStream(), processMessage(), resolveBudget(), userFacingProviderError()
  - resources/js/Components/ChatPanel.vue sendMessage()
last_verified: null
