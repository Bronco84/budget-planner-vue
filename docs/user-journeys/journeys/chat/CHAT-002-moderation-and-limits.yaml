schema: 1
id: CHAT-002
name: Chat message is blocked, throttled or refused by moderation
domain: chat
status: implemented
priority: high
summary: >
  Exceptional journey. Before a chat message reaches the AI provider, ContentModerationService
  checks for a temporary ban, enforces a 30-messages-per-hour per-user limit, sanitises
  the text and scans it for prompt-injection, harmful-instruction, abusive, over-long and
  repeated-character patterns. Flagged messages are recorded as FlaggedChatMessage rows;
  injection/harmful content is blocked, other flags are logged and allowed. Route
  throttles (60/min group, 30/min on send/stream) apply first.
actors:
  - authenticated user
preconditions:
  - user is authenticated
routes:
  - chat.send
  - chat.stream.start
depends_on:
  - path: app/Services/ContentModerationService.php
    reason: isUserBanned, checkRateLimit, sanitizeContent, checkContent, determineAction
  - path: app/Models/FlaggedChatMessage.php
    reason: stores flagged content for admin review (ADMIN-002)
integrations: []
steps:
  - action: send a message containing a prompt-injection pattern
    expected: FlaggedChatMessage stored; JSON 400 {blocked true, error "...violates our usage policies..."}
  - action: send a 31st message within an hour
    expected: JSON 429 {rate_limit {...}}
  - action: send while banned
    expected: JSON 403 {banned true}
postconditions:
  - blocked messages are not sent to the provider and not stored as chat messages
business_rules:
  - prompt_injection or harmful_instructions => block; repeated_characters => warn (allowed); abusive_content => log (allowed); message length is capped at 2000 by request validation
  - the per-user moderation counter allows 30 messages per fixed one-hour window starting at the first message (Laravel RateLimiter); reset_in_seconds is the time left in that window
  - rejections past the hourly limit are logged but are not offenses
  - every content flag and more than 10 new conversations in 10 minutes ('rapid_conversation_creation') count as offenses; messages in an existing conversation are not tracked; 5 offenses in 24 hours trigger an automatic 24-hour ban
  - route throttles - 30 per minute each for send, stream start and stream open (own rate-limit keys chat-send / chat-stream / chat-stream-open, so one request is not counted twice against the group key), 60 per minute for the chat group
  - for streamed turns moderation runs on POST /chat/stream (stream start), before any stream id is issued, so refusals are JSON the panel can read
  - send and stream use the same status codes for moderation refusals - 403 banned, 429 hourly limit, 400 blocked; only provider/server failures return 500
scenarios:
  - id: clean_message_allowed
    kind: happy_path
    description: A normal message passes moderation and proceeds to the provider.
    coverage: covered
    tests:
      - 'tests/Feature/Chat/ChatModerationOutcomesTest.php::a clean message passes moderation without flags and reaches the provider'
  - id: injection_blocked
    kind: validation
    description: A prompt-injection message is blocked with 400 and recorded as a FlaggedChatMessage.
    coverage: covered
    tests:
      - tests/Feature/Chat/ChatModerationLimitsTest.php::a prompt injection message is blocked with 400 and recorded as a flagged message
  - id: abusive_logged_and_allowed
    kind: edge
    description: Abusive content is flagged/logged but still answered.
    coverage: covered
    tests:
      - 'tests/Feature/Chat/ChatModerationOutcomesTest.php::abusive content is flagged and logged but still answered'
  - id: hourly_limit_exceeded
    kind: edge
    description: The 31st message within the fixed hourly window is refused with rate limit details, and the window resets an hour after its first message.
    coverage: covered
    tests:
      - tests/Feature/Chat/ChatModerationLimitsTest.php::the hourly chat limit is a fixed window that resets an hour after the first message
      - tests/Feature/Chat/ChatModerationLimitsTest.php::sending past the hourly chat limit returns 429 with the safe message
    note: the HTTP 429 is asserted on POST /chat/message; the stream endpoint shares the same moderation step.
  - id: limit_retries_not_offenses
    kind: edge
    description: Retrying after hitting the hourly limit does not add offenses or trigger a ban.
    coverage: covered
    tests:
      - tests/Feature/Chat/ChatModerationLimitsTest.php::retrying past the hourly chat limit does not count as offenses or ban the user
  - id: rapid_conversation_creation
    kind: edge
    description: Only new conversations count toward rapid-creation; many messages in one conversation are not an offense, while more than 10 new conversations in 10 minutes are.
    coverage: covered
    tests:
      - tests/Feature/Chat/ChatModerationLimitsTest.php::sending many messages in one conversation is not flagged as rapid conversation creation
      - tests/Feature/Chat/ChatModerationLimitsTest.php::creating many new conversations rapidly is still recorded as an offense
  - id: route_throttle
    kind: edge
    description: More than 30 send/stream requests per minute return 429 from the throttle middleware.
    coverage: covered
    tests:
      - 'tests/Feature/Chat/ChatModerationOutcomesTest.php::chat send and stream requests beyond thirty per minute are throttled by the route'
      - 'tests/Feature/Chat/ChatModerationOutcomesTest.php::the chat route throttle resets after a minute'
  - id: auto_ban_after_offenses
    kind: edge
    description: A fifth offense within 24 hours bans the user from chat for 24 hours.
    coverage: covered
    tests:
      - 'tests/Feature/Chat/ChatModerationOutcomesTest.php::a fifth offense within 24 hours bans the user from chat for 24 hours'
      - 'tests/Feature/Chat/ChatModerationOutcomesTest.php::offenses older than 24 hours do not count toward the automatic ban'
  - id: stream_start_refusals
    kind: validation
    description: Starting a stream returns JSON 400 (blocked, flagged), 403 (banned) and 429 (hourly limit) without a stream id, storing no messages and calling no provider.
    coverage: covered
    tests:
      - 'tests/Feature/Chat/ChatStreamStartTest.php::moderation refusals are returned as json when starting a stream'
  - id: flagged_allowed_stream
    kind: edge
    description: A flagged-but-allowed streamed question is recorded against the conversation it is then streamed into.
    coverage: covered
    tests:
      - 'tests/Feature/Chat/ChatStreamStartTest.php::a flagged but allowed question is streamed into the conversation it was recorded against'
  - id: banned_user_refused
    kind: authorization
    description: A temporarily banned user receives 403 and no provider call is made.
    coverage: covered
    tests:
      - tests/Feature/Chat/ChatModerationLimitsTest.php::a banned user sending a chat message is refused with 403
  - id: stream_refusal_visible
    kind: recovery
    description: When starting a stream returns a JSON 400/403/429 the user is told why.
    coverage: uncovered
    note: the refusal is now returned as JSON by POST /chat/stream (asserted in ChatStreamStartTest) and ChatPanel shows its error text; the panel display itself needs a browser test.
  - id: blocked_foreign_conversation
    kind: authorization
    description: A message aimed at another user's conversation_id returns 404 before moderation, so nothing is flagged against that conversation.
    coverage: covered
    tests:
      - tests/Feature/ChatAssistantTest.php::a blocked message aimed at another users conversation returns 404 without flagging it
known_issues: []
confidence: high
evidence:
  - app/Services/ChatService.php steps 1-4 of processMessage/processMessageStream, flagMessage()
  - app/Services/ContentModerationService.php
  - routes/web.php chat group throttles
last_verified: null
