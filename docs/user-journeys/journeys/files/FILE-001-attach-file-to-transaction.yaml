schema: 1
id: FILE-001
name: Owner attaches, downloads and removes receipts on a transaction
domain: files
status: implemented
priority: high
summary: >
  On the transaction edit page (where a new manual transaction lands after
  creation) the owner uploads a file such as a receipt, sees the list of
  attachments, downloads one (streamed from S3) or deletes it. Files are
  de-duplicated by SHA-256 hash per uploader (each user gets their own File record;
  the S3 object, keyed by hash, is shared); the stored object is removed from S3
  only when no File record for that hash remains.
actors:
  - budget owner
preconditions:
  - user is a member of the transaction's budget (editor or owner to upload or delete)
routes:
  - transactions.files.upload
  - transactions.files.index
  - files.download
  - files.delete
depends_on:
  - path: app/Services/FileService.php
    reason: validation, hashing, S3 upload, de-duplication, access checks, detach
  - path: resources/js/Components/FileUpload.vue
    reason: upload widget
  - path: resources/js/Components/FileAttachmentList.vue
    reason: list with download and delete actions (delete hidden when readonly)
  - path: resources/js/Components/TransactionAttachmentsModal.vue
    reason: read-only receipts modal opened from the transactions list
  - path: resources/js/Pages/Transactions/Index.vue
    reason: paperclip attachment-count indicator that opens the read-only modal
  - path: app/Http/Controllers/TransactionController.php
    reason: index adds file_attachments_count with withCount
integrations:
  - AWS S3 (file storage)
steps:
  - action: upload a file (POST /transactions/{transaction}/files)
    expected: 201 JSON with the attachment; activity logged on the transaction
  - action: page loads attachments (GET /transactions/{transaction}/files)
    expected: JSON {attachments}
  - action: on the transactions list, click the paperclip on a transaction with attachments
    expected: read-only modal lists the attachments (GET /transactions/{transaction}/files) with download buttons and no delete; available to viewers
  - action: download (GET /files/{attachment}/download)
    expected: file streamed with original filename and no-cache headers; download logged
  - action: delete (DELETE /files/{attachment})
    expected: JSON success; S3 object removed when no other attachment uses it
postconditions:
  - FileAttachment linked to the transaction (or removed)
business_rules:
  - "roles: viewer read-only, editor/owner read-write"
  - max 10MB; allowed MIME types pdf, jpeg, png, gif, webp, txt, doc/docx, xls/xlsx, json, csv; extension must match MIME type
  - upload is throttled to 10 requests per minute
  - any budget member may list and download attachments; uploading and deleting needs the editor role (FileService::canUserAccessAttachment with write, BudgetPolicy::update)
  - de-duplication is scoped to the uploading user (files unique on hash + uploaded_by), so a user never sees another user's filename
  - upload/delete failures return a generic error; only FileValidationException messages are shown to the user
scenarios:
  - id: upload_to_transaction
    kind: happy_path
    description: A valid file uploads and is attached to the transaction.
    coverage: covered
    tests:
      - tests/Feature/Files/TransactionFileAttachmentTest.php::uploading content another user already uploaded creates a separate file record for the uploader
  - id: list_attachments
    kind: happy_path
    description: Attachment list returns the transaction's files.
    coverage: covered
    tests:
      - tests/Feature/Files/TransactionFileAttachmentTest.php::uploading content another user already uploaded creates a separate file record for the uploader
  - id: download_and_delete
    kind: happy_path
    description: Download streams the file; delete removes the attachment.
    coverage: covered
    tests:
      - tests/Feature/Files/TransactionFileAttachmentTest.php::deleting one users copy keeps the stored object another user still uses
  - id: duplicate_content_reused
    kind: alternate
    description: The same user uploading identical content reuses their existing File record.
    coverage: covered
    tests:
      - tests/Feature/Files/TransactionFileAttachmentTest.php::the same user uploading identical content reuses their existing file record
  - id: cross_user_duplicate_content_isolated
    kind: edge
    description: Content another user already uploaded gets a separate File record carrying the uploader's own filename; deleting one user's copy keeps the shared S3 object until the last record goes.
    coverage: covered
    tests:
      - tests/Feature/Files/TransactionFileAttachmentTest.php::uploading content another user already uploaded creates a separate file record for the uploader
      - tests/Feature/Files/TransactionFileAttachmentTest.php::deleting one users copy keeps the stored object another user still uses
  - id: invalid_file_rejected
    kind: validation
    description: Oversized, disallowed-type or extension-mismatched files are rejected.
    coverage: covered
    tests:
      - tests/Feature/SecurityFileValidationTest.php::file upload rejects disallowed file types
      - tests/Feature/SecurityFileValidationTest.php::file extension must match mime type
      - tests/Feature/Files/TransactionFileAttachmentTest.php::a disallowed file type on a transaction upload still explains why it was rejected
      - tests/Feature/Files/TransactionFileAttachmentTest.php::an oversized file on a transaction upload is rejected without storing anything
      - tests/Feature/Files/TransactionFileAttachmentTest.php::a file whose extension does not match its content on a transaction upload is rejected without storing anything
  - id: s3_failure_returns_error
    kind: recovery
    description: An S3 failure returns 400 JSON with a generic error (raw exception only logged) and creates no records.
    coverage: covered
    tests:
      - tests/Feature/Files/TransactionFileAttachmentTest.php::an S3 failure on upload returns a generic error and creates no records
  - id: delete_failure_returns_generic_error
    kind: recovery
    description: A failure while deleting an attachment returns 500 JSON with a generic error, never the raw exception.
    coverage: covered
    tests:
      - tests/Feature/Files/TransactionFileAttachmentTest.php::a failure deleting an attachment returns a generic error
  - id: other_users_transaction_files_forbidden
    kind: authorization
    description: Upload, list, download and delete on another user's transaction or attachment return 403.
    coverage: covered
    tests:
      - tests/Feature/Files/TransactionFileAuthorizationTest.php::upload list download and delete on another users transaction files are forbidden and nothing changes
  - id: shared_budget_roles
    kind: authorization
    description: On a shared budget viewers can list and download transaction attachments but get 403 uploading or deleting; editors can upload and delete.
    coverage: covered
    tests:
      - tests/Feature/Sharing/BudgetRoleMatrixTest.php::each budget route enforces its role requirement
  - id: viewer_reads_receipts
    kind: authorization
    description: On the transactions list a paperclip with the attachment count (file_attachments_count via withCount) appears on transactions that have attachments; clicking it opens a read-only modal (name, size, uploader, date, download) that any member, including a viewer, can use. A viewer can list and download but gets 403 uploading or deleting; a non-member gets 403 listing or downloading.
    coverage: covered
    tests:
      - tests/Feature/Files/ViewerTransactionReceiptsTest.php::the transactions list gives each transaction its attachment count
      - tests/Feature/Files/ViewerTransactionReceiptsTest.php::a viewer can list and download a transactions receipts
      - tests/Feature/Files/ViewerTransactionReceiptsTest.php::a viewer cannot upload or delete receipts
      - tests/Feature/Files/ViewerTransactionReceiptsTest.php::a non-member cannot list or download a transactions receipts
known_issues:
  - "File routes are not nested under {budget}, so scopeBindings and AuthorizeBudgetAccess do not apply; FileController checks the transaction's budget role itself."
confidence: high
evidence:
  - app/Http/Controllers/FileController.php uploadToTransaction/getTransactionAttachments/download/delete
  - resources/js/Pages/Transactions/Edit.vue
  - resources/js/Pages/Transactions/Index.vue paperclip + TransactionAttachmentsModal.vue
last_verified: null
