schema: 1
id: PAYOFF-002
name: User reviews a payoff plan's month-by-month projection
domain: payoff
status: implemented
priority: critical
summary: >
  Opening a payoff plan shows a month-by-month simulation from the plan's start date:
  monthly interest accrues on each debt, minimum payments are applied, and the monthly
  extra payment is focused on the first unpaid debt in strategy order. The page shows the
  timeline, total months, payoff date, total interest and goal completion estimates.
actors:
  - authenticated budget owner
preconditions:
  - user owns a budget with a payoff plan
routes:
  - payoff-plans.show
depends_on:
  - path: app/Services/PayoffPlanService.php
    reason: calculatePayoffProjection and calculateGoalProjections
integrations: []
steps:
  - action: open budget/{budget}/payoff-plans/{payoff_plan}
    expected: PayoffPlans/Show with plan, debtProjection (timeline, total_months, payoff_date, total_interest_paid, final_debt_data) and goalProjections
postconditions:
  - nothing is persisted
business_rules:
  - interest per month = round(balance x APR / 100 / 12), applied before payments
  - minimum payments are capped at the remaining balance
  - extra payment goes to the first debt with a balance after sorting (snowball = smallest balance, avalanche = highest APR, custom = priority)
  - simulation stops when all balances are zero or after 600 months
  - goal months_to_complete = ceil(target / monthly_contribution); null when contribution is 0
  - payoff_plan is scoped to the budget; needs budget view
scenarios:
  - id: zero_interest_payoff
    kind: happy_path
    description: A $1,200 zero-interest debt at $100/month pays off in 12 months with no interest.
    coverage: covered
    tests:
      - tests/Feature/Services/PayoffPlanServiceTest.php::pays off a zero-interest debt over the expected number of months
  - id: show_page_renders
    kind: happy_path
    description: Owner opens the plan page and receives the projection props.
    coverage: covered
    tests:
      - tests/Feature/PayoffPlans/PayoffPlanProjectionTest.php::owner sees the plan page with the month-by-month projection and goal estimates
  - id: extra_payment_shortens
    kind: alternate
    description: A monthly extra payment shortens the payoff timeline.
    coverage: covered
    tests:
      - tests/Feature/Services/PayoffPlanServiceTest.php::extra payments shorten the payoff timeline
  - id: interest_accrual
    kind: edge
    description: 12% APR accrues 1% per month on the running balance (traced to 1525 cents over 3 months).
    coverage: covered
    tests:
      - tests/Feature/Services/PayoffPlanServiceTest.php::accrues interest month over month
  - id: payoff_never_reached
    kind: edge
    description: When minimum plus extra payments do not exceed monthly interest, the plan should report that payoff is never reached.
    coverage: uncovered
    note: currently the loop silently stops at 600 months and returns a payoff_date 50 years out with balances still positive.
  - id: zero_balance_debt
    kind: edge
    description: A plan whose debts all start at zero balance returns an empty timeline and total_months 0.
    coverage: covered
    tests:
      - tests/Feature/PayoffPlans/PayoffPlanProjectionTest.php::a plan whose debts all start at zero balance has an empty timeline and zero months
  - id: multi_debt_rollover
    kind: edge
    description: With several debts, leftover extra payment and freed minimums from a paid-off debt roll into the next debt.
    coverage: uncovered
    note: not implemented; the extra loop breaks after the first debt and freed minimums are dropped (see known_issues).
  - id: goal_with_zero_contribution
    kind: edge
    description: A goal with 0 monthly contribution has null months_to_complete.
    coverage: covered
    tests:
      - tests/Feature/PayoffPlans/PayoffPlanProjectionTest.php::a goal with no monthly contribution has no completion estimate
  - id: cross_user_or_cross_budget
    kind: authorization
    description: Another user's plan returns 403 (budget not owned) or 404 (plan not in the URL budget).
    coverage: covered
    tests:
      - tests/Feature/PayoffPlans/PayoffPlanAuthorizationTest.php::another user cannot view a payoff plan in a budget they do not own
      - tests/Feature/PayoffPlans/PayoffPlanAuthorizationTest.php::payoff plan routes reject a plan addressed through another budget with 404
      - tests/Feature/PayoffPlans/PayoffPlanAuthorizationTest.php::payoff plan routes reject the owners plan addressed through the owners other budget with 404
known_issues:
  - The extra payment is applied only to the first unpaid debt with `break`; any remainder after that debt reaches zero is discarded and minimum payments of paid-off debts are not rolled over, so snowball/avalanche timelines are longer than the strategies promise.
  - No "never paid off" signal; negative-amortisation plans report total_months 600 and a far-future payoff_date with positive final balances.
  - Interest accrues before payments every month including month 1, so a plan starting on the statement date charges a full month of interest immediately.
  - Goal projections ignore the debt timeline (contributions start at plan start rather than after debts are paid).
confidence: high
evidence:
  - app/Http/Controllers/PayoffPlanController.php show
  - app/Services/PayoffPlanService.php calculatePayoffProjection/calculateGoalProjections
  - tests/Feature/Services/PayoffPlanServiceTest.php
last_verified: null
