schema: 1
id: PAYOFF-003
name: User edits or deletes a payoff plan
domain: payoff
status: implemented
priority: medium
summary: >
  From a plan's page the user opens Edit to change the plan's name, description,
  strategy, monthly extra payment or active flag, or deletes the plan. Debts and goals
  cannot be edited after creation.
actors:
  - authenticated budget owner
preconditions:
  - user owns a budget with a payoff plan
routes:
  - payoff-plans.edit
  - payoff-plans.update
  - payoff-plans.destroy
integrations: []
steps:
  - action: open budget/{budget}/payoff-plans/{payoff_plan}/edit
    expected: PayoffPlans/Edit with the plan, debts and goals
  - action: save changes (PATCH)
    expected: plan updated; redirect to payoff-plans.show with "Payoff plan updated successfully"
  - action: delete from the edit page (DELETE)
    expected: plan removed; redirect to payoff-plans.index with "Payoff plan deleted successfully"
postconditions:
  - plan reflects the edits, or no longer exists
business_rules:
  - name required (max 255); strategy in snowball, avalanche, custom; monthly_extra_payment_cents integer >= 0
  - only plan-level fields are editable; debts and goals are not
  - all three actions require the budget update ability; plan is scoped to the budget
scenarios:
  - id: update_plan
    kind: happy_path
    description: Owner changes the strategy and extra payment and sees the recalculated projection.
    coverage: covered
    tests:
      - tests/Feature/PayoffPlans/PayoffPlanLifecycleTest.php::updating a plan persists the changes and the show page reflects the recalculated projection
      - tests/Feature/PayoffPlans/PayoffPlanLifecycleTest.php::edit page renders the plan with its debts and goals
  - id: delete_plan
    kind: alternate
    description: Owner deletes a plan and returns to the plans index.
    coverage: covered
    tests:
      - tests/Feature/PayoffPlans/PayoffPlanLifecycleTest.php::deleting a plan removes it with its debts and redirects to the plans index
  - id: update_validation
    kind: validation
    description: Unknown strategy or negative extra payment is rejected.
    coverage: covered
    tests:
      - tests/Feature/PayoffPlans/PayoffPlanLifecycleTest.php::updating a plan rejects invalid input and leaves the plan unchanged
  - id: reactivate_plan_keeps_single_active
    kind: edge
    description: Setting is_active on one plan should deactivate the others, as store does.
    coverage: uncovered
    note: update does not deactivate other plans, so several plans can be active at once (see known_issues).
  - id: cross_user_or_cross_budget
    kind: authorization
    description: Another user cannot edit, update or delete a plan (403 for foreign budget, 404 for plan outside the URL budget).
    coverage: covered
    tests:
      - tests/Feature/PayoffPlans/PayoffPlanAuthorizationTest.php::another user cannot open the edit page of a payoff plan they do not own
      - tests/Feature/PayoffPlans/PayoffPlanAuthorizationTest.php::another user cannot update a payoff plan they do not own
      - tests/Feature/PayoffPlans/PayoffPlanAuthorizationTest.php::another user cannot delete a payoff plan they do not own
      - tests/Feature/PayoffPlans/PayoffPlanAuthorizationTest.php::payoff plan routes reject a plan addressed through another budget with 404
      - tests/Feature/PayoffPlans/PayoffPlanAuthorizationTest.php::payoff plan routes reject the owners plan addressed through the owners other budget with 404
known_issues:
  - update accepts is_active but never deactivates other plans, breaking the single-active-plan invariant enforced by store.
  - Debts (APR, minimum payment) and goals cannot be changed after creation; the only fix for a typo is deleting and recreating the plan.
confidence: high
evidence:
  - app/Http/Controllers/PayoffPlanController.php edit/update/destroy
  - resources/js/Pages/PayoffPlans/Edit.vue, Show.vue
last_verified: null
