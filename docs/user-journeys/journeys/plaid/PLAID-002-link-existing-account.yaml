schema: 1
id: PLAID-002
name: User links an existing budget account to Plaid
domain: plaid
status: implemented
priority: high
summary: >
  From an account (budget page or account edit page) the user opens the Bank Connection
  page, launches Plaid Link and picks the matching bank account. The server exchanges the
  public token and either reuses an active connection for the same Plaid item,
  re-links a previously linked (orphaned) PlaidAccount, or creates a new connection, then
  runs a transaction sync. The same page shows connection metadata for linked accounts.
actors:
  - budget owner
preconditions:
  - user is authenticated and owns (or can view) the budget
  - the account belongs to the budget in the URL (scoped bindings)
routes:
  - plaid.link
  - plaid.store
depends_on:
  - path: app/Services/PlaidService.php
    reason: createLinkToken, exchangePublicToken, getAccounts, linkAccountToConnection, createOrFindConnection, removeItem, syncTransactions
integrations:
  - Plaid Link
  - Plaid API (/link/token/create, /item/public_token/exchange, /accounts/get, /institutions/*, /item/remove)
steps:
  - action: open budget/{budget}/account/{account}/plaid/link
    expected: Plaid/Link rendered with linkToken, isLinked flag and connection metadata when already linked
  - action: complete Plaid Link and select one account
    expected: client posts public_token and metadata (item id synthesised client-side when absent) to plaid.store
  - action: server links the account
    expected: redirect to budgets.show with a success message naming the reused or new connection
postconditions:
  - a PlaidAccount points the local account at an active PlaidConnection
  - transactions for the account have been synced (best effort)
business_rules:
  - "linking an account (plaid.link, plaid.store) is owner-only (BudgetPolicy::manageConnections); editors and viewers get 403"
  - an existing active connection is reused only when its plaid_item_id matches, scoped to the budget; a different Item at the same institution gets its own connection holding its own access token (never matched by institution_id)
  - when an Item's connection is reused, the token just exchanged is stored on it, so syncs use the token the account was read with
  - if linking fails after the token exchange and no stored connection holds the new Item (by item id or token), the Item is removed at Plaid (/item/remove, best effort)
  - an account that already has a PlaidAccount is re-linked in place instead of duplicated
  - metadata.institution.institution_id and metadata.item.id (or metadata.item_id) are optional, validated and used for connection matching and creation; a missing item id gets a generated plaid-item-<uniqid> on the server (Link.vue sends null rather than inventing one)
  - a failed post-link transaction sync keeps the link and adds a user-safe error flash
  - the selected metadata.account.id must exist in Plaid's /accounts/get response or linking fails
scenarios:
  - id: link_page_renders
    kind: happy_path
    description: Owner opens the Bank Connection page for an unlinked account and receives a link token.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidLinkAccountPageTest.php::the bank connection page renders a link token for an unlinked account
  - id: store_creates_new_connection
    kind: happy_path
    description: Linking with no matching connection creates a new PlaidConnection and PlaidAccount and redirects with "Account linked to Plaid successfully."
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidLinkAccountPageTest.php::linking an account with no matching connection creates a new connection
  - id: store_reuses_existing_connection
    kind: alternate
    description: Linking an account from a Plaid item already connected in the budget attaches it to that item's connection.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidLinkTest.php::linking an account reuses the active connection for the same Plaid item
  - id: store_new_item_same_institution
    kind: alternate
    description: Linking an account from a new Plaid item at an institution already connected under another item (or with no item id) creates a separate connection with the new access token; the older connection and its token are untouched.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidLinkTest.php::linking a new Plaid item at an institution already connected stores it as its own connection
      - tests/Feature/Plaid/PlaidLinkTest.php::a link with no Plaid item id never joins another connection at the same institution
      - tests/Feature/Plaid/PlaidLinkTest.php::re-linking a stale account at an institution connected under another item creates its own connection
  - id: failed_link_removes_unstored_item
    kind: recovery
    description: When linking fails after the exchange and no connection holds the new Item, it is removed at Plaid; an Item an existing connection holds is left in place.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidLinkTest.php::a link that fails before the new item is stored removes that item at Plaid
      - tests/Feature/Plaid/PlaidLinkTest.php::a failed link for an item an existing connection holds leaves that item in place
  - id: relink_orphaned_account
    kind: alternate
    description: An account with a stale PlaidAccount is updated to point at the active connection for the same item, or a newly created connection (created from the Link metadata's item and institution ids).
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidLinkTest.php::re-linking an account with a stale Plaid link creates a connection from the Link metadata
      - tests/Feature/Plaid/PlaidLinkAccountPageTest.php::re-linking an account with a stale Plaid link onto an active connection reuses it
  - id: linked_page_shows_metadata
    kind: alternate
    description: For an already linked account the page shows status, institution, last sync and any error_message.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidLinkAccountPageTest.php::the bank connection page shows connection metadata for a linked account
  - id: store_validation
    kind: validation
    description: Missing public_token, metadata.institution.name or metadata.account.id fails validation.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidLinkAccountPageTest.php::linking requires a public token, institution name and account id
  - id: account_missing_from_plaid_response
    kind: recovery
    description: If the chosen account id is absent from Plaid's account list, the user is redirected back with "Failed to link account".
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidLinkAccountPageTest.php::linking an account missing from the Plaid response redirects back with an error and links nothing
  - id: link_form_cross_budget_account
    kind: authorization
    description: Opening the link page with an account from another budget returns 404 via scoped bindings.
    coverage: covered
    tests:
      - tests/Feature/NestedRouteAuthorizationTest.php::plaid link form rejects a cross-budget account with 404
  - id: store_cross_user_denied
    kind: authorization
    description: Posting plaid.store against another user's budget/account is rejected (403/404).
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidLinkAccountPageTest.php::linking an account in another users budget is forbidden and changes nothing
  - id: link_failure_message_is_user_safe
    kind: recovery
    description: A failure linking an account flashes "Failed to link account. Please try again." (or the could-not-reach message for a connect timeout); the raw exception is only logged.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidSafeErrorMessagesTest.php::a Plaid error when linking an account shows a generic message without the raw Plaid text
      - tests/Feature/Plaid/PlaidSafeErrorMessagesTest.php::a connect timeout on token exchange shows a could not reach message without the cURL error
  - id: shared_budget_non_owner_denied
    kind: authorization
    description: Editors and viewers of a shared budget get 403 on the link page and store, and nothing reaches Plaid.
    coverage: covered
    tests:
      - tests/Feature/Plaid/SharedBudgetPlaidAccessTest.php::editors and viewers cannot connect, re-authenticate or unlink bank connections
known_issues: []
confidence: high
evidence:
  - app/Http/Controllers/PlaidController.php showLinkForm(), store(), relinkExistingAccount()
  - resources/js/Pages/Plaid/Link.vue
  - links from resources/js/Pages/Budgets/Show.vue and resources/js/Pages/Accounts/Edit.vue
