schema: 1
id: PLAID-003
name: User refreshes transactions, balance, liabilities or holdings for a Plaid-linked account
domain: plaid
status: implemented
priority: critical
summary: >
  On the Bank Connection page the user clicks "Sync" for one linked account. A single
  sync pulls 180 days of transactions and also refreshes the balance, credit-card
  liability data and investment holdings. The endpoint is throttled and redirects
  back with a flash message. (The unused balance/liabilities/investments-only
  endpoints were removed; sync still runs those refreshes.)
actors:
  - budget owner
preconditions:
  - the account is linked to Plaid with an active connection access token
routes:
  - plaid.sync
depends_on:
  - path: app/Services/PlaidService.php
    reason: syncTransactions, updateAccountBalance, updateLiabilityData, updateInvestmentData
  - path: app/Services/RecurringTransactionService.php
    reason: auto-links newly imported transactions to recurring templates during sync
  - path: app/Console/Commands/CleanupDuplicatePlaidTransactions.php
    reason: operator repair for duplicated pending rows the sync left behind; shares PlaidService::carryOverUserEdits
integrations:
  - Plaid API (/transactions/get, /accounts/get, /liabilities/get, /investments/holdings/get)
steps:
  - action: click Sync on Plaid/Link (POST budget/{budget}/account/{account}/plaid/sync)
    expected: redirect back with "Synced N new and updated M transactions."; page reloads plaidAccount/account props
postconditions:
  - new Plaid transactions are imported and existing ones updated
  - PlaidAccount and Account balances reflect Plaid's latest values
business_rules:
  - "syncing needs the editor role (BudgetPolicy::sync): editors and owners may sync, viewers get 403"
  - plaid.sync is limited to 5 requests/minute
  - balance uses Plaid current, falling back to available; if both are missing the last known balance is kept
  - sync refreshes liabilities only for credit card accounts and holdings only for investment accounts
  - a holdings refresh deletes stored positions Plaid no longer returns (sold or closed) for each account the response reports, but only when the response carried at least one holding; an empty answer leaves stored positions alone
  - an account with no PlaidAccount gets "Account is not linked to Plaid."
  - Plaid errors during sync reach the controller (PlaidService rethrows, prefixed with the Plaid error code) and are flashed as user-safe errors; raw Plaid text is only logged
  - PRODUCT_NOT_READY yields the "still being processed, try again in 1-3 days" message
  - ITEM_LOGIN_REQUIRED marks the PlaidConnection as 'error' (PlaidConnection::markAsError) and flashes "Your bank needs you to sign in again. Use Re-authenticate to reconnect this account."
  - a connect timeout flashes "Couldn't reach the bank connection service, please try again."; any other failure "Failed to sync transactions. Please try again."
  - investment accounts tolerate a transaction fetch failure (continue to balance/holdings) unless it is ITEM_LOGIN_REQUIRED
  - a re-sync of an already imported transaction refreshes its amount and date from Plaid; its category is refreshed only while it is still the one Plaid gave it (no category_id, and Uncategorized or Plaid's previous category), so a category the user set, or a link to a budget category, is never overwritten
  - "a re-sync refreshes the description only while it is still the name Plaid last sent (blank, or equal to the raw plaid_transactions row's previous name), on both the existing-row update and the pending new-id merge; a description the user edited, or one carried over from a pending row, is kept on every later sync. A row with no raw Plaid copy keeps a non-blank description"
  - a posted transaction that settles an imported pending one (by pending_transaction_id, or else the closest still-pending look-alike on the account) updates that row in place with the new Plaid id, amount and date, so its category, notes, recurring link and attachments are kept
  - a leftover pending row that a settled one replaces (legacy state where both rows exist, or extra still-pending look-alikes) is deleted only after its file attachments move to the settled row (duplicates of a file already attached there are dropped) and a category or description the user set on it is copied over; each is copied only while the settled row's own is still Plaid's (PlaidService::carryOverUserEdits, shared with the plaid:cleanup-duplicates command); its notes and recurring link (with its link source) are copied only when the settled row has none of its own
  - the operator command plaid:cleanup-duplicates merges only rows whose raw Plaid row on the same account is still pending, matched like the sync's pending look-alikes (amount within $1, date within --days, similar description); posted look-alikes are separate charges and are never merged or deleted
  - a pending transaction arriving under a new Plaid id is merged into the closest look-alike that Plaid still reports as pending (amount within $1, date within 3 days, similar description); posted look-alikes are never matched
  - syncs of one Plaid connection run one at a time (cache lock plaid-sync:connection:{id}, waiting up to 60s for a running sync before failing with the generic sync error), so concurrent syncs cannot import the same transaction twice
  - a Plaid transaction id is matched only against rows on the synced account (existing-row update and pending_transaction_id cleanup), so rows another budget imported from the same Item are never updated or deleted
  - raw plaid_transactions rows are unique per (account_id, plaid_transaction_id) and upserted on both, so an Item synced into two budgets keeps a separate raw row (and pending flag) per account; the account register joins raw rows on both columns
  - /transactions/get is paged (options.count 500, increasing options.offset) until total_transactions is reached, so the whole 180-day window is imported for every account on the Item
scenarios:
  - id: sync_imports_transactions
    kind: happy_path
    description: Syncing a linked account imports/updates transactions and reports the counts.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidSyncTest.php::syncing a linked account imports new and updates existing transactions
  - id: resync_keeps_user_category
    kind: edge
    description: Re-syncing an imported transaction refreshes its amount, date and (Plaid-owned) description, but keeps a category the user picked (a budget category or a typed name); a category Plaid set is refreshed.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidSyncTest.php::a re-sync refreshes amount, date and description but never a category the user has set
  - id: resync_keeps_user_description
    kind: edge
    description: Re-syncing keeps a description the user edited, on later syncs too, while a description still carrying Plaid's last name is refreshed; a pending row re-sent under a new id keeps its edited description; a description carried over from a leftover pending row survives the next sync.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidSyncTest.php::a re-sync keeps a description the user has edited, and refreshes one still carrying the name Plaid last sent
      - tests/Feature/Plaid/PlaidSyncTest.php::a pending transaction re-sent under a new Plaid id keeps a description the user has edited
      - tests/Feature/Plaid/PlaidSyncTest.php::a leftover pending row is deleted only after its receipts, user edits, notes and recurring link move to the settled row
  - id: sync_pages_all_transactions
    kind: edge
    description: When the Item has more transactions than one /transactions/get page, sync keeps paging until total_transactions and imports all of this account's rows.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidSyncTest.php::syncing pages through every transaction Plaid has, not just the first page
  - id: pending_settles_in_place
    kind: edge
    description: When a pending purchase posts, the existing row is updated in place rather than replaced, so the user's category, notes, recurring link and receipts survive.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidSyncTest.php::a posted transaction settles its pending row in place, keeping the user edits and receipts
  - id: leftover_pending_edits_carried_over
    kind: edge
    description: When a settled transaction already exists next to its pending row (or further pending look-alikes remain), the pending row is deleted but its receipts, user category, user description, notes and recurring link move to the settled row (notes and link only when the settled row has none).
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidSyncTest.php::a leftover pending row is deleted only after its receipts, user edits, notes and recurring link move to the settled row
      - tests/Feature/Plaid/PlaidSyncTest.php::a leftover pending row's notes and recurring link never replace the settled row's own
  - id: pending_new_id_merged_not_posted
    kind: edge
    description: A pending transaction Plaid re-sends under a new id updates the existing pending row instead of duplicating it, while a posted look-alike at the same merchant is left alone.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidSyncTest.php::a pending transaction with a new Plaid id replaces its pending look-alike but never a posted one
  - id: plaid_ids_scoped_to_account
    kind: edge
    description: When another budget already holds rows with the same Plaid transaction ids (the Item was linked there before), sync imports its own rows and leaves the other budget's rows untouched, including pending rows named by pending_transaction_id.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidSyncTest.php::a sync only matches Plaid ids on its own account, never another budget's rows for the same Item
    note: the same test checks each account keeps its own raw plaid_transactions row and the register lists the shared id once.
  - id: concurrent_syncs_serialised
    kind: edge
    description: A sync holds a per-connection lock while it imports and releases it afterwards, so two members or tabs syncing at once cannot duplicate transactions.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidSyncTest.php::a sync holds the connection lock while it imports, so concurrent syncs cannot insert the same transaction twice
  - id: balance_uses_current
    kind: happy_path
    description: Balance refresh stores Plaid's current balance on both PlaidAccount and Account.
    coverage: covered
    tests:
      - tests/Feature/Services/PlaidBalanceSyncTest.php::uses the current balance when Plaid provides it
  - id: balance_falls_back_to_available
    kind: edge
    description: When Plaid omits current, the available balance is stored instead of 0.
    coverage: covered
    tests:
      - tests/Feature/Services/PlaidBalanceSyncTest.php::falls back to the available balance when current is null
  - id: balance_keeps_last_known
    kind: edge
    description: When Plaid omits both balances the previous balance is preserved.
    coverage: covered
    tests:
      - tests/Feature/Services/PlaidBalanceSyncTest.php::keeps the last known balance when Plaid omits both balances
  - id: not_linked_account
    kind: edge
    description: Sync on an unlinked account redirects back with "Account is not linked to Plaid."
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidSyncTest.php::sync refuses an account that is not linked to Plaid
  - id: liabilities_rejected_for_non_credit_card
    kind: validation
    description: Liabilities refresh on a non-credit-card account is refused with an explanatory error.
    coverage: not_applicable
    note: the liabilities-only endpoint (plaid.liabilities) was removed as it had no frontend caller; sync only refreshes liabilities for credit cards.
  - id: investments_rejected_for_non_investment
    kind: validation
    description: Investments refresh on a non-investment account is refused with an explanatory error.
    coverage: not_applicable
    note: the investments-only endpoint (plaid.investments) was removed as it had no frontend caller; sync only refreshes holdings for investment accounts.
  - id: sync_rate_limited
    kind: edge
    description: The sixth sync within a minute returns 429.
    coverage: covered
    tests:
      - tests/Feature/SecurityRateLimitingTest.php::plaid sync endpoint has rate limiting
  - id: plaid_error_surfaced_on_sync
    kind: integration
    description: A Plaid API error (e.g. ITEM_LOGIN_REQUIRED, timeout) during sync is reported to the user as a failure; ITEM_LOGIN_REQUIRED also puts the connection into 'error'.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidSyncTest.php::a login required error during sync shows a re-authenticate error and marks the connection as errored
      - tests/Feature/Plaid/PlaidSyncTest.php::a Plaid error or timeout during sync shows a failure instead of a zero count success
  - id: product_not_ready_message
    kind: recovery
    description: PRODUCT_NOT_READY for a fresh credit card yields the "still being processed" message rather than a generic failure.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidSyncTest.php::PRODUCT_NOT_READY during sync shows the still being processed message
  - id: cross_user_denied
    kind: authorization
    description: Sync returns 403 for another user's budget and account.
    coverage: covered
    tests:
      - tests/Feature/NestedRouteAuthorizationTest.php::plaid POST route rejects another users budget+account with 403
  - id: cross_budget_account_not_found
    kind: authorization
    description: Using one's own budget with another budget's account returns 404 via scoped bindings.
    coverage: covered
    tests:
      - tests/Feature/NestedRouteAuthorizationTest.php::plaid POST route rejects a cross-budget account with 404
  - id: sync_refreshes_liabilities_and_holdings
    kind: happy_path
    description: A sync of a credit card also stores statement/payment liability data and statement history; a sync of an investment account also stores holdings and the investment balance.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidSyncTest.php::syncing a credit card also refreshes its statement liability data
      - tests/Feature/Plaid/PlaidSyncTest.php::syncing an investment account also refreshes its holdings
  - id: duplicate_cleanup_merges_only_pending
    kind: edge
    description: plaid:cleanup-duplicates merges duplicated pending copies (moving receipts and edits to the kept copy) but leaves posted look-alikes, and a pending row next to a posted look-alike, untouched.
    coverage: covered
    tests:
      - tests/Feature/Plaid/CleanupDuplicatePlaidTransactionsTest.php::cleaning up a duplicate moves its receipts, notes, category, description and recurring link to the kept copy
      - tests/Feature/Plaid/CleanupDuplicatePlaidTransactionsTest.php::posted look-alikes are separate charges and both survive the duplicate cleanup
  - id: sold_holdings_removed
    kind: edge
    description: A position Plaid stops returning (sold or closed) is removed on the next holdings refresh, so it no longer counts in market value; an answer with no holdings at all keeps the stored positions.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidSyncTest.php::a position Plaid no longer returns is removed on the next holdings refresh, but an empty answer keeps them
  - id: refresh_endpoints_report_outcome
    kind: recovery
    description: The balance and liabilities refreshes that sync runs store Plaid's data and report failure (false) when Plaid fails or has no data, leaving the stored values unchanged.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidSyncTest.php::balance refresh updates the balance and reports Plaid failures
      - tests/Feature/Plaid/PlaidSyncTest.php::liabilities refresh updates statement data and reports when none is available
  - id: login_required_flagged_on_refresh
    kind: integration
    description: ITEM_LOGIN_REQUIRED on a balance, liabilities or investments refresh puts the connection into 'error' so re-authentication is needed.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidSyncTest.php::a login required error on a balance, liabilities or investments refresh marks the connection as errored
  - id: shared_budget_editor_syncs_viewer_denied
    kind: authorization
    description: On a shared budget an editor may sync; a viewer gets 403 and nothing reaches Plaid.
    coverage: covered
    tests:
      - tests/Feature/Plaid/SharedBudgetPlaidAccessTest.php::an editor may sync a linked account and the whole budget
      - tests/Feature/Plaid/SharedBudgetPlaidAccessTest.php::a viewer cannot sync
known_issues: []
confidence: high
evidence:
  - app/Http/Controllers/PlaidController.php syncTransactions(), handleSyncException()
  - app/Services/PlaidService.php syncTransactions() outer try/catch (logs, marks login-required connections, rethrows)
  - resources/js/Pages/Plaid/Link.vue syncAllData()
last_verified: null
