schema: 1
id: PLAID-004
name: User syncs all Plaid-linked accounts in a budget at once
domain: plaid
status: implemented
priority: high
summary: >
  From the budget overview the user clicks "Sync transactions". The server iterates
  every PlaidAccount whose local account belongs to the budget, syncs each one, sums
  the imported/updated counts and redirects back. The page then reloads transactions
  and accounts.
actors:
  - budget owner
preconditions:
  - the budget has at least one Plaid-linked account
routes:
  - plaid.sync-all
depends_on:
  - path: app/Services/PlaidService.php
    reason: syncTransactions per linked account
integrations:
  - Plaid API (/transactions/get, /accounts/get, /liabilities/get, /investments/holdings/get)
steps:
  - action: click sync on Budgets/Show (POST budget/{budget}/plaid/sync-all)
    expected: redirect back with "Synced N new and updated M transactions."
  - action: page handles success
    expected: toast shows flash.message (success) and/or flash.error (error), and transactions/accounts props reload
postconditions:
  - all linked accounts in the budget have fresh transactions and balances
business_rules:
  - limited to 3 requests per minute
  - PRODUCT_NOT_READY accounts are skipped silently
  - when every attempted account failed, the user gets a user-safe error flash ("Failed to sync transactions. Please try again." or the could-not-reach message)
  - 'when some accounts failed, the success message lists them ("N account(s) could not be synced: <names>."); raw Plaid text is only logged'
scenarios:
  - id: sync_all_happy
    kind: happy_path
    description: All linked accounts are synced and the combined counts are flashed.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidSyncAllTest.php::syncing all accounts reports the combined counts
  - id: no_linked_accounts
    kind: empty_state
    description: A budget with no Plaid accounts redirects back with "No Plaid-connected accounts found."
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidSyncAllTest.php::a budget with no linked accounts reports that nothing is connected
  - id: sync_all_rate_limited
    kind: edge
    description: The fourth sync-all within a minute returns 429.
    coverage: covered
    tests:
      - tests/Feature/SecurityRateLimitingTest.php::plaid sync-all endpoint has stricter rate limiting
  - id: partial_failure_reported
    kind: integration
    description: When some accounts fail, the successful totals are flashed with the failed account names; when all fail the user gets "Failed to sync transactions. Please try again."
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidSyncAllTest.php::sync all reports accounts that failed alongside the successful totals
      - tests/Feature/Plaid/PlaidSyncAllTest.php::sync all reports a failure even when a successful account had nothing new
      - tests/Feature/Plaid/PlaidSyncAllTest.php::sync all shows an error when every account failed
  - id: product_not_ready_skipped
    kind: edge
    description: Accounts whose Plaid data is not ready yet (PRODUCT_NOT_READY) are skipped without being reported as failures.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidSyncAllTest.php::sync all skips accounts whose Plaid data is not ready yet
  - id: cross_user_denied
    kind: authorization
    description: Syncing another user's budget returns 403.
    coverage: covered
    tests:
      - tests/Feature/NestedRouteAuthorizationTest.php::user cannot sync all transactions on another users budget
  - id: throttles_isolated_per_route
    kind: edge
    description: Each throttled route has its own counter, so requests to one route never use up another route's limit.
    coverage: covered
    tests:
      - 'tests/Feature/Security/RouteThrottleIsolationTest.php::requests to one throttled route do not use up another routes limit'
      - 'tests/Feature/Security/RouteThrottleIsolationTest.php::each throttled route still enforces its own limit'
known_issues: []
confidence: high
evidence:
  - app/Http/Controllers/PlaidController.php syncAllTransactions()
  - resources/js/Pages/Budgets/Show.vue sync-all handler
last_verified: null
