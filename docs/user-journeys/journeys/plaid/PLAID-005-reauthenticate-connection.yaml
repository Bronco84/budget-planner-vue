schema: 1
id: PLAID-005
name: User re-authenticates a Plaid connection that needs a new login
domain: plaid
status: implemented
priority: high
summary: >
  When a bank requires the user to log in again (Plaid ITEM_LOGIN_REQUIRED), the user
  clicks "Re-authenticate" on the Bank Connection page. The browser requests an
  update-mode link token, opens Plaid Link in update mode, and on success posts the
  resulting public token. Update mode repairs the Item's login in place, so the server
  does not exchange the token: it keeps the existing access token and marks the
  connection active, clearing its error message, which repairs every account under
  that connection. Only budget owners can re-authenticate.
actors:
  - budget owner
preconditions:
  - the account is linked to Plaid and its connection has an access token
routes:
  - plaid.link
  - plaid.upgrade-link-token
  - plaid.update-connection
depends_on:
  - path: app/Services/PlaidService.php
    reason: createLinkToken in update mode (existing access token)
  - path: app/Policies/BudgetPolicy.php
    reason: manageConnections (owner only)
integrations:
  - Plaid Link update mode
  - Plaid API (/link/token/create with access_token)
steps:
  - action: open the Bank Connection page for an account whose connection status is 'error'
    expected: an amber warning "Your bank needs you to sign in again" with a "Sign in again" button is shown above the actions
  - action: click Re-authenticate (or Sign in again) (axios POST plaid/upgrade-link-token)
    expected: JSON {link_token, institution_name}
  - action: complete Plaid Link in update mode
    expected: client posts public_token and metadata to plaid/update-connection
  - action: server updates the connection
    expected: access_token kept, status active, error_message null; no Plaid call; redirect back with success flash and the page reloads
postconditions:
  - the existing PlaidConnection (not a new one) holds a working access token
business_rules:
  - both endpoints (and the link page) are owner-only (BudgetPolicy::manageConnections); editors and viewers get 403
  - update mode does not exchange the public token (Plaid "Updating Items via Link"); the existing access token stays
  - both endpoints are limited to 10 requests per minute
  - upgrade-link-token returns JSON 404 when the account is not linked and 400 when the connection has no access token
  - update-connection requires public_token and metadata
  - showLinkForm exposes connectionMetadata.needs_reauth (status === 'error'); Plaid/Link.vue shows the sign-in-again warning only then, while the Re-authenticate button stays available on every linked account
  - ITEM_LOGIN_REQUIRED from a transaction sync or a balance, liabilities or investments refresh marks the PlaidConnection as 'error' (PlaidConnection::markAsError); covered in PLAID-003 login_required_flagged_on_refresh
scenarios:
  - id: reauth_prompt_on_error
    kind: alternate
    description: A connection in the 'error' state is flagged needs_reauth so the page shows the sign-in-again warning; an active connection is not.
    coverage: partial
    tests:
      - tests/Feature/Plaid/PlaidReauthPromptTest.php::the bank connection page flags a connection in the error state as needing re-authentication
      - tests/Feature/Plaid/PlaidReauthPromptTest.php::the bank connection page does not flag an active connection as needing re-authentication
    note: the page prop is asserted; the rendered warning is frontend behaviour with no browser test.
  - id: upgrade_token_issued
    kind: happy_path
    description: A linked account receives an update-mode link token and the institution name as JSON.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidReauthenticateConnectionTest.php::a linked account receives an update mode link token and the institution name
  - id: connection_updated
    kind: happy_path
    description: Completing update mode keeps the existing access token, marks the connection active and never calls /item/public_token/exchange.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidReauthenticateConnectionTest.php::completing update mode keeps the existing access token, reactivates the connection and never exchanges the public token
  - id: upgrade_token_not_linked
    kind: edge
    description: Requesting an upgrade token for an unlinked account returns JSON 404 "Account is not linked to Plaid."
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidReauthenticateConnectionTest.php::requesting an upgrade token for an unlinked account returns a JSON 404
  - id: upgrade_token_missing_access_token
    kind: edge
    description: A connection without an access token returns JSON 400.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidReauthenticateConnectionTest.php::requesting an upgrade token for a connection without an access token returns a JSON 400
  - id: update_connection_validation
    kind: validation
    description: Missing public_token or metadata fails validation.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidReauthenticateConnectionTest.php::updating a connection requires a public token and metadata and leaves it unchanged
  - id: upgrade_token_plaid_failure
    kind: integration
    description: When Plaid refuses to create the update-mode token the endpoint returns JSON 500 with a generic error (raw Plaid text only logged) and the UI toasts it.
    coverage: partial
    tests:
      - tests/Feature/Plaid/PlaidSafeErrorMessagesTest.php::a Plaid error creating an update-mode link token returns a generic JSON error
    note: the JSON 500 and its safe message are covered; the UI toast is frontend behaviour with no test.
  - id: exchange_failure_on_update
    kind: recovery
    description: No token exchange happens on update, so a Plaid token error cannot surface or replace the access token.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidSafeErrorMessagesTest.php::re-authenticating does not call Plaid, so a Plaid token error cannot surface or replace the access token
  - id: non_owner_cannot_reauthenticate
    kind: authorization
    description: Editors and viewers of a shared budget get 403 on the link page, upgrade-link-token and update-connection; nothing reaches Plaid.
    coverage: covered
    tests:
      - tests/Feature/Plaid/SharedBudgetPlaidAccessTest.php::editors and viewers cannot connect, re-authenticate or unlink bank connections
  - id: cross_user_denied
    kind: authorization
    description: Both endpoints return 403 for another user's budget/account.
    coverage: covered
    tests:
      - tests/Feature/NestedRouteAuthorizationTest.php::plaid POST route rejects another users budget+account with 403
  - id: cross_budget_account_not_found
    kind: authorization
    description: Both endpoints return 404 for an account from a different budget.
    coverage: covered
    tests:
      - tests/Feature/NestedRouteAuthorizationTest.php::plaid POST route rejects a cross-budget account with 404
confidence: high
evidence:
  - app/Http/Controllers/PlaidController.php upgradeLinkToken(), updateConnection()
  - resources/js/Pages/Plaid/Link.vue updateConnection()
  - app/Services/PlaidService.php flagLoginRequired() calls PlaidConnection::markAsError on ITEM_LOGIN_REQUIRED from syncTransactions(), updateAccountBalance(), updateLiabilityData() and updateInvestmentData()
last_verified: null
