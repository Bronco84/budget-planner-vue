schema: 1
id: PLAID-006
name: User disconnects an account from Plaid
domain: plaid
status: implemented
priority: medium
summary: >
  On the Bank Connection page the user confirms "Disconnect from Plaid". The account's
  PlaidAccount is deleted (imported transactions are kept); if that leaves the
  PlaidConnection with no accounts, the connection is deleted too and the flash says so.
actors:
  - budget owner
preconditions:
  - the account is linked to Plaid
routes:
  - plaid.destroy
depends_on: []
integrations:
  - Plaid API (/item/remove)
steps:
  - action: confirm disconnect on Plaid/Link (DELETE budget/{budget}/account/{account}/plaid)
    expected: redirect back with "Account unlinked from Plaid."
postconditions:
  - the local account and its transactions remain but are no longer linked
  - an empty PlaidConnection is removed locally and its Plaid item is removed at Plaid
business_rules:
  - "unlinking is owner-only (BudgetPolicy::manageConnections), including owner members; editors and viewers get 403"
  - when the last account is unlinked the connection is (soft) deleted and its item is removed at Plaid (/item/remove) so the access token is revoked; a Plaid failure is logged and does not block the local unlink
  - Plaid/Link toasts the flashed outcome of plaid.destroy (the unlinked message, or the not-linked error)
scenarios:
  - id: unlink_account
    kind: happy_path
    description: Unlinking deletes the PlaidAccount and keeps the account and transactions.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidUnlinkTest.php::unlinking one of several accounts keeps the connection and its Plaid item
      - tests/Feature/Plaid/PlaidUnlinkEdgeCasesTest.php::unlinking an account keeps the account and its transactions
  - id: last_account_removes_connection
    kind: alternate
    description: Unlinking the last account on a connection also deletes the connection, removes its item at Plaid, and mentions the institution in the flash.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidUnlinkTest.php::unlinking the last account removes the connection and its Plaid item
  - id: item_remove_failure_still_unlinks
    kind: recovery
    description: If Plaid /item/remove fails or times out, the account is still unlinked and the connection deleted locally (the failure is logged).
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidUnlinkTest.php::a Plaid failure removing the item still unlinks the last account locally
  - id: not_linked
    kind: edge
    description: Disconnecting an unlinked account redirects back with "Account is not linked to Plaid."
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidUnlinkEdgeCasesTest.php::disconnecting an account that is not linked redirects back with an error
  - id: cross_budget_account_not_found
    kind: authorization
    description: Disconnecting an account from another budget via one's own budget URL returns 404.
    coverage: covered
    tests:
      - tests/Feature/NestedRouteAuthorizationTest.php::plaid destroy rejects a cross-budget account with 404
  - id: cross_user_denied
    kind: authorization
    description: Disconnecting another user's account via their budget URL returns 403.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidUnlinkEdgeCasesTest.php::disconnecting another users account is forbidden and leaves the link in place
  - id: shared_budget_non_owner_denied
    kind: authorization
    description: Editors and viewers of a shared budget get 403 when unlinking and the link is kept.
    coverage: covered
    tests:
      - tests/Feature/Plaid/SharedBudgetPlaidAccessTest.php::editors and viewers cannot connect, re-authenticate or unlink bank connections
  - id: co_owner_unlinks
    kind: alternate
    description: An owner member (not the primary owner) may unlink.
    coverage: covered
    tests:
      - tests/Feature/Plaid/SharedBudgetPlaidAccessTest.php::a co-owner may manage bank connections
known_issues: []
confidence: high
evidence:
  - app/Http/Controllers/PlaidController.php destroy()
  - resources/js/Pages/Plaid/Link.vue confirmDisconnect()
last_verified: null
