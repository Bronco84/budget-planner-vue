schema: 1
id: PLAID-008
name: User browses raw Plaid transactions for an account
domain: plaid
status: deprecated
priority: low
summary: >
  Endpoints to list raw PlaidTransaction rows for an account: an Inertia page
  (paginated 20 per page), a JSON API with date/pending/search filters and pagination,
  and a JSON detail lookup by Plaid transaction id. No UI in resources/js links to
  these routes. DEPRECATED: the routes, controller and (never-built) page were
  removed as unreachable; this file is kept so the id is not reused.
actors:
  - budget owner
preconditions:
  - the account has imported Plaid transactions
routes: []
depends_on: []
integrations: []
steps:
  - action: GET budget/{budget}/account/{account}/plaid-transactions
    expected: Inertia page PlaidTransactions/Index with paginated transactions (page component missing, see known_issues)
  - action: GET .../plaid-transactions/api?start_date=&end_date=&pending=&search=&per_page=
    expected: JSON paginator of matching transactions ordered by date desc
  - action: GET .../plaid-transactions/{plaidTransactionId}
    expected: JSON transaction, or 404 {error} when not found for this account
postconditions:
  - none (read-only)
business_rules:
  - per_page is 1..100 (default 20); search matches name, merchant_name or category
scenarios:
  - id: api_lists_transactions
    kind: happy_path
    description: The JSON API returns the account's Plaid transactions with filters applied.
    coverage: not_applicable
    note: 'journey deprecated; the plaid-transactions routes were removed as unreachable'
  - id: api_validation
    kind: validation
    description: Invalid per_page, dates or pending values fail validation.
    coverage: not_applicable
    note: 'journey deprecated; the plaid-transactions routes were removed as unreachable'
  - id: show_not_found
    kind: edge
    description: Unknown or other-account Plaid transaction ids return JSON 404.
    coverage: not_applicable
    note: 'journey deprecated; the plaid-transactions routes were removed as unreachable'
  - id: index_page_renders
    kind: happy_path
    description: The Inertia index page renders the paginated list.
    coverage: not_applicable
    note: 'journey deprecated; the plaid-transactions routes were removed as unreachable'
  - id: cross_user_denied
    kind: authorization
    description: Another user's budget/account returns 403; a cross-budget account returns 404.
    coverage: not_applicable
    note: 'journey deprecated; the plaid-transactions routes were removed as unreachable'
known_issues:
  - "Removed as unreachable: the plaid-transactions.index/api/show routes and PlaidTransactionController were deleted. No frontend code linked to them and the index page component (PlaidTransactions/Index) never existed. Raw Plaid transactions remain stored but have no browsing UI."
confidence: medium
evidence:
  - routes/web.php no longer defines plaid-transactions.* routes
  - grep of resources/js found no reference to plaid-transactions before removal
