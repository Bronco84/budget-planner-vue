schema: 1
id: PLAID-009
name: User refreshes credit card statement data from the Plaid liabilities page
domain: plaid
status: implemented
priority: medium
summary: >
  The /admin/plaid-liabilities page lists every Plaid connection on the user's own
  budgets that has credit card accounts, with each card's statement balance, due date,
  minimum payment, limit and APR. The user can refresh liability data for one
  connection or for all connections at once.
actors:
  - authenticated user
preconditions:
  - the user owns budgets with Plaid-linked credit cards
routes:
  - admin.plaid-liabilities.index
  - admin.plaid-liabilities.update-connection
  - admin.plaid-liabilities.update-all
depends_on:
  - path: app/Services/PlaidService.php
    reason: updateLiabilityData (one /liabilities/get call refreshes all cards on a connection)
integrations:
  - Plaid API (/liabilities/get)
steps:
  - action: open /admin/plaid-liabilities
    expected: Admin/PlaidLiabilities rendered with connections that have credit cards
  - action: click update on a connection (POST admin/plaid-liabilities/connections/{connection}/update)
    expected: redirect back with "Successfully updated liability data for <institution>."
  - action: click update all (POST admin/plaid-liabilities/update-all)
    expected: redirect back with a success, partial-success or failure message
postconditions:
  - PlaidAccount liability fields and statement history are refreshed
business_rules:
  - "the admin page lists and refreshes only connections of budgets the user owns (primary owner or owner member, Budget::scopeOwnedBy); editors and viewers of a shared budget see nothing and get 403 on refresh"
  - despite the /admin prefix these routes are not admin-gated; any authenticated user sees only connections on budgets they own (see the previous rule)
  - update-connection is limited to 10/minute, update-all to 3/minute
  - only accounts with account_type credit and subtype "credit card" are included
scenarios:
  - id: page_lists_owned_cards
    kind: happy_path
    description: The page lists only the user's own connections that have credit cards.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidLiabilitiesAdminTest.php::the liabilities page lists only the users own connections with credit cards
  - id: update_one_connection
    kind: happy_path
    description: Refreshing one connection updates its cards and flashes success.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidLiabilitiesAdminTest.php::refreshing one connection updates its cards and flashes success
  - id: update_all_partial_failure
    kind: integration
    description: When some institutions do not support liabilities, update-all reports how many succeeded and failed.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidLiabilitiesAdminTest.php::refreshing all connections reports how many succeeded and failed
  - id: no_credit_cards
    kind: empty_state
    description: With no credit card connections the page is empty and update-all flashes "No credit card accounts found to update."
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidLiabilitiesAdminTest.php::with no credit card connections the page is empty and update all reports nothing to update
  - id: connection_without_cards
    kind: edge
    description: Updating a connection with no credit cards flashes an error.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidLiabilitiesAdminTest.php::refreshing a connection without credit cards flashes an error
  - id: update_rate_limited
    kind: edge
    description: Exceeding 10/min (connection) or 3/min (all) returns 429.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidLiabilitiesAdminTest.php::refreshing one connection is rate limited to ten per minute
      - tests/Feature/Plaid/PlaidLiabilitiesAdminTest.php::refreshing all liabilities is rate limited to three per minute
  - id: other_users_connection_refused
    kind: authorization
    description: Updating another user's connection returns 403 and makes no Plaid call.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidLiabilitiesConnectionTest.php::refreshing another users connection is forbidden and calls no Plaid endpoint
  - id: shared_budget_owners_only
    kind: authorization
    description: Editors see no shared connections and get 403 refreshing one; an owner member sees it.
    coverage: covered
    tests:
      - tests/Feature/Plaid/SharedBudgetPlaidAccessTest.php::the liabilities admin page shows and refreshes connections only for budgets the user owns
known_issues:
  - the route path/name (/admin/plaid-liabilities, admin.*) suggests admin-only access that is not enforced.
confidence: high
evidence:
  - app/Http/Controllers/PlaidLiabilitiesController.php
  - resources/js/Pages/Admin/PlaidLiabilities.vue
  - routes/web.php admin.* group (auth only)
last_verified: null
