schema: 1
id: PLAID-010
name: User attempts to connect or sync while Plaid is unavailable or misconfigured
domain: plaid
status: implemented
priority: high
summary: >
  Exceptional journey. When Plaid credentials are missing, DNS fails, the API times out
  (5s connect / 30s request) or returns an error, the app must degrade without a 500:
  connect pages render with no link token (connect button disabled), token exchange
  failures redirect back with an error flash, and sync failures should be reported.
actors:
  - budget owner
preconditions:
  - Plaid is unreachable, misconfigured, or returns API errors
routes:
  - budgets.setup
  - plaid.discover
  - plaid.link
  - plaid.import
  - plaid.store
  - plaid.sync
depends_on:
  - path: app/Services/PlaidService.php
    reason: isConfigured guard, Guzzle timeouts, ConnectException/RequestException translation into user messages
integrations:
  - Plaid API
steps:
  - action: open setup, discover or link page while createLinkToken throws
    expected: page renders with linkToken null; error is logged; connect button disabled with "Bank connections are unavailable right now. Try again later." beside it
  - action: submit import/store while token exchange fails
    expected: redirect back with "Failed to import accounts" / "Failed to link account" error flash
  - action: sync while Plaid errors
    expected: redirect back with a user-safe error flash (could-not-reach message for timeouts)
postconditions:
  - no partial PlaidConnection is created when exchange fails
business_rules:
  - createLinkToken maps ConnectException to "Unable to connect to Plaid..." (DNS / timeout variants) and RequestException to Plaid's error_message
  - unconfigured Plaid throws "Plaid service is not properly configured" before any HTTP call
scenarios:
  - id: pages_render_without_link_token
    kind: happy_path
    description: Setup, discover and link pages render (200) with linkToken null when Plaid is down.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidOutageTest.php::connect pages render without a link token when Plaid returns an error
  - id: unconfigured_plaid
    kind: edge
    description: With no client id/secret, link token creation is refused without an HTTP call and pages still render.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidOutageTest.php::unconfigured Plaid refuses link token creation without calling the API
  - id: link_timeout
    kind: integration
    description: A connect timeout to Plaid produces the friendly "Connection timed out" message in logs and a disabled connect button rather than a hung request.
    coverage: partial
    tests:
      - tests/Feature/Plaid/PlaidOutageTest.php::a connect timeout while creating a link token is logged with a friendly message
      - tests/Feature/Plaid/PlaidOutageTest.php::Plaid requests are bounded by connect and request timeouts
    note: 'server side covered (friendly log message, linkToken null, 5s/30s client timeouts); the disabled connect button is frontend behaviour. Not browser tested: every page that shows it (budget setup, account create, Plaid discover/link) creates a Plaid Link token while rendering, and the local environment points at a real Plaid environment, so the E2E specs block those pages (tests/playwright/support/plaid.js) rather than call Plaid.'
  - id: exchange_failure_redirects
    kind: recovery
    description: A failed /item/public_token/exchange on import or store redirects back with an error flash and no connection.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidOutageTest.php::a failed token exchange on import redirects back with an error and no connection
      - tests/Feature/Plaid/PlaidOutageTest.php::a failed token exchange when linking one account redirects back with an error and no connection
  - id: exchange_timeout_message
    kind: integration
    description: A connect timeout/DNS failure during token exchange flashes "Couldn't reach the bank connection service, please try again." instead of the raw cURL error.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidSafeErrorMessagesTest.php::a connect timeout on token exchange shows a could not reach message without the cURL error
      - tests/Feature/Plaid/PlaidOutageTest.php::a failed token exchange on import redirects back with an error and no connection
  - id: sync_failure_reported
    kind: recovery
    description: A Plaid error or connect timeout during sync is surfaced to the user as a failure.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidSyncTest.php::a Plaid error or timeout during sync shows a failure instead of a zero count success
  - id: authorization
    kind: authorization
    description: Ownership enforcement for these routes is catalogued in PLAID-001/002/003.
    coverage: not_applicable
    note: this journey is about external failure handling; authorization is covered by the owning journeys.
known_issues: []
confidence: medium
evidence:
  - app/Services/PlaidService.php createLinkToken(), getConnectionErrorMessage(), exchangePublicToken(), initializeClient() timeouts
  - app/Http/Controllers/PlaidController.php try/catch around createLinkToken
last_verified: null
