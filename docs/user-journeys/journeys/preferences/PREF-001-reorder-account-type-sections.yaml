schema: 1
id: PREF-001
name: User reorders account type sections and the order persists
domain: preferences
status: implemented
priority: medium
summary: >
  On the budget page the user drags account type sections (checking, savings,
  credit card...) into a new order. The page posts the full order to the
  preferences API, which stores it in user_preferences.other_preferences; the
  page then partially reloads userAccountTypeOrder. The saved order is used by
  BudgetController for section ordering and default account selection. A generic
  key/value preference endpoint can also read and write arbitrary keys.
actors:
  - authenticated user
preconditions:
  - user has a budget with accounts of more than one type
routes:
  - preferences.account-type-order.get
  - preferences.account-type-order.update
  - preferences.show
  - preferences.update
depends_on:
  - path: resources/js/Pages/Budgets/Show.vue
    reason: draggable sections and saveAccountTypeOrder fetch call
  - path: app/Models/UserPreference.php
    reason: storage in built-in columns or the other_preferences JSON column
steps:
  - action: drag an account type section to a new position on the budget page
    expected: POST /api/preferences/account-type-order with the full order
  - action: server validates and stores
    expected: JSON {order, message}; page reloads only userAccountTypeOrder
  - action: revisit the budget
    expected: sections render in the saved order
postconditions:
  - account_type_order preference holds the new order
business_rules:
  - order must be an array of strings, each in User::ACCOUNT_TYPES or used as the type of an account in a budget the user can access (account types are free text)
  - default order is User::ACCOUNT_TYPES when nothing is saved
  - on a failed save the client rebuilds the previous order
  - generic POST /api/preferences/{key} only accepts whitelisted keys (currently account_type_order, validated as a distinct array of allowed types); any other key is rejected with 422 on 'key'
  - Show.vue's save sends Accept application/json so validation failures come back as 422 JSON
scenarios:
  - id: save_order
    kind: happy_path
    description: Posting a valid order stores it and returns it.
    coverage: covered
    tests:
      - tests/Feature/Preferences/PreferenceValidationTest.php::saving an account type order accepts custom types used in the users budgets
  - id: saved_order_returned
    kind: happy_path
    description: GET account-type-order returns the saved order, or ACCOUNT_TYPES by default.
    coverage: covered
    tests:
      - tests/Feature/Preferences/PreferenceScopingTest.php::the account type order defaults to the standard types and returns the saved order
  - id: unknown_type_rejected
    kind: validation
    description: An order containing a type outside the allowed types, or a non-array, is rejected with 422.
    coverage: covered
    tests:
      - tests/Feature/Preferences/PreferenceValidationTest.php::saving an account type order with an unknown type or a non-array is rejected
  - id: custom_account_types_accepted
    kind: alternate
    description: An order containing a custom (non-default) type used by an account in the user's budgets is accepted; a type only used in another user's budget is rejected.
    coverage: covered
    tests:
      - tests/Feature/Preferences/PreferenceValidationTest.php::saving an account type order accepts custom types used in the users budgets
      - tests/Feature/Preferences/PreferenceValidationTest.php::saving an account type order rejects custom types that only exist in another users budget
  - id: generic_preference_round_trip
    kind: alternate
    description: Writing a value via POST /api/preferences/{key} is returned by GET /api/preferences/{key}.
    coverage: covered
    tests:
      - tests/Feature/Preferences/PreferenceValidationTest.php::a whitelisted preference written via the generic endpoint is returned by it
  - id: generic_endpoint_whitelist
    kind: validation
    description: The generic endpoint rejects keys outside the whitelist (e.g. active_budget_id, budget_*_projection_months) and invalid values for whitelisted keys with 422, storing nothing.
    coverage: covered
    tests:
      - tests/Feature/Preferences/PreferenceValidationTest.php::the generic preference endpoint rejects keys outside the whitelist
      - tests/Feature/Preferences/PreferenceValidationTest.php::the generic preference endpoint validates whitelisted values
  - id: failed_save_reverts_ui
    kind: recovery
    description: When the save fails the dragged sections snap back to the previous order.
    coverage: uncovered
    note: client-side behaviour; needs a browser test.
  - id: preferences_scoped_to_user
    kind: authorization
    description: Preferences are always read and written for the authenticated user; guests get 401/redirect.
    coverage: covered
    tests:
      - tests/Feature/Preferences/PreferenceScopingTest.php::preferences are read and written only for the authenticated user
      - tests/Feature/Preferences/PreferenceScopingTest.php::guests cannot read or write preferences
known_issues:
  - GET /api/preferences/account-type-order and the generic show/update endpoints have no frontend caller.
confidence: medium
evidence:
  - routes/web.php preferences routes inside the auth group
  - app/Http/Controllers/Api/UserPreferencesController.php
  - app/Models/User.php, app/Models/UserPreference.php
  - app/Http/Controllers/BudgetController.php userAccountTypeOrder prop
last_verified: null
