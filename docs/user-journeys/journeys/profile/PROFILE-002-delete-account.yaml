schema: 1
id: PROFILE-002
name: User deletes their account
domain: profile
status: implemented
priority: medium
summary: >
  From the profile page the user confirms account deletion in a modal by
  typing their account email. Deletion is only allowed when the session
  authenticated (passkey, magic link or trusted device) within
  auth.delete_account_reauth_minutes (default 15). On success they are logged
  out and AccountDeletionService runs: each budget they primarily own and share
  passes to the longest-standing other owner (BudgetSharingService::leave()
  succession; deletion is blocked when no other owner exists), each unshared
  budget is destroyed with full S3/Plaid cleanup (BudgetDeletionService), and
  their files, attachments and scenarios on budgets that live on are reassigned
  to that budget's primary owner. Then their passkeys and the user row are
  deleted, the session invalidated and they are redirected to /.
actors:
  - authenticated user
preconditions:
  - user is authenticated
routes:
  - profile.edit
  - profile.destroy
depends_on:
  - path: app/Services/AccountDeletionService.php
    reason: resolved from the container in destroy(); succession, unshared budget cleanup and authorship reassignment
  - path: app/Services/BudgetDeletionService.php
    reason: destroys unshared budgets with their attachments, S3 objects and Plaid items
  - path: app/Console/Commands/CleanupOrphanedFiles.php
    reason: scheduled daily in routes/console.php; retries S3 deletes of files the deletion could not remove
  - path: app/Services/GoogleCalendarService.php
    reason: revokeAccess() revokes each calendar connection's Google grant after the user is deleted
  - path: app/Services/BudgetSharingService.php
    reason: leave() hands a shared budget to the longest-standing other owner
  - path: resources/js/Pages/Profile/Partials/DeleteUserForm.vue
    reason: confirmation modal with the type-your-email field
  - path: app/Listeners/RecordAuthenticationTime.php
    reason: Login event listener that stamps auth.authenticated_at in the session, checked by destroy()
  - path: app/Providers/EventServiceProvider.php
    reason: registers RecordAuthenticationTime for Illuminate\Auth\Events\Login
steps:
  - action: read the warning (budgets they share pass to another owner, files they added to others' budgets stay there, everything else is permanently deleted), click Delete Account and type the account email
    expected: modal submits DELETE /profile with email
  - action: server checks the email (case-insensitive) and that the session authenticated recently
    expected: if they are the last owner of a shared budget, an email error and nothing changes; otherwise user logged out, shared budgets handed on, unshared budgets destroyed, passkeys and user deleted, session invalidated, redirect to /
postconditions:
  - the user record, its passkeys (and any legacy laragear webauthn_credentials rows), trusted devices, magic-link tokens and calendar connections no longer exist, and each calendar connection's Google grant is revoked
  - budgets only the user had access to no longer exist, nor do their attachments, unused S3 objects or Plaid items
  - shared budgets the user primarily owned now belong to the longest-standing other owner (owner or legacy admin member) and keep everything the user added
business_rules:
  - email is required and must equal the account email, ignoring case
  - "session auth.authenticated_at must be within auth.delete_account_reauth_minutes; otherwise the email error is \"For your security, sign in again before deleting your account.\""
  - passkeys are deleted explicitly (they also cascade via FK) and the legacy laragear webauthn_credentials rows, kept after the move to laravel/passkeys, are deleted explicitly (polymorphic, no FK); trusted devices, magic-link tokens, memberships and preferences cascade via FKs
  - calendar connections cascade with the user; their Google grants are revoked after the deletion commits, logged and non-blocking (a Google failure never stops the deletion)
  - a shared budget the user primarily owns passes to the longest-standing owner member (budget_user created_at, then id), as leaving would; with no owner member deletion is blocked with "You are the last owner of \"<name>\". Make another member an owner, or delete the budget, before deleting your account." and nothing is changed or logged out
  - an unshared budget is destroyed like BUDGET-005 (attachments, unused S3 objects, Plaid items, activity-log history); activity on shared budgets that live on is kept, as is the user's causer reference in it
  - budgets that live on include any budget holding the user's scenarios or attachments, even one they were removed from or left, not only current memberships
  - on budgets that live on, the user's scenarios (scenarios.user_id), attachments (file_attachments.attached_by) and files (files.uploaded_by) pass to the budget's primary owner; a file whose content the owner already has a record for merges into that record (a duplicate attachment on the same item is dropped); a file attached nowhere is removed with its S3 object when unused
  - a file whose S3 object cannot be deleted (the s3 disk returns false or throws) is kept with uploaded_by set to null instead of cascading with the user, and the daily files:cleanup-orphans command (FileService::cleanupOrphanedFiles, files unattached and unchanged for 24 hours) retries the S3 delete and removes the record
scenarios:
  - id: account_deleted
    kind: happy_path
    description: A user in a freshly authenticated session who types their email is logged out and deleted.
    coverage: covered
    tests:
      - tests/Feature/ProfileTest.php::test_user_can_delete_their_account
      - tests/Feature/DeleteAccountTest.php::signing in with a magic link records the authentication time used by account deletion
  - id: wrong_password_rejected
    kind: validation
    description: A typed email that does not match the account returns an email error and keeps the account.
    coverage: covered
    tests:
      - tests/Feature/ProfileTest.php::test_correct_email_must_be_provided_to_delete_account
      - tests/Feature/DeleteAccountTest.php::account deletion is rejected when the typed email does not match
    note: id kept for coverage-baseline continuity; confirmation is now the typed email, not a password.
  - id: passkey_only_user_can_delete
    kind: edge
    description: A user created via passkey registration (null password) can delete their account.
    coverage: covered
    tests:
      - tests/Feature/DeleteAccountTest.php::a passkey only user can delete their account by typing their email in a fresh session
  - id: stale_session_rejected
    kind: authentication
    description: A session that authenticated more than the re-auth window ago (or never recorded a sign-in time) cannot delete the account.
    coverage: covered
    tests:
      - tests/Feature/DeleteAccountTest.php::account deletion is rejected when the session authenticated more than the reauth window ago
      - tests/Feature/DeleteAccountTest.php::account deletion is rejected when the session has no recorded sign in time
  - id: login_paths_record_authentication_time
    kind: integration
    description: Every login path stamps auth.authenticated_at in the session.
    coverage: covered
    tests:
      - tests/Feature/DeleteAccountTest.php::signing in with a magic link records the authentication time used by account deletion
      - tests/Feature/DeleteAccountTest.php::a trusted device auto login records the authentication time
      - 'tests/Feature/Auth/PasskeyLoginCeremonyTest.php::signing in with a passkey records the authentication time used by account deletion'
  - id: related_data_cleanup
    kind: integration
    description: Deleting the user removes their passkeys (and legacy laragear credential rows), trusted devices and magic-link tokens.
    coverage: covered
    tests:
      - tests/Feature/DeleteAccountTest.php::a passkey only user can delete their account by typing their email in a fresh session
      - tests/Feature/DeleteAccountTest.php::deleting an account also removes the users legacy laragear credentials
  - id: unshared_budgets_destroyed_with_cleanup
    kind: integration
    description: Budgets nobody else shares are destroyed with their attachments, S3 objects and Plaid items.
    coverage: covered
    tests:
      - tests/Feature/DeleteAccountTest.php::deleting an account destroys unshared budgets with their S3 objects and Plaid items
  - id: shared_budget_passes_to_next_owner
    kind: alternate
    description: A shared budget passes to the longest-standing other owner and keeps the deleting user's files and scenarios under that owner.
    coverage: covered
    tests:
      - tests/Feature/DeleteAccountTest.php::deleting an account hands a shared budget to the longest-standing other owner and keeps the users files on it
  - id: destroyed_budget_activity_erased
    kind: integration
    description: Activity history of the budgets destroyed with the account is erased; that of shared budgets handed on is kept.
    coverage: covered
    tests:
      - tests/Feature/DeleteAccountTest.php::deleting an account erases the activity history of its destroyed budgets and keeps that of shared ones
  - id: last_owner_of_shared_budget_blocked
    kind: validation
    description: The last owner of a shared budget (other members are editors or viewers) cannot delete their account until another member is an owner or the budget is deleted.
    coverage: covered
    tests:
      - tests/Feature/DeleteAccountTest.php::account deletion is blocked while the user is the last owner of a shared budget
  - id: member_contributions_kept
    kind: alternate
    description: A member deleting their account leaves their receipts and scenarios on the owner's budget, reassigned to the owner.
    coverage: covered
    tests:
      - tests/Feature/DeleteAccountTest.php::a member deleting their account leaves their receipts and scenarios on the owners budget
  - id: former_member_contributions_kept
    kind: edge
    description: A member who was removed from (or left) a budget and later deletes their account still leaves their receipts and scenarios there, reassigned to the owner.
    coverage: covered
    tests:
      - tests/Feature/DeleteAccountTest.php::a removed member deleting their account leaves their receipts and scenarios on the owners budget
  - id: failed_s3_delete_left_for_cleanup
    kind: recovery
    description: When S3 deletes fail during account deletion, the user is still deleted, their undeletable files are detached from them and kept, and the scheduled orphan cleanup reclaims the objects once S3 works.
    coverage: covered
    tests:
      - tests/Feature/Files/OrphanedFileCleanupTest.php::a file whose S3 delete fails during account deletion is detached from the user and kept for cleanup
      - tests/Feature/Files/OrphanedFileCleanupTest.php::files:cleanup-orphans removes old unattached files and keeps attached, recent and still failing ones
      - tests/Feature/Files/OrphanedFileCleanupTest.php::files:cleanup-orphans is scheduled daily
  - id: device_cookie_cleared
    kind: integration
    description: The device_token cookie is expired on the deletion response.
    coverage: covered
    tests:
      - tests/Feature/DeleteAccountTest.php::deleting an account clears the trusted device cookie
  - id: calendar_grants_revoked
    kind: integration
    description: Deleting the account revokes the Google grant of each calendar connection; a Google failure does not block the deletion.
    coverage: covered
    tests:
      - tests/Feature/Calendar/CalendarGrantRevocationTest.php::deleting an account revokes the google grant of each calendar connection
      - tests/Feature/Calendar/CalendarGrantRevocationTest.php::a failed google revocation does not block account deletion
  - id: guest_cannot_delete
    kind: authentication
    description: A guest DELETE /profile is redirected to login.
    coverage: covered
    tests:
      - tests/Feature/DeleteAccountTest.php::a guest cannot delete an account
known_issues: []
confidence: medium
evidence:
  - app/Http/Controllers/ProfileController.php destroy()
  - app/Services/AccountDeletionService.php
  - database/migrations/2026_01_05_210006_make_password_nullable_in_users_table.php
  - app/Http/Controllers/PasskeyAuthController.php registerStore() creates users without a password
  - app/Listeners/RecordAuthenticationTime.php
