schema: 1
id: PROPERTY-002
name: Owner updates, re-links or deletes a property
domain: properties
status: implemented
priority: medium
summary: >
  From the properties list or the dashboard the owner edits a property's value and
  details, changes which liability accounts are linked to it, or deletes it
  (unlinking its accounts first). Every action returns to the properties list; the
  show URL has no page of its own and redirects to the edit form.
actors:
  - budget owner
preconditions:
  - user owns the budget and the property belongs to it
routes:
  - budgets.properties.edit
  - budgets.properties.update
  - budgets.properties.destroy
  - budgets.properties.show
depends_on:
  - path: resources/js/Pages/Properties/Edit.vue
    reason: edit form sending linked_account_ids
integrations: []
steps:
  - action: open /budgets/{budget}/properties/{property}/edit
    expected: Properties/Edit rendered with liability accounts that are unlinked or linked to this property
  - action: save (PUT /budgets/{budget}/properties/{property})
    expected: property updated; value_updated_at refreshed when the value changed; linked accounts replaced; redirect to budgets.properties.index
  - action: delete from the list (DELETE /budgets/{budget}/properties/{property})
    expected: accounts unlinked and property deleted; redirect to budgets.properties.index
postconditions:
  - property updated or removed; account.property_id links consistent
business_rules:
  - when linked_account_ids is present, all existing links are cleared and the given in-budget accounts are linked
  - value_updated_at is refreshed only when current_value_cents changes numerically (string form input is compared as an integer)
scenarios:
  - id: update_property
    kind: happy_path
    description: Valid update persists changes and links.
    coverage: covered
    tests:
      - tests/Feature/Properties/PropertyLifecycleTest.php::updating a property redirects to the properties list
  - id: value_timestamp_only_on_change
    kind: edge
    description: Saving the same value keeps value_updated_at; a changed value refreshes it.
    coverage: covered
    tests:
      - tests/Feature/Properties/PropertyLifecycleTest.php::saving a property with an unchanged value keeps its value timestamp
      - tests/Feature/Properties/PropertyLifecycleTest.php::saving a property with a changed value refreshes its value timestamp
  - id: delete_property_unlinks_accounts
    kind: happy_path
    description: Deleting a property clears property_id on its accounts.
    coverage: covered
    tests:
      - tests/Feature/Properties/PropertyLifecycleTest.php::deleting a property unlinks its accounts and redirects to the properties list
  - id: invalid_update_rejected
    kind: validation
    description: Invalid fields return validation errors and nothing changes.
    coverage: covered
    tests:
      - tests/Feature/Properties/PropertyValidationTest.php::updating a property with invalid fields is rejected
  - id: show_redirects_to_edit
    kind: edge
    description: GET show (no standalone page) authorizes view and redirects to the property's edit form.
    coverage: covered
    tests:
      - tests/Feature/Properties/PropertyLifecycleTest.php::opening a property show url redirects to its edit page
      - tests/Feature/Properties/PropertyLifecycleTest.php::another users property show url is forbidden
  - id: other_users_property_forbidden
    kind: authorization
    description: Edit/update/delete under another user's budget return 403; a property from another budget returns 404 via scopeBindings.
    coverage: uncovered
known_issues: []
confidence: high
evidence:
  - app/Http/Controllers/PropertyController.php show/edit/update/destroy
last_verified: null
