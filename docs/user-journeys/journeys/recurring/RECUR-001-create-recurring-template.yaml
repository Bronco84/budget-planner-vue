schema: 1
id: RECUR-001
name: User creates a recurring transaction template
domain: recurring
status: implemented
priority: high
summary: >
  From the sidebar (or the "Make Recurring" action on a budget transaction) the user
  opens the recurring transactions list, fills in the create form (amount or dynamic
  amount, frequency and schedule, optional matching rules, optional autopay credit card
  link) and saves. The template drives every future projection for its account; any
  inline rules are saved and existing transactions matching them are linked immediately.
actors:
  - authenticated budget owner
preconditions:
  - user owns a budget with at least one account
routes:
  - recurring-transactions.redirect
  - recurring-transactions.index
  - recurring-transactions.create
  - recurring-transactions.store
depends_on:
  - path: resources/js/Components/Sidebar.vue
    reason: sidebar entry links to recurring-transactions.redirect
  - path: app/Services/RecurringTransactionService.php
    reason: linkMatchingTransactionsByRules links existing transactions after inline rules are saved
integrations: []
steps:
  - action: open /recurring-transactions from the sidebar
    expected: redirected to the active budget's recurring list, or to budgets.create when there is no active budget
  - action: view budget/{budget}/recurring-transactions
    expected: RecurringTransactions/Index lists templates ordered by description with their account; empty state text when none exist
  - action: open the create form (optionally with ?from_transaction=<id>)
    expected: RecurringTransactions/Create rendered with budget accounts, autopay-eligible credit cards and the source transaction prefilled when it belongs to the budget
  - action: submit the form (POST budget/{budget}/recurring-transactions)
    expected: template stored with amount converted to cents; redirect to index with "Recurring transaction created successfully"
postconditions:
  - a RecurringTransactionTemplate exists for the budget
  - inline rules are stored with priority by array order and matching transactions are linked
  - when from_transaction_id was supplied and still unlinked, that transaction is linked to the new template
business_rules:
  - frequency is one of daily, weekly, biweekly, monthly, bimonthly, quarterly, yearly
  - day_of_week is required for weekly/biweekly; day_of_month for monthly, quarterly and bimonthly
  - bimonthly requires first_day_of_month and it must differ from day_of_month
  - amount is required unless is_dynamic_amount is true; dynamic templates store amount_in_cents 0
  - min_amount/max_amount are stored in cents with the sign of the main amount
  - end_date must be on or after start_date
  - create and store require the budget update ability; index requires view
scenarios:
  - id: create_fixed_template
    kind: happy_path
    description: Owner creates a fixed-amount monthly template and is redirected to the index.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringTemplateCreateTest.php::an owner creates a fixed amount monthly template and returns to the index
  - id: create_with_inline_rules_links_transactions
    kind: alternate
    description: Inline rules are saved in order and existing matching transactions are linked to the new template.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringTemplateCreateTest.php::inline rules are saved in order and existing matching transactions are linked
  - id: make_recurring_from_transaction
    kind: alternate
    description: Creating from an existing transaction prefills the form and links that transaction after save.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringTemplateCreateTest.php::making a transaction recurring prefills the form and links that transaction after save
  - id: redirect_without_active_budget
    kind: edge
    description: /recurring-transactions sends a user with no active budget to budgets.create.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringTemplateCreateTest.php::the recurring shortcut sends a user without a budget to create one
      - tests/Feature/Recurring/RecurringTemplateCreateTest.php::the recurring shortcut opens the active budgets recurring list
  - id: empty_list
    kind: empty_state
    description: A budget with no templates shows the "No recurring transactions have been set up yet" message.
    coverage: partial
    tests:
      - tests/Feature/Recurring/RecurringTemplateCreateTest.php::a budget with no templates renders an empty recurring list
    note: the empty recurringTransactions prop is asserted; the "No recurring transactions" message is rendered by Index.vue with no browser test.
  - id: schedule_validation
    kind: validation
    description: Missing day_of_week/day_of_month for the chosen frequency, or a bimonthly pair with identical days, is rejected.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringTemplateCreateTest.php::a schedule missing its day for the chosen frequency is rejected
  - id: amount_required_unless_dynamic
    kind: validation
    description: A non-dynamic template without an amount fails validation; a dynamic one is saved with amount_in_cents 0.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringTemplateCreateTest.php::a fixed amount template requires an amount
      - tests/Feature/Recurring/RecurringTemplateCreateTest.php::a dynamic amount template without an amount is saved with zero cents
  - id: cents_conversion_precision
    kind: edge
    description: Decimal amounts such as 19.99 (and min/max amounts) are converted to the exact cent value.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringTemplateAmountTest.php::storing a recurring template converts amounts to the exact cent value
  - id: cross_user_budget_forbidden
    kind: authorization
    description: Another user cannot list, open the create form for, or store a template in a budget they do not own (403).
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringTemplateCreateTest.php::another user cannot list, open the create form for or store templates in a budget
  - id: foreign_account_rejected
    kind: authorization
    description: account_id / linked_credit_card_account_id belonging to another budget is rejected with a validation error and no template is saved.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringCrossBudgetReferenceTest.php::storing a template with an account from another budget is rejected and nothing is saved
      - tests/Feature/Recurring/RecurringCrossBudgetReferenceTest.php::storing a template with an autopay card from another budget is rejected and nothing is saved
  - id: index_does_not_log_accounts
    kind: edge
    description: Opening the recurring index writes no account records to the info log.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringTemplateLifecycleTest.php::the recurring index does not write account records to the log
known_issues: []
confidence: high
evidence:
  - routes/web.php recurring-transactions.redirect closure and recurring-transactions routes
  - app/Http/Controllers/RecurringTransactionController.php index/create/store/getArr
  - resources/js/Pages/RecurringTransactions/Index.vue, Create.vue
last_verified: null
