schema: 1
id: RECUR-003
name: User manages a template's transaction matching rules
domain: recurring
status: implemented
priority: high
summary: >
  On a template's Rules page (or the Rules tab of the detail page) the user adds, edits
  and deletes field/operator/value rules, tests a draft rule against the account's last
  100 transactions, previews which unlinked transactions from the last 90 days match all
  active rules, and applies the rules to link those transactions. Editing or deleting a
  rule re-evaluates every link for the template.
actors:
  - authenticated budget owner
preconditions:
  - user owns a budget with a recurring template attached to an account
routes:
  - recurring-transactions.rules.index
  - recurring-transactions.rules.store
  - recurring-transactions.rules.update
  - recurring-transactions.rules.destroy
  - recurring-transactions.rules.test
  - recurring-transactions.rules.preview
  - recurring-transactions.rules.apply
depends_on:
  - path: app/Models/RecurringTransactionRule.php
    reason: matchesTransaction implements each operator (contains, equals, starts_with, ends_with, regex, greater_than, less_than)
  - path: app/Services/RecurringTransactionService.php
    reason: reevaluateTransactionLinks re-links/unlinks after rule update or delete; link sources for every linking path
  - path: app/Models/Transaction.php
    reason: link_source constants, linkToRecurringTemplate and clearing link_source on unlink
  - path: app/Http/Controllers/TransactionController.php
    reason: choosing a template on the transaction form records a manual link
  - path: resources/js/Pages/RecurringTransactions/Partials/RecurringTransactionRules.vue
    reason: rules tab on the template detail page uses the same endpoints
integrations: []
steps:
  - action: open budget/{budget}/recurring-transactions/{recurring_transaction}/rules
    expected: RecurringTransactions/Rules/Index with rules ordered by priority plus field/operator options
  - action: add a rule (POST .../rules)
    expected: rule created active, case-insensitive by default, priority max+1 when omitted; redirect to rules index
  - action: test a draft rule (POST .../rules/test)
    expected: RecurringTransactions/Rules/Test rendered with matches among the account's latest 100 transactions
  - action: preview active rules (GET .../rules/preview)
    expected: RecurringTransactions/Rules/Preview lists unlinked last-90-day transactions matching ALL active rules; hasActiveRules false when none
  - action: apply rules (POST .../rules/apply)
    expected: matching unlinked transactions linked; flash "Successfully linked N transactions..." or "No matching transactions found."
  - action: edit or delete a rule (PATCH/DELETE .../rules/{rule})
    expected: links re-evaluated with RecurringTransactionRule::matchesTransaction; redirect to the rules index (like store and apply) with linked/unlinked counts. Deleting the last rule leaves existing links untouched
postconditions:
  - rule set and transaction links reflect the user's changes
business_rules:
  - rules combine with AND logic; a transaction must match every active rule
  - preview and apply only consider unlinked transactions on the template's account dated within the last 90 days
  - a template whose account was deleted (account_id null) has nothing to test, preview or apply against; those actions return empty results instead of erroring
  - store, update, destroy and apply all redirect to the rules index
  - field must be description, amount or category; operator must be one of the seven supported operators
  - "{rule} is scoped to the template and the template to the budget, so foreign ids return 404"
  - index, test and preview need budget view; store, update, destroy and apply need budget update
  - a regex rule value is a full PCRE pattern including delimiters (e.g. /^netflix/); store, update and test (and the template create/edit forms' inline rules, via the shared ValidRegexRulePattern rule) reject patterns preg_match cannot compile, compiled exactly as matchesTransaction runs them
  - a regex pattern is never lowercased; a case-insensitive regex rule runs the pattern as written with the i modifier appended, so escapes like \S, \D and \W keep their meaning (other string operators lowercase both sides)
  - every link records transactions.link_source - manual (Make Recurring, the transaction form, bulk-linking chosen suggestions), rule (apply, re-evaluation, inline rules, Plaid auto-link by rules), entity (Plaid entity id), description (description match) or analysis (pattern confirmation); unlinking clears it; links made before the column existed are null (unknown)
  - re-evaluation after a rule update or delete only unlinks links whose link_source is rule; manual, entity, description, analysis and null links are never removed; newly matching unlinked transactions are linked with link_source rule; with no active rules left nothing is re-evaluated
  - service-side rule matching (RecurringTransactionService::findTransactionsMatchingAllRules, behind dynamic amounts, re-evaluation and inline/Plaid rule linking) only considers transactions on the template's account (the whole budget when it has none) dated within the last RULE_MATCH_LOOKBACK_MONTHS (12) months, loaded without the raw Plaid rows; re-evaluation keeps rule links outside that window instead of unlinking them
scenarios:
  - id: add_rule_and_apply
    kind: happy_path
    description: Owner adds a rule, previews matches and applies them, linking the matching transactions with link_source rule.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringLinkSourceTest.php::applying rules records rule as the link source
      - tests/Feature/Recurring/RecurringTransactionRuleRegexTest.php::storing a regex rule with a valid pattern succeeds and previews matches
      - tests/Feature/Recurring/RecurringRuleManagementTest.php::an owner adds a rule, previews its matches and applies them to link the transactions
  - id: test_draft_rule
    kind: alternate
    description: Testing a draft rule shows matches without persisting the rule.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringRuleManagementTest.php::testing a draft rule shows its matches without saving the rule
  - id: update_rule_reevaluates_links
    kind: alternate
    description: Editing a rule unlinks rule-made links that no longer match and links newly matching ones.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringLinkSourceTest.php::a manual link survives rule re-evaluation while a stale rule link is unlinked
      - tests/Feature/Recurring/RecurringRuleReevaluationTest.php::updating a rule to a delimited regex links matching transactions
      - tests/Feature/Recurring/RecurringRuleManagementTest.php::editing a rule unlinks transactions that no longer match and links newly matching ones
  - id: reevaluation_uses_rule_matching
    kind: edge
    description: Re-evaluation matches exactly like test/preview/apply (delimited regex, absolute dollar amounts, case sensitivity); a stored regex that doesn't compile matches nothing instead of erroring.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringRuleReevaluationTest.php::updating a rule to a delimited regex links matching transactions
      - tests/Feature/Recurring/RecurringRuleReevaluationTest.php::re-evaluation matches amount rules the same way the rule preview does
      - tests/Feature/Recurring/RecurringRuleReevaluationTest.php::a stored regex rule that does not compile matches nothing instead of erroring
  - id: preview_without_active_rules
    kind: empty_state
    description: Preview with no active rules renders hasActiveRules false; apply redirects with "No active rules to apply".
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringRuleManagementTest.php::with no active rules preview reports none and apply links nothing
  - id: invalid_operator_rejected
    kind: validation
    description: Unknown field/operator values or an empty value fail validation.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringRuleValidationTest.php::storing a rule with an unknown field or operator or an empty value is rejected
      - tests/Feature/Recurring/RecurringRuleValidationTest.php::updating a rule with an unknown field or operator or an empty value is rejected
  - id: invalid_regex_rule
    kind: edge
    description: A regex rule with an invalid pattern should be rejected or handled without a server error.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringTransactionRuleRegexTest.php::storing a regex rule with a malformed pattern is rejected
      - tests/Feature/Recurring/RecurringTransactionRuleRegexTest.php::updating a rule to a malformed regex pattern is rejected
      - tests/Feature/Recurring/RecurringTransactionRuleRegexTest.php::testing a draft rule with a malformed regex pattern is rejected
  - id: case_insensitive_regex_keeps_escapes
    kind: edge
    description: A case-insensitive regex rule such as /^AMZN\S+/ matches with the i modifier instead of a lowercased pattern, so \S, \D and \W are not turned into \s, \d and \w; case-sensitive rules match case exactly.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringTransactionRuleRegexTest.php::case insensitive regex rules keep escape classes as written
      - tests/Feature/Recurring/RecurringTransactionRuleRegexTest.php::case sensitive regex rules match case exactly
      - tests/Feature/Recurring/RecurringTransactionRuleRegexTest.php::a case insensitive regex rule with escape classes is accepted and links what it describes
  - id: delete_last_rule_keeps_links
    kind: edge
    description: Deleting the only active rule leaves the template's existing links (entity, description, manual or rule) in place.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringRuleReevaluationTest.php::deleting the last rule keeps transactions linked by other means
  - id: non_rule_links_survive_reevaluation
    kind: edge
    description: Re-evaluation never unlinks manual, entity, description, analysis or unknown (null) links, even when they fail the current rules.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringLinkSourceTest.php::a manual link survives rule re-evaluation while a stale rule link is unlinked
  - id: link_source_recorded
    kind: edge
    description: Each linking path records its source (manual, rule, entity, description, analysis) and unlinking clears it.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringLinkSourceTest.php::plaid auto-linking records whether the entity, a rule or the description matched
      - tests/Feature/Recurring/RecurringLinkSourceTest.php::choosing a template on the transaction form records a manual link and keeps it while unchanged
      - tests/Feature/Recurring/RecurringLinkSourceTest.php::unlinking a transaction clears its link source
      - tests/Feature/Recurring/RecurringLinkSourceTest.php::bulk linking selected suggestions records a manual link
      - tests/Feature/Recurring/RecurringLinkSourceTest.php::templates created from analysis link their pattern transactions with the analysis source
  - id: cross_budget_template_not_found
    kind: authorization
    description: Rules routes for a template that belongs to another budget return 404.
    coverage: covered
    tests:
      - tests/Feature/NestedRouteAuthorizationTest.php::recurring transaction routes reject a cross-budget template with 404
      - tests/Feature/Recurring/RecurringRuleManagementTest.php::rules routes for a template from another budget return 404 and change nothing
      - tests/Feature/Recurring/RecurringRuleManagementTest.php::rules routes for another users budget return 403 and change nothing
  - id: rule_actions_redirect_to_rules_page
    kind: edge
    description: Store, update, apply and destroy all redirect to the rules index.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringRuleRoutesTest.php::rule store update apply and destroy all return to the rules page
  - id: template_without_account
    kind: edge
    description: Test, preview and apply for a template whose account was deleted return empty results (no transactions tested or linked) instead of a server error, and never pick up account-less transactions.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringRuleRoutesTest.php::testing and previewing rules for a template without an account returns empty results
  - id: rule_matching_bounded
    kind: edge
    description: Dynamic amounts and rule linking ignore matches older than 12 months or on another account, average in-window matches as before, never load raw Plaid rows, and re-evaluation keeps out-of-window rule links.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringRuleMatchWindowTest.php::dynamic amounts average only in-window matches on the template account
      - tests/Feature/Recurring/RecurringRuleMatchWindowTest.php::rule matching does not load raw plaid transactions
      - tests/Feature/Recurring/RecurringRuleMatchWindowTest.php::applying rules links only in-window matches on the template account
      - tests/Feature/Recurring/RecurringRuleMatchWindowTest.php::re-evaluation keeps rule links outside the window and still unlinks in-window non-matches
known_issues:
  - Rule-made links stay linked after the last active rule is deleted (with no rules there is nothing to re-evaluate against).
confidence: high
evidence:
  - app/Http/Controllers/RecurringTransactionRuleController.php
  - app/Services/RecurringTransactionService.php reevaluateTransactionLinks
  - resources/js/Pages/RecurringTransactions/Rules/*.vue
last_verified: null
