schema: 1
id: RECUR-006
name: User discovers recurring patterns and creates templates from them
domain: recurring
status: implemented
priority: high
summary: >
  From the recurring list the user opens "Analyze transactions", picks an in-budget
  account and analysis settings (period, minimum occurrences, confidence threshold) and
  runs the analysis. Unlinked transactions are grouped by normalised description, a
  frequency is inferred from spacing, and patterns meeting the thresholds are shown. The
  user selects patterns, confirms/edits them in a modal and creates templates in bulk.
actors:
  - authenticated budget owner
preconditions:
  - user owns a budget with an account that has several months of unlinked transactions
routes:
  - recurring-transactions.analysis
  - recurring-transactions.analysis.analyze
  - GET /budget/{budget}/recurring-transactions-analysis/analyze
  - recurring-transactions.analysis.create-templates
  - GET /budget/{budget}/recurring-transactions-analysis/create-templates
depends_on:
  - path: app/Services/RecurringTransactionAnalysisService.php
    reason: analyzeAccount pattern detection and createTemplatesFromPatterns
  - path: resources/js/Pages/RecurringTransactions/Partials/RecurringTransactionConfirmationModal.vue
    reason: confirmation modal that edits patterns before template creation
integrations: []
steps:
  - action: open budget/{budget}/recurring-transactions-analysis
    expected: RecurringTransactions/Analysis with accounts where include_in_budget is true
  - action: run analysis (POST .../analyze, Inertia form)
    expected: same page re-rendered with analysisResult (patterns, frequency, day, amount, confidence, summary)
  - action: refresh the browser on the POST URL (GET .../analyze or GET .../create-templates)
    expected: redirected back to the analysis page instead of a 405
  - action: select patterns, confirm in the modal and submit (POST .../create-templates)
    expected: templates created and the pattern's transactions linked; redirect to recurring index with "Successfully created N recurring transaction templates."
postconditions:
  - new RecurringTransactionTemplates exist for the account
business_rules:
  - analysis_period_months 3-24 (default 6), min_occurrences 2-10 (default 3), confidence_threshold 0-1 (default 0.6)
  - only unlinked transactions on the chosen account within the period are analysed
  - the account must belong to the budget in the URL (scoped exists validation, otherwise a validation error)
  - pattern transactions linked on create-templates are limited to the budget's own transactions
  - unexpected failures flash a generic "Analysis failed" / "Template creation failed" message; the exception is logged
  - every action is guarded by can:view,budget; create-templates additionally requires the budget update ability
  - each selected_patterns item is validated (description, frequency, start date, amounts, days, transaction ids); a modal confirmation links the transactions that formed the pattern (transaction_ids), limited to the budget's own transactions
  - full success flashes message; any per-item failure flashes error "Created X of Y templates. N could not be created."
  - confirmed templates store average_amount in cents (the confirmed amount); pattern transactions are linked with link_source analysis
scenarios:
  - id: detects_monthly_pattern
    kind: happy_path
    description: Five monthly charges on the same day are detected as a monthly pattern with day_of_month, amount and confidence above threshold.
    coverage: covered
    tests:
      - tests/Feature/Services/RecurringTransactionAnalysisServiceTest.php::detects a monthly recurring charge
  - id: analysis_page_renders
    kind: happy_path
    description: Owner opens the analysis page and runs an analysis through the controller.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringAnalysisPageTest.php::an owner opens the analysis page and runs an analysis
  - id: create_templates_from_confirmation
    kind: happy_path
    description: Confirmed patterns become templates and the user lands on the recurring index with a success flash.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringAnalysisTemplateCreationTest.php::templates confirmed in the modal link the budgets transactions that formed the pattern
      - tests/Feature/Recurring/RecurringLinkSourceTest.php::templates created from analysis link their pattern transactions with the analysis source
  - id: confirmed_average_amount_in_cents
    kind: edge
    description: A confirmed pattern's amount is stored as the template's average_amount in cents.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringAverageAmountCentsTest.php::templates confirmed from analysis store the starting average in cents
  - id: below_min_occurrences_ignored
    kind: edge
    description: Groups with fewer occurrences than min_occurrences are not reported.
    coverage: covered
    tests:
      - tests/Feature/Services/RecurringTransactionAnalysisServiceTest.php::ignores groups below the minimum occurrence threshold
  - id: no_transactions
    kind: empty_state
    description: An account with no unlinked transactions returns success false with a "No unlinked transactions" message and zero totals.
    coverage: covered
    tests:
      - tests/Feature/Services/RecurringTransactionAnalysisServiceTest.php::reports no patterns when the account has no transactions
  - id: settings_validation
    kind: validation
    description: Out-of-range period, occurrence or confidence values fail validation.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringAnalysisPageTest.php::analysis settings outside their allowed ranges are rejected
  - id: bimonthly_confirmation
    kind: edge
    description: A bimonthly pattern confirmed in the modal keeps both days of the month (bimonthly_first_day -> first_day_of_month, bimonthly_second_day -> day_of_month).
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringCrossBudgetReferenceTest.php::a bimonthly pattern confirmed in the modal keeps both days of the month
  - id: refresh_fallback_redirects
    kind: recovery
    description: GET on the analyze/create-templates URLs redirects to the analysis page.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringAnalysisPageTest.php::refreshing the analyze or create templates URL redirects to the analysis page
  - id: cross_user_budget_forbidden
    kind: authorization
    description: Another user cannot open the analysis page or analyse transactions in a budget they do not own.
    coverage: covered
    tests:
      - tests/Feature/NestedRouteAuthorizationTest.php::user cannot open another users recurring transaction analysis
      - tests/Feature/NestedRouteAuthorizationTest.php::user cannot analyze another users transactions
  - id: foreign_account_rejected
    kind: authorization
    description: An account from another budget passed to analyze or create-templates on the user's own budget is rejected with a validation error and nothing is created.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringCrossBudgetReferenceTest.php::analyzing an account from another budget is rejected with a validation error
      - tests/Feature/Recurring/RecurringCrossBudgetReferenceTest.php::creating templates from analysis with an account from another budget is rejected and nothing is created
  - id: foreign_pattern_transactions_not_linked
    kind: authorization
    description: Transaction ids from another budget inside selected_patterns are not linked to the new template; the budget's own ones are.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringCrossBudgetReferenceTest.php::creating templates from analysis does not link transactions from another budget
  - id: failure_message_is_generic
    kind: recovery
    description: An exception during analysis or template creation flashes a generic error without the exception text.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringCrossBudgetReferenceTest.php::analysis failures show a generic message instead of the exception text
      - tests/Feature/Recurring/RecurringCrossBudgetReferenceTest.php::template creation failures show a generic message instead of the exception text
  - id: confirmed_templates_link_pattern_transactions
    kind: alternate
    description: Templates confirmed in the modal link the transactions that formed the pattern (budget-scoped), so they do not reappear in the next analysis.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringAnalysisTemplateCreationTest.php::templates confirmed in the modal link the budgets transactions that formed the pattern
  - id: create_templates_requires_update
    kind: authorization
    description: Creating templates requires the budget update ability, not just view.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringAnalysisTemplateCreationTest.php::creating templates from analysis requires the budget update ability
  - id: selected_patterns_validation
    kind: validation
    description: selected_patterns items with a missing description, unknown frequency, invalid start date, non-numeric amount or out-of-range day are rejected and nothing is created.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringAnalysisTemplateCreationTest.php::selected pattern items with missing or invalid fields are rejected and nothing is created
  - id: partial_failure_flash
    kind: recovery
    description: When some templates fail to be created the redirect uses the error flash with a created/requested count instead of the success flash.
    coverage: covered
    tests:
      - tests/Feature/Recurring/RecurringAnalysisTemplateCreationTest.php::partial template creation failures use the error flash instead of the success flash
known_issues: []
confidence: high
evidence:
  - app/Http/Controllers/RecurringTransactionAnalysisController.php
  - app/Services/RecurringTransactionAnalysisService.php analyzeAccount/createTemplatesFromPatterns/prepareTemplateData
  - routes/web.php GET fallback closures for analyze and create-templates
  - resources/js/Pages/RecurringTransactions/Analysis.vue and Partials/RecurringTransactionConfirmationModal.vue
last_verified: null
