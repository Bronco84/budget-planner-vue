schema: 1
id: REPORT-001
name: User reviews the financial reports dashboard
domain: reports
status: implemented
priority: high
summary: >
  "Reports" in the sidebar opens a tabbed dashboard for the budget: overview stats, net
  worth over time, monthly cash flow and savings rate, category budget performance,
  spending by category and merchant, debt payoff progress and recurring income vs
  expenses (including autopay). The user can filter by a single account and by a date
  preset (30 days, 3/6 months, YTD, year, all) or a custom range.
actors:
  - authenticated budget owner
preconditions:
  - user owns a budget with accounts and transactions
routes:
  - reports.index
depends_on:
  - path: resources/js/Pages/Reports/Tabs/**
    reason: per-report tab components
  - path: resources/js/Components/Sidebar.vue
    reason: Reports navigation entry in the sidebar
integrations: []
steps:
  - action: open budget/{budget}/reports
    expected: Reports/Index with accounts, dateRange (default 6months), overview, netWorth, cashFlow, budgetPerformance, spendingPatterns, debtPayoff and incomeVsExpenses
  - action: choose an account and/or date preset or custom start/end
    expected: page reloads with the filtered data; an account id not in the budget silently falls back to all accounts
postconditions:
  - nothing is persisted
business_rules:
  - historical balance at date = current balance minus the sum of the account's transactions after that date for assets; plus that sum for liabilities (positive debt, negative purchases)
  - net worth = assets minus abs(liability balances); sampling interval is 1, 3, 7, 15 or 30 days depending on range length
  - savings rate = avg net cash flow / avg income x 100, 0 when there is no income
  - budget performance allocation = category monthly amount x months in the range, where each partial calendar month counts as days covered / days in that month
  - budget performance and spending-by-category match transactions to categories by category_id, falling back to the legacy category string for unlinked rows (spending patterns group by the linked category's current name)
  - income vs expenses values each template at its projected amount (RecurringTransactionService::projectedAmount, so dynamic templates use their calculated amount), uses only active templates (started, not ended) and normalises frequencies to monthly (weekly x4.33, biweekly x2.17, bimonthly x2, quarterly /3, yearly /12, daily x30.44)
  - date_range must be one of 30days, 3months, 6months, ytd, year, all, custom; custom start/end dates must fall between 2000-01-01 and 2100-12-31 (invalid input redirects back with validation errors)
  - requires budget view ability
scenarios:
  - id: dashboard_renders
    kind: happy_path
    description: Owner opens reports with default 6-month range and receives every report section.
    coverage: covered
    tests:
      - tests/Feature/Reports/ReportsDashboardTest.php::owner opens reports with the default six month range and receives every section
  - id: account_filter
    kind: alternate
    description: Selecting an account limits net worth, cash flow, performance and spending data to that account.
    coverage: covered
    tests:
      - tests/Feature/Reports/ReportsNetWorthQueryTest.php::net worth filtered to one account matches the pinned values
      - tests/Feature/Reports/ReportsDashboardTest.php::selecting an account limits cash flow performance and spending to that account
  - id: net_worth_series
    kind: happy_path
    description: The net worth series (assets, liabilities, net worth per data point and summary) rolls each account's current balance back by later transactions, computed from one grouped per-account-per-day query rather than one SUM per account per data point.
    coverage: covered
    tests:
      - tests/Feature/Reports/ReportsNetWorthQueryTest.php::net worth series for all accounts matches the pinned values
      - tests/Feature/Reports/ReportsNetWorthQueryTest.php::net worth balances are computed with one grouped query instead of one sum per account per data point
  - id: cash_flow_series
    kind: happy_path
    description: Monthly cash flow lists every calendar month in the range (empty months as zero), with income and expenses bucketed by transaction month in one pass; 'all' starts at January 2000, so its averages include the empty months before the budget's first transaction.
    coverage: covered
    tests:
      - tests/Feature/Reports/ReportsCashFlowTest.php::cash flow monthly totals for all accounts match the pinned values
      - tests/Feature/Reports/ReportsCashFlowTest.php::cash flow filtered to one account matches the pinned values
      - tests/Feature/Reports/ReportsCashFlowTest.php::all time cash flow keeps one entry per month from January 2000 to now
  - id: liability_history_direction
    kind: edge
    description: Historical credit card balances roll back opposite to assets (a purchase after the date means the debt was lower then).
    coverage: covered
    tests:
      - tests/Feature/Reports/ReportsCalculationsTest.php::historical net worth rolls liability balances back in the opposite direction to assets
  - id: budget_performance_prorated
    kind: edge
    description: Category allocations are prorated over the selected range (full and partial months) before comparing with spending.
    coverage: covered
    tests:
      - tests/Feature/Reports/ReportsCalculationsTest.php::budget performance prorates the monthly category allocation over the selected range
      - tests/Feature/Reports/ReportsCalculationsTest.php::budget performance prorates partial months by the days covered
  - id: foreign_account_filter_ignored
    kind: edge
    description: An account_id from another budget is ignored and all accounts are shown.
    coverage: covered
    tests:
      - tests/Feature/Reports/ReportsDashboardTest.php::an account id from another budget is ignored and all accounts are shown
  - id: active_templates_only
    kind: edge
    description: Income vs expenses excludes templates that have ended or not yet started, and includes those ending today.
    coverage: covered
    tests:
      - tests/Feature/Reports/ReportsDashboardTest.php::income vs expenses uses only active templates
  - id: monthly_normalisation
    kind: edge
    description: Weekly, biweekly, bimonthly, quarterly and yearly templates are normalised to correct monthly amounts.
    coverage: covered
    tests:
      - tests/Feature/Reports/ReportsDashboardTest.php::income vs expenses normalises each frequency to a monthly amount
  - id: dynamic_templates_in_income_vs_expenses
    kind: edge
    description: Dynamic-amount templates appear in income vs expenses at the same calculated amount projections use.
    coverage: covered
    tests:
      - tests/Feature/Reports/ReportsCalculationsTest.php::income vs expenses includes dynamic-amount templates at their projected amount
  - id: zero_starting_net_worth
    kind: edge
    description: A starting net worth of 0 yields changePercent 0 instead of division by zero.
    coverage: covered
    tests:
      - tests/Feature/Reports/ReportsDashboardTest.php::a starting net worth of zero yields a zero change percent
  - id: empty_budget
    kind: empty_state
    description: A budget with no accounts or transactions renders all tabs with zero values.
    coverage: covered
    tests:
      - tests/Feature/Reports/ReportsDashboardTest.php::a budget with no accounts or transactions renders every section with zero values
  - id: invalid_custom_range
    kind: validation
    description: An unparsable or inverted custom date range should be rejected.
    coverage: covered
    tests:
      - tests/Feature/Reports/ReportsDateRangeTest.php::reports reject an unparsable or inverted custom date range
      - tests/Feature/Reports/ReportsDateRangeTest.php::reports accept a valid custom date range
  - id: invalid_preset_or_span
    kind: validation
    description: An unknown or non-string date_range preset, or a custom date outside 2000-01-01..2100-12-31, is rejected instead of erroring or looping over centuries.
    coverage: covered
    tests:
      - tests/Feature/Reports/ReportsDateRangeTest.php::reports reject an unknown date range preset or a date outside the supported span
  - id: cross_user_forbidden
    kind: authorization
    description: Another user cannot open reports for a budget they do not own (403).
    coverage: covered
    tests:
      - tests/Feature/Reports/ReportsDashboardTest.php::another user cannot open reports for a budget they do not own
known_issues: []
confidence: medium
evidence:
  - app/Http/Controllers/ReportsController.php
  - resources/js/Pages/Reports/Index.vue
last_verified: null
