schema: 1
id: REPORT-002
name: User views monthly and yearly budget statistics
domain: reports
status: implemented
priority: medium
summary: >
  The statistics pages summarise a budget's transactions for a month (income, expenses,
  totals by category and comparison with the previous month) or for a year (per-month
  income and expenses with prior-year comparison). Both pages link to each other. In the
  current implementation the controller renders Inertia component names that do not
  exist, so neither page can load in the browser.
actors:
  - authenticated budget owner
preconditions:
  - user owns a budget with transactions
routes:
  - budget.statistics.monthly
  - budget.statistics.yearly
depends_on:
  - path: resources/js/Pages/Budgets/Statistics/Monthly.vue
    reason: intended monthly page (controller renders Budgets/MonthlyStatistics instead)
  - path: resources/js/Pages/Budgets/Statistics/Yearly.vue
    reason: intended yearly page (controller renders Budgets/YearlyStatistics instead)
  - path: app/Models/Budget.php
    reason: getMonthlyStatistics and getYearlyStatistics
integrations: []
steps:
  - action: open budget/{budget}/statistics/monthly/{month?}/{year?}
    expected: monthly statistics for the given (default current) month
  - action: open budget/{budget}/statistics/yearly?year=YYYY
    expected: per-month statistics for the given (default current) year with prior-year comparison
postconditions:
  - nothing is persisted
business_rules:
  - income = sum of positive amounts, expenses = sum of negative amounts within the period
  - month and year default to the current date; requires budget view ability
  - monthly route params must be digits with month 1-12 and year 1900-2100 (404 otherwise); the yearly year query param must be an integer 1900-2100 (validation redirect otherwise)
scenarios:
  - id: monthly_page_renders
    kind: happy_path
    description: Owner opens monthly statistics and the Monthly page renders with totals and category breakdown.
    coverage: covered
    tests:
      - tests/Feature/Budgets/BudgetStatisticsTest.php::owner sees the monthly statistics page with totals for the requested month
      - tests/playwright/smoke.spec.js::monthly statistics page loads
  - id: yearly_page_renders
    kind: happy_path
    description: Owner opens yearly statistics and the Yearly page renders twelve months with prior-year comparison.
    coverage: covered
    tests:
      - tests/Feature/Budgets/BudgetStatisticsTest.php::owner sees the yearly statistics page with twelve months and prior year comparison
  - id: yearly_totals_by_month
    kind: edge
    description: Yearly statistics bucket income (> 0) and expenses (< 0) by calendar month for the year and the prior year (month boundaries inclusive, other years and budgets excluded), from a single grouped query.
    coverage: covered
    tests:
      - tests/Feature/YearlyStatisticsQueryTest.php::yearly statistics match the pinned values
      - tests/Feature/YearlyStatisticsQueryTest.php::yearly statistics use a constant number of queries instead of four per month
  - id: month_without_transactions
    kind: empty_state
    description: A month with no transactions shows zero totals and no categories.
    coverage: covered
    tests:
      - tests/Feature/Budgets/BudgetStatisticsTest.php::monthly statistics default to the current month and show zero totals when empty
  - id: invalid_month_or_year
    kind: validation
    description: month outside 1-12 or a non-numeric / out-of-range year is rejected.
    coverage: covered
    tests:
      - tests/Feature/Budgets/BudgetStatisticsTest.php::monthly statistics return 404 for an out-of-range or non-numeric month or year
      - tests/Feature/Budgets/BudgetStatisticsTest.php::yearly statistics reject an out-of-range or non-numeric year
  - id: cross_user_forbidden
    kind: authorization
    description: Another user cannot view monthly or yearly statistics for a budget they do not own (403).
    coverage: covered
    tests:
      - tests/Feature/NestedRouteAuthorizationTest.php::user cannot view another users monthly statistics
      - tests/Feature/NestedRouteAuthorizationTest.php::user cannot view another users yearly statistics
known_issues:
  - The only links to these routes are on the Monthly/Yearly pages themselves, so they are also unreachable from navigation.
confidence: high
evidence:
  - app/Http/Controllers/BudgetController.php monthlyStatistics/yearlyStatistics
  - app/Models/Budget.php getMonthlyStatistics/getYearlyStatistics
  - ls resources/js/Pages/Budgets/Statistics (Monthly.vue, Yearly.vue only)
last_verified: null
