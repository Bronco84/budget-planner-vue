schema: 1
id: SCENARIO-001
name: User compares multi-account projections with what-if scenarios
domain: scenarios
status: implemented
priority: high
summary: >
  "Scenarios" in the sidebar opens the multi-account projection page. The user picks
  accounts and a horizon (1-60 months, default 12) and sees a base weekly balance
  projection per account plus one projection per active scenario, where each scenario's
  adjustments (one-time or recurring expenses, debt paydown, savings contributions) are
  layered on top and "modify existing" adjustments change a recurring template's projected
  occurrences inside their date range. Scenarios can be toggled on and off from the side panel.
actors:
  - authenticated budget owner
preconditions:
  - user owns a budget with accounts; scenarios optional
routes:
  - budget.projections.multi-account
  - budgets.scenarios.index
  - budgets.scenarios.toggle
depends_on:
  - path: resources/js/composables/useMultiAccountProjection.js
    reason: reloads the projection with selected account_ids/scenario_ids/months
  - path: resources/js/composables/useScenarios.js
    reason: axios calls to scenarios index and toggle
  - path: resources/js/Components/ScenarioManager.vue
    reason: scenario side panel
  - path: app/Models/ScenarioAdjustment.php
    reason: generateProjectedTransactions for each adjustment; modifiesTransaction/applyToExistingTransaction for modify_existing
  - path: app/Services/RecurringTransactionService.php
    reason: base projectTransactions and autopay projections
integrations: []
steps:
  - action: open budget/{budget}/projections/multi-account (optionally ?account_ids[]=..&scenario_ids[]=..&months=N)
    expected: Budgets/MultiAccountProjection with accounts, baseProjections, scenarioProjections, scenarios, activeScenarios, recurringTemplates (for the modify-existing picker), monthsAhead and breadcrumbs
  - action: list scenarios (GET budgets/{budget}/scenarios, JSON)
    expected: scenarios with adjustments and accounts, newest first
  - action: toggle a scenario (POST budgets/{budget}/scenarios/{scenario}/toggle)
    expected: JSON with the new is_active value; projection reloaded
postconditions:
  - only scenario is_active changes are persisted
business_rules:
  - with no account_ids all budget accounts are used; any account not in the budget aborts 422
  - with no scenario_ids the scenarios flagged is_active are applied; scenario_ids are filtered to the budget's scenarios
  - each scenario projection = base projection + that scenario's adjustments for the account
  - a modify_existing adjustment changes every projected occurrence of its target template dated within [start_date, end_date] (end optional) in that scenario only - by percent_change (amount x (1 + pct/100), rounded) when set, otherwise to amount_in_cents with the occurrence's income/expense sign; other templates and other scenarios are unaffected
  - monthly and bimonthly adjustment days are clamped to the month's last day (no overflow into the next month)
  - months 1-60; page needs budget view (middleware); toggle needs budget update
scenarios:
  - id: projection_structure
    kind: happy_path
    description: Owner requests two accounts over 3 months with an active scenario and receives base and scenario projections.
    coverage: covered
    tests:
      - tests/Feature/ScenarioTest.php::multi account projection returns correct structure
  - id: list_scenarios
    kind: happy_path
    description: Owner lists the budget's scenarios as JSON.
    coverage: covered
    tests:
      - tests/Feature/ScenarioTest.php::user can list scenarios for a budget
  - id: toggle_scenario
    kind: alternate
    description: Toggling flips is_active and returns the new state; toggling again restores it.
    coverage: covered
    tests:
      - tests/Feature/ScenarioTest.php::user can toggle scenario active state
  - id: one_time_adjustment_math
    kind: edge
    description: A one-time expense inside the window produces exactly one projected transaction of the given amount.
    coverage: covered
    tests:
      - tests/Feature/ScenarioTest.php::scenario adjustment generates correct one time transactions
  - id: recurring_adjustment_math
    kind: edge
    description: A monthly adjustment from the first of the month over 3 months yields 4 occurrences.
    coverage: covered
    tests:
      - tests/Feature/ScenarioTest.php::scenario adjustment generates correct recurring transactions
  - id: scenario_changes_balance
    kind: edge
    description: The scenario projection's balances differ from the base projection by exactly the adjustment amounts.
    coverage: covered
    tests:
      - tests/Feature/ScenarioProjectionQueryTest.php::multi account projection matches the pinned base and scenario values
  - id: modify_existing_amount_in_window
    kind: alternate
    description: A modify-existing adjustment with a new amount changes only the target template's occurrences inside its window, keeping the template's sign.
    coverage: covered
    tests:
      - tests/Feature/Scenarios/ScenarioModifyExistingTest.php::a new amount replaces the template occurrences only inside the window, keeping the template sign
  - id: modify_existing_percentage
    kind: alternate
    description: A modify-existing adjustment with a percentage scales only the target template from its start date; other templates are unaffected.
    coverage: covered
    tests:
      - tests/Feature/Scenarios/ScenarioModifyExistingTest.php::a percentage change scales only the target template from its start date
  - id: base_projection_reused_across_scenarios
    kind: edge
    description: Each account's base projected transactions (recurring, autopay, future manual) are built once and reused for every active scenario.
    coverage: covered
    tests:
      - tests/Feature/ScenarioProjectionQueryTest.php::the base projection is built once per account and reused across scenarios
  - id: month_end_adjustment_day
    kind: edge
    description: A monthly adjustment on day 29-31 lands on the last day of shorter months, including when the range starts after that day.
    coverage: covered
    tests:
      - tests/Feature/ScenarioAdjustmentScheduleTest.php::monthly adjustments on days 29 to 31 fall on the last day of shorter months
  - id: projection_page_does_not_log_autopay
    kind: edge
    description: Opening the multi-account projection page writes nothing to the info log.
    coverage: covered
    tests:
      - tests/Feature/ScenarioAdjustmentScheduleTest.php::the multi account projection page does not write autopay projections to the log
  - id: no_scenarios
    kind: empty_state
    description: A budget with no scenarios shows the empty scenario panel and only base projections.
    coverage: covered
    tests:
      - tests/Feature/Scenarios/ScenarioAccessAndValidationTest.php::the multi account projection without scenarios shows only base projections
  - id: foreign_account_ids
    kind: validation
    description: account_ids including an account from another budget abort with 422.
    coverage: covered
    tests:
      - tests/Feature/Scenarios/ScenarioAccessAndValidationTest.php::the multi account projection rejects an account from another budget with 422
  - id: cross_user_forbidden
    kind: authorization
    description: Another user cannot open the multi-account projection for a budget they do not own.
    coverage: covered
    tests:
      - tests/Feature/NestedRouteAuthorizationTest.php::user cannot view another users multi-account projection
  - id: cross_user_scenario_toggle
    kind: authorization
    description: Another user cannot list or toggle scenarios on a budget they do not own.
    coverage: covered
    tests:
      - tests/Feature/Scenarios/ScenarioAccessAndValidationTest.php::another user cannot list or toggle scenarios on a budget they do not own
known_issues: []
confidence: high
evidence:
  - app/Http/Controllers/ProjectionsController.php showMultiAccountProjection/applyScenarioAdjustments
  - app/Http/Controllers/ScenarioController.php index/toggle
  - app/Models/ScenarioAdjustment.php
  - resources/js/Pages/Budgets/MultiAccountProjection.vue
last_verified: null
