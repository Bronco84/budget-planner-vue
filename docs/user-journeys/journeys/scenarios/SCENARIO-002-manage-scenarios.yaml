schema: 1
id: SCENARIO-002
name: User creates, edits and deletes a what-if scenario
domain: scenarios
status: implemented
priority: high
summary: >
  From the scenario panel on the multi-account projection page the user creates a named,
  coloured scenario with one or more adjustments (one-time expense, recurring expense,
  debt paydown, savings contribution, modify existing) tied to budget accounts, edits it
  later (adjustments are replaced wholesale) or deletes it. All endpoints are JSON and
  called via axios.
actors:
  - authenticated budget owner
preconditions:
  - user owns a budget with at least one account
routes:
  - budgets.scenarios.store
  - budgets.scenarios.show
  - budgets.scenarios.update
  - budgets.scenarios.destroy
depends_on:
  - path: resources/js/composables/useScenarios.js
    reason: axios create/update/delete calls
  - path: resources/js/Components/ScenarioForm.vue
    reason: scenario editor form
  - path: resources/js/Components/ScenarioAdjustmentRow.vue
    reason: adjustment rows and type options
integrations: []
steps:
  - action: create a scenario (POST budgets/{budget}/scenarios)
    expected: 201 JSON with the scenario and its adjustments
  - action: fetch one scenario (GET budgets/{budget}/scenarios/{scenario})
    expected: JSON scenario with adjustments (not currently called by the UI)
  - action: edit the scenario (PATCH)
    expected: 200 JSON; when adjustments are sent, existing adjustments are deleted and recreated
  - action: delete the scenario (DELETE)
    expected: 200 JSON; scenario and its adjustments removed
postconditions:
  - scenario and adjustments are stored, replaced or removed
business_rules:
  - name required; color must be a #RRGGBB hex; at least one adjustment on create
  - adjustment_type in one_time_expense, recurring_expense, debt_paydown, savings_contribution, modify_existing
  - frequency in daily, weekly, biweekly, monthly, bimonthly, quarterly, yearly; bimonthly (twice a month) needs two different days, first_day_of_month and day_of_month (same convention as recurring templates); first_day_of_month is dropped for other frequencies
  - every adjustment account must belong to the budget, else 422 with "One or more accounts do not belong to this budget."
  - create and update run in a DB transaction; scenario is scoped to the budget
  - store/update/destroy need budget update; show needs budget view
scenarios:
  - id: create_with_adjustments
    kind: happy_path
    description: Owner creates a scenario with a one-time and a recurring adjustment; both are persisted.
    coverage: covered
    tests:
      - tests/Feature/ScenarioTest.php::user can create a scenario with adjustments
  - id: update_scenario
    kind: alternate
    description: Updating name, description, colour and adjustments persists the new values.
    coverage: partial
    tests:
      - tests/Feature/ScenarioTest.php::user can update a scenario
    note: asserts the scenario fields only; replacement of adjustments is not asserted.
  - id: delete_scenario
    kind: alternate
    description: Deleting removes the scenario and cascades to its adjustments.
    coverage: covered
    tests:
      - tests/Feature/ScenarioTest.php::user can delete a scenario
  - id: foreign_account_rejected
    kind: validation
    description: An adjustment referencing an account from a different budget is rejected with 422.
    coverage: covered
    tests:
      - tests/Feature/ScenarioTest.php::scenario adjustments must have valid account from budget
  - id: foreign_target_template_rejected
    kind: authorization
    description: An adjustment targeting a recurring template from another budget is rejected with 422 on store and update, with nothing persisted or replaced.
    coverage: covered
    tests:
      - tests/Feature/ScenarioCrossBudgetTest.php::creating a scenario targeting a recurring template from another budget is rejected and nothing is saved
      - tests/Feature/ScenarioCrossBudgetTest.php::updating a scenario to target a recurring template from another budget is rejected and adjustments are unchanged
  - id: server_error_is_generic
    kind: recovery
    description: A 500 from store/update/destroy/toggle returns a generic message without the exception text; the exception is logged.
    coverage: covered
    tests:
      - tests/Feature/ScenarioCrossBudgetTest.php::a scenario store failure returns a generic error without the exception text
      - tests/Feature/ScenarioCrossBudgetTest.php::a scenario toggle failure returns a generic error without the exception text
  - id: invalid_color_or_type
    kind: validation
    description: A non-hex colour or unknown adjustment type fails validation.
    coverage: uncovered
  - id: clear_description
    kind: edge
    description: Sending a null or empty description on update clears it; omitting the key keeps the existing value.
    coverage: covered
    tests:
      - tests/Feature/ScenarioTest.php::user can clear a scenario description by sending null or an empty string
      - tests/Feature/ScenarioTest.php::updating a scenario without a description key keeps the existing description
  - id: cross_user_forbidden
    kind: authorization
    description: Another user's scenario in their own budget returns 403.
    coverage: partial
    tests:
      - tests/Feature/ScenarioTest.php::user cannot access scenarios from another users budget
    note: asserted for show only; store, update and destroy on a foreign budget are not tested.
  - id: cross_budget_not_found
    kind: authorization
    description: A scenario from another budget addressed through the user's own budget returns 404.
    coverage: covered
    tests:
      - tests/Feature/NestedRouteAuthorizationTest.php::scenario routes reject a cross-budget scenario with 404
  - id: bimonthly_adjustment
    kind: alternate
    description: An adjustment can recur twice a month on two days; it is saved with both days and projects on both days each month, clamped to the month end.
    coverage: covered
    tests:
      - tests/Feature/ScenarioAdjustmentScheduleTest.php::a scenario can be saved with a bimonthly adjustment
      - tests/Feature/ScenarioAdjustmentScheduleTest.php::bimonthly adjustments occur on both days of every month, clamped to the month end
      - tests/Feature/ScenarioAdjustmentScheduleTest.php::a leftover first day is ignored for adjustments that are not bimonthly
  - id: bimonthly_days_validation
    kind: validation
    description: A bimonthly adjustment missing either day, or using the same day twice, is rejected with 422.
    coverage: covered
    tests:
      - tests/Feature/ScenarioAdjustmentScheduleTest.php::a bimonthly adjustment needs two different days of the month
known_issues:
  - budgets.scenarios.show is not called by the frontend.
confidence: high
evidence:
  - app/Http/Controllers/ScenarioController.php
  - resources/js/composables/useScenarios.js
  - tests/Feature/ScenarioTest.php
last_verified: null
