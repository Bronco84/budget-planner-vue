schema: 1
id: TXN-003
name: Owner edits, reviews history of, or deletes a transaction
domain: transactions
status: implemented
priority: high
summary: >
  The owner opens a transaction's edit page (showing its recurring template and
  rules when linked, file attachments and an activity log fetched as JSON),
  updates its fields or deletes it, and returns to the transactions list.
actors:
  - budget owner
preconditions:
  - user owns the budget and the transaction belongs to it
routes:
  - budget.transaction.edit
  - budget.transaction.update
  - budget.transaction.destroy
  - budget.transaction.activity-log
  - budget.transaction.keep
depends_on:
  - path: resources/js/Pages/Transactions/Edit.vue
    reason: edit page; loads activity log and attachments via fetch
  - path: app/Models/Transaction.php
    reason: the deleting model hook removes the transaction's attachments and unused files on every model delete (destroy, Nova, console)
  - path: app/Services/FileService.php
    reason: deleteTransactionAttachments, called from the Transaction deleting hook
  - path: resources/js/Components/RemovedByBankNotice.vue
    reason: Keep and Delete actions for a transaction the bank dropped, on the dashboard ledger and the transactions list
integrations: []
steps:
  - action: visit /budget/{budget}/transactions/{transaction}/edit
    expected: Transactions/Edit rendered with accounts, the budget's categories, templates, recurringTemplate and rules
  - action: page fetches /activity-log
    expected: JSON {activities}
  - action: save (PATCH) or delete (DELETE)
    expected: redirect to budget.transaction.index with a flash message
postconditions:
  - transaction updated or deleted; activity recorded
business_rules:
  - same validation as create, scoped to the budget (category_id must belong to the budget)
  - a legacy unlinked category string is offered as its own option and kept when saved unchanged
  - a Plaid transaction marked removed by the bank (see PLAID-003) shows a "Removed by bank" badge with Keep (PATCH budget.transaction.keep, editor role, redirects back) and Delete (budget.transaction.destroy) on the dashboard ledger and the transactions list; keeping it counts it in totals again and sync never marks it again
  - transfer legs (transfer_id set) cannot be updated or deleted here; the request redirects to the transfer's edit page with an error flash (toasted by Transactions/Edit on the visit's success) and nothing changes
  - deleting a transaction deletes its file attachments and every attached file nothing else uses (File row and S3 object); a deleting hook on the Transaction model does this, so a Nova or console delete cleans up the same way (Plaid settlement and duplicate cleanup move the attachments to the kept row first)
scenarios:
  - id: edit_page_renders
    kind: happy_path
    description: Owner can open the edit page.
    coverage: covered
    tests:
      - tests/Feature/Transactions/EditTransactionTest.php::owner can open the edit page for their transaction
      - tests/Feature/Transactions/EditTransactionTest.php::edit page includes the linked recurring template
  - id: update_transaction
    kind: happy_path
    description: Valid update persists and redirects to the list.
    coverage: covered
    tests:
      - tests/Feature/Transactions/EditTransactionTest.php::owner can update their transaction and is redirected to the list
  - id: delete_transaction
    kind: happy_path
    description: Delete removes the transaction and redirects to the list.
    coverage: covered
    tests:
      - tests/Feature/Transactions/EditTransactionTest.php::owner can delete their transaction and is redirected to the list
  - id: delete_removes_attachments
    kind: edge
    description: Deleting a transaction removes its file attachments and deletes each attached file (row and S3 object) that nothing else uses; a file also attached elsewhere is kept.
    coverage: covered
    tests:
      - tests/Feature/Transactions/EditTransactionTest.php::deleting a transaction removes its attachments and every file nothing else uses
  - id: nova_delete_removes_attachments
    kind: edge
    description: Deleting a transaction from Nova (or any model delete) removes its attachments and every attached file nothing else uses, keeping a file still attached elsewhere.
    coverage: covered
    tests:
      - tests/Feature/Transactions/TransactionDeletionAttachmentsTest.php::deleting a transaction from nova removes its attachments, unused files and S3 objects
      - tests/Feature/Transactions/TransactionDeletionAttachmentsTest.php::a model delete of a transaction removes its attachments wherever it is called from
  - id: activity_log_json
    kind: alternate
    description: Activity log endpoint returns formatted activities.
    coverage: covered
    tests:
      - tests/Feature/Transactions/EditTransactionTest.php::activity log returns the transaction history as json
  - id: update_cents_conversion_precision
    kind: edge
    description: Updating with decimal amounts such as 0.29 and 19.99 stores the exact cent value.
    coverage: covered
    tests:
      - tests/Feature/Transactions/EditTransactionTest.php::updating a transaction converts dollars to the exact cent amount
  - id: invalid_update_rejected
    kind: validation
    description: Invalid fields or a foreign account id return validation errors.
    coverage: covered
    tests:
      - tests/Feature/Transactions/EditTransactionTest.php::updating a transaction rejects invalid input and leaves it unchanged
      - tests/Feature/Transactions/EditTransactionTest.php::updating a transaction rejects an account from another budget
  - id: other_users_transaction_forbidden
    kind: authorization
    description: Edit, update and delete of another user's transaction return 403 and it remains.
    coverage: covered
    tests:
      - tests/Feature/SecurityAuthorizationTest.php::user cannot edit another users transaction
      - tests/Feature/SecurityAuthorizationTest.php::user cannot update another users transaction
      - tests/Feature/SecurityAuthorizationTest.php::user cannot delete another users transaction
  - id: cross_budget_transaction_not_found
    kind: authorization
    description: A transaction from another budget under the user's own budget URL returns 404.
    coverage: covered
    tests:
      - tests/Feature/SecurityAuthorizationTest.php::transaction must belong to budget in route
      - tests/Feature/NestedRouteAuthorizationTest.php::transaction routes reject a cross-budget transaction with 404
  - id: transfer_leg_write_blocked
    kind: validation
    description: Updating or deleting a transaction that is a transfer leg is blocked and redirects to budget.transfers.edit with an error; both legs stay unchanged.
    coverage: covered
    tests:
      - tests/Feature/Transactions/EditTransactionTest.php::updating a transfer leg is blocked and points to the transfer edit page
      - tests/Feature/Transactions/EditTransactionTest.php::deleting a transfer leg is blocked and points to the transfer edit page
  - id: activity_log_cross_user
    kind: authorization
    description: Activity log for another user's transaction returns 403.
    coverage: covered
    tests:
      - tests/Feature/Transactions/EditTransactionTest.php::user cannot read the activity log of another users transaction
  - id: update_category_id
    kind: alternate
    description: Updating changes the linked category (copying its name); a category from another budget is rejected and the transaction is unchanged.
    coverage: covered
    tests:
      - tests/Feature/Categories/CategoryLinkingTest.php::updating a transaction changes its category id and rejects another budgets category
  - id: legacy_category_kept
    kind: edge
    description: Saving a legacy transaction whose category matches no budget category keeps its string unlinked.
    coverage: covered
    tests:
      - tests/Feature/Categories/CategoryLinkingTest.php::updating a legacy transaction without choosing a category keeps its legacy name
  - id: keep_transaction_removed_by_bank
    kind: alternate
    description: Keeping a transaction the bank dropped clears the mark, records the choice and redirects back; a viewer gets 403 and another budget's URL 404.
    coverage: covered
    tests:
      - tests/Feature/Plaid/PlaidRemovedByBankTest.php::keeping a transaction counts it again and later syncs never mark it again
      - tests/Feature/Plaid/PlaidRemovedByBankTest.php::a viewer cannot keep a transaction removed by the bank, and another budget cannot reach it
  - id: removed_by_bank_badge_ui
    kind: alternate
    description: The dashboard ledger and the transactions list show the Removed by bank badge, a struck-through amount and Keep/Delete buttons for editors.
    coverage: uncovered
    note: front-end only; build and lint pass, not browser tested yet.
known_issues: []
confidence: high
evidence:
  - app/Http/Controllers/TransactionController.php edit/update/destroy/getActivityLog
last_verified: null
