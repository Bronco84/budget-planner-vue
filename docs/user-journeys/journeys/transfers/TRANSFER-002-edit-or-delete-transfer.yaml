schema: 1
id: TRANSFER-002
name: Owner edits or deletes a transfer
domain: transfers
status: implemented
priority: high
summary: >
  From a transfer leg in the dashboard ledger the owner opens the transfer edit
  page, changes accounts, amount, date or description (both paired transactions
  are re-synced) or deletes the transfer together with its transactions. After
  either action the owner returns to the budget dashboard. The index and show URLs
  have no pages of their own: index redirects to the dashboard, show to the edit form.
actors:
  - budget owner
preconditions:
  - user owns the budget and the transfer belongs to it
routes:
  - budget.transfers.edit
  - budget.transfers.update
  - budget.transfers.destroy
  - budget.transfers.index
  - budget.transfers.show
depends_on:
  - path: resources/js/Pages/Transfers/Edit.vue
    reason: edit form and delete confirmation
  - path: app/Services/TransferService.php
    reason: update re-syncs or recreates the paired transactions; delete removes them
integrations: []
steps:
  - action: click the transfer link on a ledger row (GET /budget/{budget}/transfers/{transfer}/edit)
    expected: Transfers/Edit rendered with the transfer, its accounts and the budget's accounts
  - action: save (PATCH)
    expected: transfer and both legs updated in one DB transaction; redirect to budgets.show
  - action: delete (DELETE)
    expected: transfer and its transactions deleted; redirect to budgets.show
postconditions:
  - transfer legs always mirror the transfer (missing legs are recreated on update)
business_rules:
  - same validation as create
  - destroy additionally requires BudgetPolicy update (same owner rule)
scenarios:
  - id: edit_page_renders
    kind: happy_path
    description: Owner can open the transfer edit page.
    coverage: uncovered
  - id: update_resyncs_legs
    kind: happy_path
    description: Updating amount/accounts/date updates both paired transactions.
    coverage: covered
    tests:
      - tests/Feature/Transfers/TransferPagesTest.php::updating a transfer resyncs both legs and redirects to the budget dashboard
  - id: delete_removes_pair
    kind: happy_path
    description: Deleting removes the transfer and its paired transactions.
    coverage: covered
    tests:
      - tests/Feature/Services/TransferServiceTest.php::delete removes the transfer and its paired transactions
  - id: missing_leg_recreated
    kind: recovery
    description: If a leg was deleted separately, update recreates it.
    coverage: uncovered
  - id: post_action_redirect_to_dashboard
    kind: edge
    description: After a non-JSON update/delete the owner is redirected to budgets.show (the page Transfers/Edit's cancel link returns to).
    coverage: covered
    tests:
      - tests/Feature/Transfers/TransferPagesTest.php::updating a transfer resyncs both legs and redirects to the budget dashboard
      - tests/Feature/Transfers/TransferPagesTest.php::deleting a transfer redirects to the budget dashboard
  - id: invalid_update_rejected
    kind: validation
    description: Same from/to account or amount below 0.01 is rejected.
    coverage: covered
    tests:
      - tests/Feature/Transfers/TransferValidationTest.php::updating a transfer with identical accounts or an amount below one cent is rejected
  - id: cross_budget_transfer_not_found
    kind: authorization
    description: A transfer from another budget under the user's own budget URL returns 404.
    coverage: covered
    tests:
      - tests/Feature/NestedRouteAuthorizationTest.php::transfer routes reject a cross-budget transfer with 404
  - id: other_users_transfer_forbidden
    kind: authorization
    description: Edit/update/delete under another user's budget return 403.
    coverage: uncovered
  - id: index_and_show_redirect
    kind: edge
    description: GET index redirects to budgets.show and GET show redirects to the transfer's edit page; another user's budget returns 403.
    coverage: covered
    tests:
      - tests/Feature/Transfers/TransferPagesTest.php::the transfers index url redirects to the budget dashboard
      - tests/Feature/Transfers/TransferPagesTest.php::the transfer show url redirects to its edit page
      - tests/Feature/Transfers/TransferPagesTest.php::another users transfer urls are forbidden
known_issues:
  - "Update uses ?? for description, so a description cannot be cleared back to the default once set."
confidence: high
evidence:
  - app/Http/Controllers/TransferController.php index/show/edit/update/destroy
  - resources/js/Pages/Budgets/Show.vue (budget.transfers.edit link on transfer rows)
last_verified: null
